name: CodeQL

# Static application security testing (SAST) for the two code surfaces Python
# (ingestion / transform scripts / ml) and the React+TypeScript app. Free for this public repo.
#
# This is the *advanced* (committed-workflow) setup. If GitHub "default setup" for
# CodeQL is enabled in repo Settings → Code security → CodeQL analysis, switch it to
# Advanced first the two configurations conflict and this workflow will error
# ("CodeQL analyses from advanced configurations cannot be processed when the default
# setup is enabled"). The default-setup → advanced switch is recorded in SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Dependabot PRs only touch dependency manifests, lockfiles, and workflow
    # YAMLs none of which are source code CodeQL analyses. Excluding them
    # prevents the workflow from even appearing in the Actions tab.
    paths-ignore:
      - '**/requirements*.txt'
      - 'app/pnpm-lock.yaml'
      - 'app/package.json'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  schedule:
    # Weekly re-scan surfaces advisories published after a PR already merged.
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot PRs only bump dependency versions, never source code.
    # CodeQL still runs on push-to-main and the weekly schedule.
    if: github.actor != 'dependabot[bot]' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # upload SARIF results to the Security tab
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds higher-signal queries beyond the default pack.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
