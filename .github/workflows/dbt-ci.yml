name: dbt CI

on:
  push:
    branches:
      - main
    paths:
      - 'transform/**'
      - 'ingestion/**'
      - '.github/workflows/dbt-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'transform/**'
      - 'ingestion/**'
      - '.github/workflows/dbt-ci.yml'

jobs:
  dbt-build:
    # Dependabot bumps to requirements.txt don't affect dbt models;
    # the duckdb pin is protected by an ignore rule in dependabot.yml.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-duckdb dbt-core sqlfluff sqlfluff-templater-dbt

      - name: Run dbt deps
        working-directory: ./transform
        run: dbt deps

      # Gate 0: parse   catches config errors and missing refs before any data runs.
      - name: Gate 0   dbt parse
        working-directory: ./transform
        run: dbt parse --profiles-dir profiles --target ci

      # Hard failure: a missing fixture set must never let the job pass with every build skipped.
      - name: Check fixture data exists
        run: |
          if [ ! -d "transform/tests/fixtures/bronze/laps" ]; then
            echo "::error::Fixture parquet files not committed. Run ingestion/src/create_fixtures.py locally and commit the output to transform/tests/fixtures/bronze/."
            exit 1
          fi

      - name: Run dbt seed
        working-directory: ./transform
        run: dbt seed --profiles-dir profiles --target ci

      # Gate 1 (fast): staging + reference only   quick smoke test (~2 min).
      - name: Gate 1   fast_build selector (staging + reference)
        working-directory: ./transform
        run: |
          dbt build \
            --profiles-dir profiles \
            --target ci \
            --selector fast_build \
            --vars '{"bronze_base": "../transform/tests/fixtures/bronze", "fits_base": "../transform/tests/fixtures/fits"}'

      # Gate 1b: full build   all models end-to-end.
      - name: Gate 1b   full dbt build (all models + generic tests)
        working-directory: ./transform
        run: |
          dbt build \
            --profiles-dir profiles \
            --target ci \
            --vars '{"bronze_base": "../transform/tests/fixtures/bronze", "fits_base": "../transform/tests/fixtures/fits"}'

      # Byte-stability oracle: fail if any fct_* mart output drifted vs the committed
      # CI baseline (transform/tests/model_hashes.ci.baseline.json), recorded from the
      # fixture warehouse data/ci.duckdb. The dev-sized baseline (model_hashes.baseline.json)
      # is checked by pipeline.yml against data/dev.duckdb. Guards against cosmetic /
      # lint changes silently moving model output. duckdb is pinned in requirements.txt so
      # the float-content hashes match the baseline. Regenerate with `dbt build --target ci`
      # followed by `python scripts/snapshot_model_hashes.py --baseline tests/model_hashes.ci.baseline.json`
      # when model logic changes intentionally.
      - name: Gate 1c   byte-stability oracle (fct_* output)
        working-directory: ./transform
        run: python scripts/snapshot_model_hashes.py --check --baseline tests/model_hashes.ci.baseline.json

      # T27 (WI-07): audit report, not a gate. verify_findings.py re-measures every
      # numbered transform-audit finding directly against the build and prints a
      # PRESENT/CLEARED board on every PR -- signal, not enforcement, because the CI
      # fixture warehouse is 3 small races, not the full multi-season history several
      # findings are defined against (F5, F21, F33 and others need real season spread
      # to mean anything on a fixture build). continue-on-error belt-and-suspenders:
      # main() already always returns 0 and a single check's own exception is caught
      # and reported as ERROR rather than crashing the board, but this step must never
      # be the thing that turns a PR red.
      - name: Audit report   verify_findings.py (non-blocking)
        continue-on-error: true
        env:
          OTP_DB: ${{ github.workspace }}/data/ci.duckdb
        run: python _roadmap/_improvements/reference/transform_forensic_audit_artefacts/verify_findings.py

      # Gate 2: Identity-closure gates   run singular tests in isolation so failures
      # surface as a distinct CI step with a clear label.  dbt build already fails on
      # test failures; this step provides structured JUnit output for PR annotations.
      - name: Gate 2   Identity-closure singular tests
        working-directory: ./transform
        run: |
          dbt test \
            --profiles-dir profiles \
            --target ci \
            --vars '{"bronze_base": "../transform/tests/fixtures/bronze", "fits_base": "../transform/tests/fixtures/fits"}' \
            --select test_type:singular

      # Gate 2–5 (Python layer): run the pytest validation harness.
      # Tests are written to skip gracefully when the models they depend on are not yet
      # materialised, so this step is safe to run at every phase of the build.
      - name: Gates 2–5   pytest validation harness
        env:
          CI_DB_PATH: ${{ github.workspace }}/data/ci.duckdb
          PYTHONPATH: transform
        run: |
          pytest transform/tasks/coefficients/tests/ \
            -v \
            --tb=short \
            --cov=transform/tasks/coefficients \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --junitxml=transform/target/pytest-results.xml

      # Lint SQL   hard failure so style regressions are caught at review time.
      - name: Lint SQL
        working-directory: ./transform
        run: sqlfluff lint models/ --disable-progress-bar

      - name: Generate dbt docs
        working-directory: ./transform
        run: |
          dbt docs generate --profiles-dir profiles --target ci --vars '{"bronze_base": "../transform/tests/fixtures/bronze", "fits_base": "../transform/tests/fixtures/fits"}'

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-artifacts
          path: transform/target/
