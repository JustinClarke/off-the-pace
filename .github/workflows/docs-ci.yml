name: Docs CI

on:
  # Manual run (Actions tab -> Run workflow) so the gate can be checked against main, which
  # owner pushes land on directly (pull_request-only gates otherwise never see main).
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'transform/**'
      - 'ingestion/**'
      - 'ml/**'
      - 'app/**'
      - 'infra/**'
      - '.github/CONTRIBUTING.md'
      - '.github/CONVENTIONS.md'
      - '.github/DATA_PIPELINE.md'
      - '.github/DEPLOYMENT.md'
      - '.github/OBSERVABILITY.md'
      - '.github/PERFORMANCE.md'
      - '.github/SECURITY.md'
      - 'README.md'
      - '**.py'
      - '**.ts'
      - '**.tsx'
      - '**.sh'
      - '**.sql'
      - '**.tf'

jobs:
  validate:
    name: Mintlify validation
    # Dependency bumps never change documentation content.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate Mintlify configuration
        run: |
          cd docs
          npx -y mintlify@latest validate

      - name: Check broken links
        run: |
          cd docs
          npx -y mintlify@latest broken-links

  docs-audit:
    name: Docs audit (README presence + tour footers + file headers)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Run docs audit
        run: python scripts/docs_audit.py --headers

  docs-facts:
    name: Headline-count reconciliation
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check fact consistency
        run: python scripts/docs_facts.py

  lint-comments:
    name: Banned planning/history language check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # transform/tasks/wake_calibration is excluded like _roadmap: it is the wake-calibration
      # research harness, whose comments cite the signed pre-registration by section (§n) on
      # purpose (~416 hits). Re-tighten by dropping that --exclude-dir once the harness is
      # retired or its comments stop citing the plan.
      - name: Fail if banned patterns found in source
        run: |
          ! grep -rn \
            --include="*.ts" --include="*.tsx" --include="*.py" --include="*.sh" \
            --include="*.sql" --include="*.yml" --include="*.yaml" --include="*.tf" \
            -E -f .github/lint-comments-patterns.txt \
            --exclude-dir=".git" --exclude-dir="_roadmap" --exclude-dir="node_modules" \
            --exclude-dir=".venv" --exclude-dir=".agents" --exclude-dir="target" \
            --exclude-dir="wake_calibration" . \
            || { echo "Banned planning/history language in source. See CLEANUP_PLAN.md for the rule."; exit 1; }

  docs-app-audit:
    name: App feature-page coverage
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # --strict: every shipped feature must have an /app/<slug> page. Drop the flag
      # for report mode if you ever need CI to stay green mid-backfill.
      - name: Audit app feature-page coverage
        run: python scripts/app_docs_audit.py --strict

  bronze-coverage-drift:
    name: Bronze coverage snippet drift
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check bronze-coverage.mdx is current
        run: python scripts/ingestion_docs_facts.py

  overview-numbers-drift:
    name: Overview by-the-numbers snippet drift
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check overview-numbers.mdx is current
        run: python scripts/overview_docs_facts.py

  ml-inventory-drift:
    name: ML inventory snippet drift
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install yaml
        run: pip install pyyaml

      - name: Check ml-inventory snippets are current
        run: python scripts/ml_docs_facts.py

  reference-drift:
    name: Reference drift check
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dbt and generators
        # dbt/duckdb pins come from requirements.txt so CI matches local. The old
        # hardcoded dbt-core 1.11.9 caps mashumaro <3.15, which cannot import on Python 3.14.
        run: pip install $(grep -E '^(dbt-core|dbt-duckdb|duckdb)==' requirements.txt)

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps --profiles-dir profiles --target ci

      - name: Parse dbt project
        working-directory: transform
        run: dbt parse --profiles-dir profiles --target ci

      - name: Regenerate reference docs
        run: python scripts/build_reference.py

      - name: Fail if reference docs drifted
        run: |
          if ! git diff --exit-code docs/reference/; then
            echo ""
            echo "Reference docs are out of date."
            echo "Run 'python scripts/build_reference.py' locally and commit the changes."
            exit 1
          fi

  transform-inventory-drift:
    name: Transform test-inventory snippet drift
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dbt and generators
        # dbt/duckdb pins come from requirements.txt so CI matches local. The old
        # hardcoded dbt-core 1.11.9 caps mashumaro <3.15, which cannot import on Python 3.14.
        run: pip install $(grep -E '^(dbt-core|dbt-duckdb|duckdb)==' requirements.txt)

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps --profiles-dir profiles --target ci

      - name: Parse dbt project
        working-directory: transform
        run: dbt parse --profiles-dir profiles --target ci

      - name: Check transform-inventory snippets are current
        run: python scripts/transform_docs_facts.py
