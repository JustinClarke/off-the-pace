name: Release Please

# Versioning & changelog. Conventional-commit history on
# main drives an always-open "release PR" that maintains CHANGELOG.md and the version. Merging
# that PR cuts a GitHub Release + tag, which triggers deploy.yml (on: release: published).
# Rollback of a release = re-publish the previous data manifest (scripts/rollback_cdn.sh);
# see .github/DEPLOYMENT.md.
#
# release-type "simple": this is a polyglot repo, not an npm/pip package, so we track a single
# repo version in .release-please-manifest.json rather than bumping any package file.

on:
  push:
    branches: [main]

permissions:
  contents: write        # create the release PR, tag, and GitHub Release
  pull-requests: write   # open/maintain the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
