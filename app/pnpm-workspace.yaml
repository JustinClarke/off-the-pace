# pnpm 11 reads build-script approvals from here (no longer the package.json "pnpm" field).
# allowBuilds: explicit per-package approval (the non-interactive form of `pnpm approve-builds`).
#   • esbuild Vite's bundler; needs its platform binary.
#   • @sentry/cli postinstall fetches the CLI binary used by @sentry/vite-plugin to upload
#                    source maps. Harmless when source-map upload is off; required
#                    for the deploy build to symbolicate Sentry stacks.
#   • protobufjs left disabled; it doesn't need its install script.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - eslint@10.13.0
  - happy-dom@21.0.3
onlyBuiltDependencies:
  - esbuild
  - '@sentry/cli'

# Transitive-dependency pins (resolve OSV advisories with no direct dependent to bump).
#   • js-yaml only reaches the tree via eslint's @eslint/eslintrc (^4.1.0); GHSA-h67p-54hq-rp68
#     is fixed in 4.2.0, still inside eslintrc's range, so this lifts the floor without a major.
overrides:
  js-yaml: '^4.2.0'
  # W16 dependency-audit floors (patch/minor bumps within the dependents' existing ranges).
  protobufjs: '^7.6.5'
  brace-expansion: '^5.0.12'
  postcss: '^8.5.23'
  nanoid: '^3.3.18'
  browserslist: '^4.28.7'
  source-map-js: '^1.2.2'
  baseline-browser-mapping: '^2.11.0'
  postcss-selector-parser: '^7.1.6'
