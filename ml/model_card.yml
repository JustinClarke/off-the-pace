  validation:
    scheme: season-grouped TimeSeriesSplit (expanding window, n_splits=5); whole seasons move together,
      the final fold validates on 2024
    headline_metric_direction: pinball ↓ (quantiles), macro-F1 ↑ (classifier), RMSE ↓ (stint-life)
    all_models_beat_baseline: true
    baselines:
      degradation_p50: group-mean over (compound, circuit, age-bucket) cells, compound→global fallback
      degradation_p10_p90: empirical 10th/90th percentile in the same cells
      cliff_classifier: majority-class prior (none_in_stint)
      stint_life: cell group-mean of remaining stint life over (compound, circuit, age-bucket), compound→global
        fallback (non-leakage)
    calibration:
      nominal: 0.8
      raw_empirical_coverage: 0.8104889260342666
      conformal_empirical_coverage: 0.8023401587964898
      conformal_q: -0.013631934892314401
      mean_interval_width: 1.2391576766967773
      n: 19144
    leakage_probe:
      accuracy: 0.9981447773732848
      majority_class_accuracy: 0.1675340132085599
      lift_over_chance: 0.8306107641647249
      n_seasons: 7
      note: X carries strong residual temporal signal-race_year recoverable far above chance; race_year
        is correctly excluded from features
    dual_importance:
      degradation_regressor_p50:
        shap_top5:
        - push_residual
        - cliff_onset_passed
        - dirty_air_thermal_load_surface
        - laps_past_cliff
        - dirty_air_share_lap
        permutation_top5:
        - push_residual
        - cliff_onset_passed
        - dirty_air_thermal_load_surface
        - dirty_air_share_lap
        - cumulative_push_load_surface
        agreement_note: 'top-5 differ on: cumulative_push_load_surface, laps_past_cliff-likely correlated
          features or leakage pressure'
      cliff_classifier:
        shap_top5:
        - fuel_mass_kg
        - age_in_stint
        - lap_in_stint
        - lap_number
        permutation_top5:
        - compound_cliff_onset_laps
        - push_residual
        - expected_compound_pace_s
        - lap_number
        - age_in_stint
        agreement_note: 'top-5 differ on: compound_cliff_onset_laps, expected_compound_pace_s, fuel_mass_kg,
          lap_in_stint, push_residual-likely correlated features or leakage pressure'
      stint_life_regressor:
        shap_top5:
        - fuel_mass_kg
        - expected_compound_pace_s
        - compound
        - lap_number
        - track_energy_index
        permutation_top5:
        - fuel_mass_kg
        - track_energy_index
        - expected_compound_pace_s
        - cumulative_push_load_bulk
        - lap_number
        agreement_note: 'top-5 differ on: compound, cumulative_push_load_bulk-likely correlated features
          or leakage pressure'
