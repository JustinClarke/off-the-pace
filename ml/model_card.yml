  deviations:
  - id: D1
    note: Built on XGBoost 3.2.0 (contract said 2.x); ONNX quantile round-trip spiked in M2 before tuning.
  - id: D5
    note: Degradation target is bounded [−10,10]; the majority of jumps are legitimate negatives (fuel
      burn / track evolution / out-lap recovery), so the contract's y>0 floor was a spec bug that degenerated
      the p10 quantile.
  - id: E1
    note: Evaluation uses the final CV fold (2024) as a holdout stand-in; 2025 not yet ingested.
  - id: E3
    note: Heavy elevations (ablation/learning-curve/SHAP/PDP) run on the headline model of each family;
      quantile siblings share p50's structure.
  limitations:
  - 'NOT COMPARABLE TO v11. Work item 08m changed how `expected_compound_pace_s` is formed (`compound_cliff_severity`
    was fitted as a ~5.5-lap level shift and was being consumed as a per-lap rate, plus an unfitted 0.002*age^2
    term). That column is subtracted into `driver_skill_residual_s`, so the degradation trio''s target
    `next_5_lap_cumulative_jump_s` and the classifier''s label `laps_until_cliff_class` are DIFFERENT
    QUANTITIES under unchanged column names: the target''s mean moved -1.8793 -> -0.3946 s, 10.79% of
    cliff labels changed class, and the trio''s training population moved 82,470 -> 81,619 rows. v11''s
    published headlines (p10 0.53202 / p50 1.04679 / p90 0.57851 pinball, cliff macro-F1 0.37187) were
    measured against the SUPERSEDED target. A smaller pinball loss here is a smaller target spread, not
    more skill - the non-leakage baseline moved too (p50 2.17766 -> 1.26289). NO IMPROVEMENT OVER v11
    IS CLAIMED OR IMPLIED. The only admissible readings of this card are each model against its own baseline
    in this same run. The one exception is stint_life_regressor, whose target (`remaining_stint_life_laps`)
    08m did not touch - only two of its 32 inputs changed meaning - though even there the eligible row
    set moved 121,193 -> 119,822, so it is a near-fixed rather than fixed comparison.'
  - 'The cliff classifier (macro-F1 ≈ 0.35 on 4-class cliff timing) is the weakest model by headline,
    and the headline is the wrong way to read it: 1.0 is not reachable on a label where laps inside a
    stint share a compound, a car, a circuit and a driver. Against an oracle handed the stint id and nothing
    else it reaches 66% of the ceiling. What limits it is not established. The label was the leading candidate
    and has been tested: laps_until_cliff_class is a first-crossing scan over int_compound_cliff_predicted,
    which was unbounded until Phase 8 bounded it at source (compound_wear_max_s_per_lap). Repairing it
    moved 4.97% of rows and did not lift macro-F1, and a fresh 50-trial search on the repaired label did
    not beat the params tuned on the contaminated one. Neither the label nor the hyperparameters explain
    the number.'
  - Hyperparameters come from a 50-trial / season-fold Optuna search per target (ml/models/<target>_best_params.json);
    `make ml-retrain` refits at those params without re-searching. A target whose data has moved should
    be re-tuned, not just refit.
  - No live 2025 holdout yet-headline numbers are time-series CV until 2025 ingests.
  - Skill is reported as a fraction of the ATTAINABLE quantity. A fraction above 1.0 means the model is
    not bounded by stint-level information, so no ceiling has been established for it - not that it is
    near-perfect.
  - Every beats_baseline margin carries an interval over the season folds and over a stint-resampled bootstrap.
    The effective sample is ~7,100 stints, not ~137,000 laps.
  - Cliff-onset priors are NULL for ~45% of laps (legacy compounds, un-fit circuits); XGBoost native-NaN
    carries them, documented rather than imputed.
