  reproducibility:
    random_state: 20260528
    dataset_fingerprint: 87e1d013e877c578fd730b0e2e3997e8855739c13bbf09b65747943eff93e727
    library_versions:
      xgboost: 3.3.0
      sklearn: 1.9.0
    command: make ml-all
    onnx_parity: all 5 boosters round-trip to ONNX within atol=1e-5 on a NaN-bearing sample (M2/M4)
  deviations:
  - id: D1
    note: Built on XGBoost 3.2.0 (contract said 2.x); ONNX quantile round-trip spiked in M2 before tuning.
  - id: D5
    note: Degradation target is bounded [−10,10]; the majority of jumps are legitimate negatives (fuel
      burn / track evolution / out-lap recovery), so the contract's y>0 floor was a spec bug that degenerated
      the p10 quantile.
  - id: E1
    note: Evaluation uses the final CV fold (2024) as a holdout stand-in; 2025 not yet ingested.
  - id: E3
    note: Heavy elevations (ablation/learning-curve/SHAP/PDP) run on the headline model of each family;
      quantile siblings share p50's structure.
  - id: E4
    note: 'stint_life_regressor''s hyperparameters are work item 10e''s S1x, landed on decision D4 rather
      than on a cleared gate: the green-pit accuracy gain is significant, the calibration-slope gain is
      not, and this card''s own mixture headline for the family regresses by design. See the limitations
      entry.'
  limitations:
  - 'STINT-LIFE HYPERPARAMETERS ARE WORK ITEM 10e''s S1x, AND THEY WERE LANDED ON A DECISION (D4), NOT
    ON A CLEARED GATE. What changed: n_estimators 200 -> 100, learning_rate 0.02631 -> 0.02192, aft_loss_distribution_scale
    0.80 -> 0.754, plus reg_alpha/min_child_weight/subsample/colsample_bytree. max_depth stayed at 8 -
    this is a SHRINKAGE change, not the capacity change the earlier diagnosis (10d) predicted. Why: the
    superseded params were selected on the MIXTURE AFT NLL with the 2024 evaluation season inside the
    validation folds, which is three defects in the search rather than a property of the model. WHAT IS
    ESTABLISHED AT 95%: on the green-flag-pit stratum - 9,149 eval laps over 24 races, zero censoring,
    refit on 2018-2023 and scored on 2024 - IPCW-Brier improves 0.19039 -> 0.16888, paired race-cluster
    bootstrap +0.0226 95% [+0.0073, +0.0353] with 200 of 200 draws improving and ~15x the family''s own
    5-reseed noise floor; time-dependent AUC 0.6896 -> 0.7096; and the mean log bias moves -0.2741 ->
    +0.0680, so the level error CHANGES SIGN - the gauge stops over-predicting remaining tyre life (the
    dangerous direction for a number read as safe laps remaining) and starts under-predicting it slightly.
    WHAT IS NOT ESTABLISHED: the calibration slope, which moves 0.6736 -> 0.8754 but at paired-bootstrap
    P(improves) = 0.945 with an interval straddling zero - the fourth time 24 evaluation races have failed
    to resolve this quantity at 95%. THE CALIBRATION DEFECT IS NOT FIXED. Accuracy improves and the known
    dangerous bias direction is inverted; the calibration-slope gain remains statistically unresolved
    on the current 24-race evaluation set. THE COST, STATED: this family''s headline on this card is the
    mixture AFT NLL, and this change makes it WORSE - 1.99134 -> the value above, against a baseline that
    also moved (2.18868 -> 2.20099, because the AFT baseline is computed at the model''s own fitted scale),
    and `beats_baseline_significant` for this family flips True -> False. That is the expected direction
    and it was taken deliberately: work item 10c ruled the mixture the wrong headline for this target
    because it scores tyre-limit endings and exogenous SC/VSC/red interruptions in one likelihood, and
    these parameters were selected on the green-pit stratum instead. On that stratum''s own NLL the new
    parameters win (3.4377 -> 3.2922). Anyone reading this family''s headline as a quality signal is reading
    the metric the application does not use. Full evidence, all seven gates and the e-values: `_improvements/work/10-competing-risks.md`
    under 10e, artefacts in `_improvements/eval/10e/`.'
  - 'NOT COMPARABLE TO v11. Work item 08m changed how `expected_compound_pace_s` is formed (`compound_cliff_severity`
    was fitted as a ~5.5-lap level shift and was being consumed as a per-lap rate, plus an unfitted 0.002*age^2
    term). That column is subtracted into `driver_skill_residual_s`, so the degradation trio''s target
    `next_5_lap_cumulative_jump_s` and the classifier''s label `laps_until_cliff_class` are DIFFERENT
    QUANTITIES under unchanged column names: the target''s mean moved -1.8793 -> -0.3946 s, 10.79% of
    cliff labels changed class, and the trio''s training population moved 82,470 -> 81,619 rows. v11''s
    published headlines (p10 0.53202 / p50 1.04679 / p90 0.57851 pinball, cliff macro-F1 0.37187) were
    measured against the SUPERSEDED target. A smaller pinball loss here is a smaller target spread, not
    more skill - the non-leakage baseline moved too (p50 2.17766 -> 1.26289). NO IMPROVEMENT OVER v11
    IS CLAIMED OR IMPLIED. The only admissible readings of this card are each model against its own baseline
    in this same run. The one exception is stint_life_regressor, whose target (`remaining_stint_life_laps`)
    08m did not touch - only two of its 32 inputs changed meaning - though even there the eligible row
    set moved 121,193 -> 119,822, so it is a near-fixed rather than fixed comparison.'
  - 'THERMAL-PROXY AND CROSS-SEASON LEAKAGE FIXES (work items 08e/08f, landed 2026-09-17; disclosure only
    - both fixes'' SQL predates this card''s numbers, so nothing here moved today). 08e: `int_lap_thermal_proxy`''s
    stint baseline used to pool laps up to `CEIL(stint_length_actual*0.60)`, reaching forward into laps
    not yet run (55.92% of mart rows, mean 4.65 laps) and inverting `push_residual`''s sign against two
    targets; rebuilt as an expanding median over strictly-prior valid laps. Re-read on this card''s own
    v12 substrate: the rebuilt thermal family (`push_residual` + the two cumulative push-load columns
    + `surface_bulk_ratio`) clears all five targets as an information gain, not leakage recovered - p10
    +0.0665 pinball at 9.95x its own noise floor, p50 +0.0676 at 6.06x, p90 +0.0313 at 3.39x, cliff macro-F1
    +0.0167 at 3.84x, stint-life AFT nloglik +0.0273 at 4.46x. 08f-1: the quantile trio''s `survival_weight`
    (an XGBoost sample weight, never a feature) used to pool `total_per_compound`/`stints_reaching` across
    every ingested season, so a 2018 row''s weight was partly estimated from 2024; rebuilt as an expanding
    sum over strictly-prior seasons. Gated in isolation for the first time on this substrate: the weight
    vector changes substantially (93.3% of training rows), but every quantile headline delta stays inside
    its own 5-reseed noise floor (p10 0.49x, p50 0.15x, p90 -0.07x) - a real fix, a clean null on the
    headline; `cliff_classifier`/`stint_life_regressor` never consume this weight and are structurally
    unaffected. 08o (2026-09-21) then removed the weight from the training path altogether, so the sentence
    above about the other two families now holds for all five: uniform weights beat IPW on every head,
    though each headline delta sits INSIDE its own reseed floor (p10 0.70x, p50 0.06x, p90 0.41x) - the
    ruling rests on the permutation-null information cost at p10, which does clear its floor at -1.30x,
    and not on the headline. `survival_weight` is still built by the mart and still carried in `IDENTIFIER_COLUMNS`;
    it is now neither a feature nor a weight, and reaches no model. 08f-2: `int_circuit_x_constructor_interaction`''s
    two season-pooling `GROUP BY`s were rebuilt the same way. Proven algebraically, not merely measured
    within noise, to move zero live targets: its whole effect on a stint is a constant per (race, constructor),
    and every target this model is scored against differences laps within one stint, which cancels an
    exact constant. Full writeup: `_improvements/eval/08e/` and `_improvements/eval/08f/`.'
  - 'The cliff classifier (macro-F1 ≈ 0.37 on 4-class cliff timing) is the weakest model by headline,
    and the headline is the wrong way to read it: 1.0 is not reachable on a label where laps inside a
    stint share a compound, a car, a circuit and a driver. Against an oracle handed the stint id and nothing
    else it reaches 69% of the ceiling. What limits it is not established. The label was the leading candidate
    and has been tested: laps_until_cliff_class is a first-crossing scan over int_compound_cliff_predicted,
    which was unbounded until Phase 8 bounded it at source (compound_wear_max_s_per_lap). Repairing it
    moved 4.97% of rows and did not lift macro-F1, and a fresh 50-trial search on the repaired label did
    not beat the params tuned on the contaminated one. Neither the label nor the hyperparameters explain
    the number.'
  - Hyperparameters come from a 50-trial / season-fold Optuna search per target (ml/models/<target>_best_params.json);
    `make ml-retrain` refits at those params without re-searching. A target whose data has moved should
    be re-tuned, not just refit.
  - No live 2025 holdout yet-headline numbers are time-series CV until 2025 ingests.
  - Skill is reported as a fraction of the ATTAINABLE quantity. A fraction above 1.0 means the model is
    not bounded by stint-level information, so no ceiling has been established for it - not that it is
    near-perfect.
  - Every beats_baseline margin carries an interval over the season folds and over a stint-resampled bootstrap.
    The effective sample is ~7,100 stints, not ~137,000 laps.
  - Cliff-onset priors are NULL for ~45% of laps (legacy compounds, un-fit circuits); XGBoost native-NaN
    carries them, documented rather than imputed.
