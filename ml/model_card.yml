      in_sample_oracle_is_exact_optimum: true
      note: 'primary denominator is analytic: under a Gaussian shape, knowing the stint scales sigma from
        sqrt(sigma_b^2 + sigma_w^2) to sigma_w, so a stint-constant predictor can remove at most 1 - sqrt(1
