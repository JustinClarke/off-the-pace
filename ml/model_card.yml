  reproducibility:
    random_state: 20260528
    dataset_fingerprint: 05aca16f1dc5a9e04bc3ebeb9a3220b2bb66db39fe5aee1ec8b0e3e12261b1d9
    library_versions:
      xgboost: 3.3.0
      sklearn: 1.9.0
    command: make ml-all
    onnx_parity: all 5 boosters round-trip to ONNX within atol=1e-5 on a NaN-bearing sample (M2/M4)
  deviations:
  - id: D1
    note: Built on XGBoost 3.2.0 (contract said 2.x); ONNX quantile round-trip spiked in M2 before tuning.
  - id: D5
    note: Degradation target is bounded [−10,10]; the majority of jumps are legitimate negatives (fuel
      burn / track evolution / out-lap recovery), so the contract's y>0 floor was a spec bug that degenerated
      the p10 quantile.
  - id: E1
    note: Evaluation uses the final CV fold (2024) as a holdout stand-in; 2025 not yet ingested.
  - id: E3
    note: Heavy elevations (ablation/learning-curve/SHAP/PDP) run on the headline model of each family;
      quantile siblings share p50's structure.
  limitations:
  - The cliff classifier (macro-F1 ≈ 0.39 on 4-class cliff timing) is the weakest model-it decisively
    beats the majority prior, but absolute skill on the minority cliff windows is modest.
  - Hyperparameters come from a 50-trial / season-fold Optuna search per target (ml/models/<target>_best_params.json);
    `make ml-retrain` refits at those params without re-searching. A target whose data has moved should
    be re-tuned, not just refit.
  - No live 2025 holdout yet-headline numbers are time-series CV until 2025 ingests.
  - Cliff-onset priors are NULL for ~45% of laps (legacy compounds, un-fit circuits); XGBoost native-NaN
    carries them, documented rather than imputed.
