  validation:
    scheme: season-grouped TimeSeriesSplit (expanding window, n_splits=5); whole seasons move together,
      the final fold validates on 2024
    headline_metric_direction: pinball ↓ (quantiles), macro-F1 ↑ (classifier), censored AFT NLL ↓ (stint-life)
    all_models_beat_baseline: true
    baselines:
      degradation_p50: group-mean over (compound, circuit, age-bucket) cells, compound→global fallback
      degradation_p10_p90: empirical 10th/90th percentile in the same cells
      cliff_classifier: majority-class prior (none_in_stint)
      stint_life: cell group-mean of remaining stint life over (compound, circuit, age-bucket), compound→global
        fallback (non-leakage); scored under the same censored likelihood as the model, never against
        uncensored rows alone
    attainable_note: Skill is reported as a fraction of the ATTAINABLE quantity, not of 1.0. For the quantile
      trio the denominator is analytic -- under a Gaussian shape a predictor that knew the stint could
      remove at most 1 - sqrt(1 - ICC) of the expected pinball, where ICC is the between-stint variance
      share estimated by one-way ANOVA. For the classifier it is a per-stint majority-class oracle; for
      stint life it is the censored AFT likelihood at a perfect prediction, which is a hard bound. A fraction
      above 1.0 means the model reaches past stint identity into within-stint variation.
    interval_note: Every beats_baseline claim carries a paired-t interval over the season-grouped CV folds
      (n=5) plus a percentile bootstrap that resamples whole STINTS on the evaluation fold. Laps inside
      a stint share a compound, a car, a circuit, a fuel load and a driver, so a lap-grain interval understates
      the standard error; the ratio between the two is published per model rather than assumed.
