# proper long-term fix is happy-dom >= 20.8.9 + an esbuild >= 0.25.0 override.

# esbuild dev-server can be requested cross-origin (esbuild serve). We never run `esbuild
# serve`; esbuild is a build-time transitive of vite only. Fixed in 0.25.0.
