name: 'off_the_pace'
version: '1.0.0'
config-version: 2
require-dbt-version: ">=1.5.0,<2.0.0"

profile: 'off_the_pace'

vars:
  # Regulation-era boundary year (ground-effect regs introduced).
  # Moving this single knob re-splits pre/post eras across all era-aware models
  # and the isotonic fit. A third era (e.g. 2026 regs) needs new label strings
  # in int_driver_circuit_era_affinity.sql flag as a follow-up when it lands.
  era_boundary: 2022
  # Ghost car: a driver contributing fewer than this fraction of the race distance
  # is flagged is_short_run (DNF / partial) rather than trusted as a full estimate.
  ghost_short_run_threshold: 0.5
  # int_event_corrections: lap_time / race_fastest above this ratio is hard-excluded
  # (weight 0.0). The band [1.20, outlier_exclude_ratio) is soft-downweighted to 0.6
  # so legit heavy-fuel / traffic laps are salvaged instead of nuked.
  outlier_exclude_ratio: 1.40
  # int_qualifying_push_laps: a qualifying lap counts as a push lap when it is
  # within this ratio of the best lap set in its own Q1/Q2/Q3 segment   the
  # classic 107% cut for "this was a serious lap". Cool-down laps between two
  # push laps carry no pit time and so pass every other validity check; this is
  # the only thing that removes them. Each driver's own best lap in a segment is
  # always a push lap regardless of the ratio, so nobody drops out of the
  # decomposition entirely.
  quali_push_lap_ratio: 1.07
  # int_lap_proximity: a track gap larger than this is not a car ahead, it is
  # clear air, and is nulled rather than carried. The model's self-match guard
  # already removes the ordinary case (the previous crossing of a point being
  # the same driver a lap earlier); this bound exists for RED FLAGS, where the
  # session clock runs on through a stoppage of tens of minutes and the
  # previous crossing is a *different* driver from before the stoppage. The
  # arithmetic is right and the answer is meaningless. Measured 2026-09-05:
  # exactly one lap in 162,729 exceeds 300 s (2023 São Paulo, VER lap 3,
  # 1484.5 s), 23 exceed 120 s, p99.99 is 125.4 s -- so this bound is not
  # doing routine work, it is catching a specific artefact.
  proximity_max_gap_s: 300.0
  # int_lap_proximity (F43, WI-15a): crossings made inside a driver's own pit
  # window (stg_pits pit_in_time_s .. pit_out_time_s) are not traffic and are
  # dropped before the car-ahead ordering. A stop with no recorded exit (car
  # retired in the pit lane, or the race ended under the stop) has no
  # pit_out_time_s; its window closes this many seconds after pit entry.
  # Measured 2026-09-25: none of the 248 such stops has a position crossing
  # past 120 s, so the bound does no routine work -- it exists so a missing
  # out-lap row can never erase a car that did rejoin. T33
  # (assert_proximity_excludes_pit_lane) reads the same var.
  proximity_pit_window_open_s: 120.0
  # surface_bulk_ratio (F49, WI-15b), in int_tyre_surface_vs_bulk_decoupling and
  # fct_cliff_prediction_features: each thermal load is divided by the sum of
  # its own EW weights before the two are compared, so a lap at steady push
  # reads 0.5. These MUST equal the sums of the literal weights in
  # int_lap_thermal_proxy.sql (surface 1+.717+.514+.369+.264, bulk
  # 1+.819+.670+.549+.449+.368+.301+.247): move them together. Surface weights
  # never exceed bulk weights at the same lag, so the ratio's ceiling is
  # bulk/(surface+bulk) = 0.606, reached when all push is on the current lap.
  thermal_surface_weight_sum: 2.864
  thermal_bulk_weight_sum: 4.403
  # int_pit_loss_circuit: a stop's measured loss must land inside
  # [pit_loss_min_s, pit_loss_max_s] to count. The floor drops stops where the
  # reference lap was itself compromised; the ceiling drops what the SC/VSC/red
  # filter upstream of it does not already catch (a drive-through, a car parked
  # in its box behind a stuck wheel gun). pit_loss_prior_stops is the EB
  # pseudo-count in stops: a venue with a single race-weekend's worth of stops
  # sits roughly half-way to the global median, one with a full history barely
  # moves.
  pit_loss_min_s: 8
  pit_loss_max_s: 60
  pit_loss_prior_stops: 15
  # int_pit_strategy_cost_curve: a stop taken under a safety car costs this
  # fraction of a green-flag stop, because the field is slowed with you. This
  # is the only term that makes pit-lane loss enter the argmin at all: under a
  # fixed one-stop the loss is the same whenever you take it, so it adds a
  # constant to every candidate lap and cancels. With the discount, waiting
  # buys a shot at a cheap stop, and a longer pit lane pushes the optimum
  # later -- which assert_pit_loss_pushes_optimum_later checks rather than
  # trusts. 0.5 is the conventional figure; it has not been fitted here.
  pit_sc_loss_multiplier: 0.5
  # int_pit_strategy_cost_curve: whether the per-lap pace offset between the
  # old and new compound (compound_grip_peak plus the optimal-temperature
  # term) is allowed to move the optimum. Both are per-compound CONSTANTS in
  # compound_cliff_params -- one distinct value each across all 403 seed rows,
  # never fitted -- and grip_peak as typed says SOFT (1.03) is slower than
  # HARD (0.97), which is backwards. Over a 20-lap arm that is ~1.2 s of
  # unmeasured offset pushing against fitted wear effects of the same size.
  # TRUE keeps the full curve; FALSE drops the term and leaves the argmin to
  # the fitted wear, cliff onset and severity alone.
  pit_strategy_baseline_delta: true
  # int_pit_strategy_cost_curve: how far the tyre-age grid runs. Must cover
  # the oldest set a stint can open on plus the longest horizon (Monaco, 78
  # laps); candidates past it are dropped by the curve join.
  pit_strategy_max_age_laps: 160
  # int_pit_strategy_value: half-width, in laps, of the band around the
  # modelled optimum that still counts as 'optimal'. The argmin is a point
  # estimate off a fitted wear curve, so grading it to the exact lap would be
  # reading precision the curve does not have.
  pit_strategy_optimal_band_laps: 1
  # int_pit_strategy_value: an early stop counts as undercut_forced only if it
  # landed within [threat - 2, threat + this] of the lap the undercut window
  # opened. Without a window the branch fires on "a car was ever within a pit
  # stop of you", true for 95.5% of stints, and undercut_forced becomes the
  # bucket every early stop falls into.
  pit_strategy_undercut_window_laps: 3
  # Shared ceiling on the compound wear curve's cumulative per-lap cost, in
  # seconds. The hockey-stick polynomial is unbounded -- 136 s/lap extrapolated
  # to age 80, and already 93 s/lap on laps that were actually run (p99 30.8) --
  # which is not a car that is still racing. Real cliff falloff runs 1-3 s/lap,
  # so 10 is generous and bounds the tail without flattening the region either
  # consumer's decision lives in.
  #
  # This is the bound's own name because two models apply it to the same terms
  # and neither owns it: int_compound_cliff_predicted (the source curve, per
  # observed lap) and int_pit_strategy_cost_curve (the same curve recomputed
  # over a synthetic age grid). Bounding only the second one -- which is what
  # shipped before -- leaves driver_skill_residual_s, and therefore both ML
  # targets built on it, standing on the unbounded curve.
  #
  # Sensitivity, measured 2026-08-25 by re-deriving laps_until_cliff_class at
  # each value: 10.0 moves 4.97% of labels, 5.0 moves 11.09%, 3.0 moves 18.11%.
  # 10.0 is the conservative choice and the one continuous with Phase 5.
  compound_wear_max_s_per_lap: 10.0
  # Retained as an alias of the above so the pit-strategy model keeps a name of
  # its own; both default to the same value and the cost curve reads the shared
  # bound. Set this alone to diverge the strategy ceiling from the source curve.
  pit_strategy_max_wear_s_per_lap: 10.0
  # ── Holdout policy (WI-03; _roadmap/_fixes/wi/WI-03-holdout-policy.md) ──
  # Pin a holdout season instead of deriving MAX(race_year)+1. WI-03 ruling (FD4,
  # 2026-09-28): use 2026 as the holdout. Ingest 2026 data incrementally as races
  # complete rather than upfront. holdout_populated is derived from whether the
  # holdout season has any rows in the warehouse (false until data arrives).
  holdout_season: 2026
  # dim_corners: each corner's telemetry window runs from its apex minus
  # corner_entry_margin_m to its apex plus corner_exit_margin_m, with both ends
  # clipped at the neighbouring apex so no corner reaches past its neighbours.
  # 250 m of entry covers the 99th percentile braking zone measured on corners
  # with a clear 600 m approach (p50 119 m, p95 181 m, p99 232 m); 150 m of exit
  # covers the 75th percentile of the first full-throttle point after the apex
  # (p50 75 m), the next apex clipping most of what a wider margin would add.
  corner_entry_margin_m: 250
  corner_exit_margin_m: 150
  # int_lap_fuel_state (WI-05: F6, F32, F52): the most race fuel a car may start
  # with, in kg, keyed by the first season each limit applies from (FIA Sporting
  # Regulations: 105 kg 2014-2018, 110 kg from 2019). The fuel model assumes a car
  # starts at the limit and burns it evenly over the race's SCHEDULED laps
  # (race_scheduled_laps seed), so the per-lap rate is limit / scheduled_laps and
  # the starting load can never exceed the limit. A season before the earliest key
  # gets NULL fuel, which assert_fuel_load_matches_scheduled_distance fails on --
  # add a key when a season with a new fuel rule (2026's energy-based limit) lands.
  fuel_regulatory_max_kg_by_season: {2018: 105.0, 2019: 110.0}
  # stg_weather (WI-05: F26): the wet-conditions flag is a two-of-three vote over
  # independent signals -- bronze Rainfall (precipitation now), humidity at or
  # above this threshold, and at least this share of the running field on
  # INTERMEDIATE/WET tyres on that lap. 70% sits between the humidity of bronze's
  # false-positive "raining" laps (~52%: 2018 Spain, 2019 Monaco) and the bulk of
  # genuinely wet laps (70-97%); 0.5 is a field majority, so one team's tyre gamble
  # cannot flip a lap on its own.
  wet_humidity_min_pct: 70.0
  wet_field_tyre_share_min: 0.5
  # stg_lap_tyre_qa (WI-05: F24, F25): bronze stint numbering cross-checked
  # against the pit record.
  # - A bronze stint change counts as explained if an in-lap sits within this many
  #   laps before it (bronze often moves the stint one or two laps after the stop).
  tyre_qa_boundary_window_laps: 3
  # - F25: at most this many leading laps with no bronze stint are filled into the
  #   driver's first stint (the 2018 lap-1 gap is 1 lap, 2 for one car a race);
  #   longer unassigned runs are not F25's pattern and go to quarantine.
  tyre_qa_max_unassigned_leading_laps: 2
  # - A race's whole tyre feed is quarantined when bronze shows at least this many
  #   stint changes with no pit stop behind them...
  tyre_qa_race_unexplained_boundaries_min: 5
  # - ...or when at least this share of its racing pit stops (car rejoined and ran
  #   3+ more laps, no red flag) has no bronze stint change after it. Drive-throughs
  #   legitimately land here, but they are one or two a race; the broken feeds miss
  #   43-97% of stops.
  tyre_qa_race_unmatched_pit_share_min: 0.3
  # ── Driver isolation (WI-16a; _roadmap/_fixes/wi/WI-16-cumulative-driver-isolation.md) ──
  # The three contextual driver ratings (pure pace, tactical, relative to same-strategy
  # peers). Every value below is pre-registered in the WI doc; WI-16b's validation does
  # not tune them. Measured numbers are from the 2026-09-26 scratch rebuild of dev.
  #
  # int_driver_isolation_lap_panel: a (race, lap) enters the clean-lap panel Ω only if at
  # least this many drivers have an Ω lap on it, so the field median each lap is centred
  # on is a median of a real field, not of three cars behind a safety car. Measured:
  # 96.2% of (race, lap) cells have >= 8 Ω laps (median 17), and the floor drops 0.9%
  # of Ω laps.
  isolation_min_field_n: 8
  # fct_driver_isolation_lap: the rolling window is the Ω laps of the same stint with
  # lap_number in [l - (this - 1), l] -- a RANGE frame on lap_number, trailing only, so a
  # window that spans a safety car simply holds fewer laps. 5 laps is the "is he on it
  # right now" grain; the WI doc's prototype put its reliability near 0.5 ("What a 5-lap
  # window can carry"), which is why verdicts belong at stint or race grain. (Measured
  # pure-window lambda is 0.71-0.88 by season; WI-16b's V5b decides what that is worth.)
  isolation_window_laps: 5
  # fct_driver_isolation_lap: a window value is NULL below this many contributing laps
  # (non-extrapolated laps for pure, non-NULL laps for tactical, pair-laps for relative).
  # The floor stops a 1-2 lap "window" publishing; shrinkage handles everything above it.
  isolation_window_min_laps: 3
  # fct_driver_isolation_pair_lap: d' is a same-strategy peer of d on lap l when both have
  # an Ω lap on the same lap number and the same compound, with tyre ages within this
  # many laps. No model-based age adjustment is applied; peers are matched directly by age.
  # Measured: 86.4% of Ω laps have >= 1 peer at ±2 laps (90.4% at ±3).
  isolation_peer_age_tolerance: 2
  # int_driver_isolation_stint_tyre: a stint's pace line (the slope beta_s the tactical
  # rating is built from) needs at least this many clean early/mid, non-recovery laps;
  # below it beta_s, m_s and every tactical value in the stint are NULL (never 0).
  # About 16 line laps give a slope SE near 0.024 s/lap^2 (WI doc); 6 is the floor below
  # which a slope is mostly noise. Measured: 83.6% of the 7,315 stints with an Ω lap
  # clear it (the WI doc's probe said 81.7%).
  isolation_min_stint_laps: 6
  # int_driver_isolation_stint_tyre: the peer slope beta_peer_s is the median over other
  # drivers' stints in the same race on the same compound. With fewer than this many such
  # stints it falls back to the (race_year, compound) pool, leave-driver-out, flagged
  # tactical_peer_source = 'season_pool'. 2 is the smallest count whose median is not one
  # other driver's slope.
  isolation_min_peer_stints: 2
  # int_driver_isolation_lap_panel: the recovery overlay marks the first this-many valid
  # laps of a non-dirty-air run that directly follows a dirty-air run of at least
  # isolation_recovery_min_dirty_run laps in the same stint ("he has dropped out of the
  # wake and his tyres are coming back"). Backward-looking and gap-based, so it is never
  # selected on the lap's own pace. Measured: 5.0% of Ω laps (the WI doc's 3.1% of valid
  # laps predates WI-15a's S2 coding); T45 warns outside [1%, 10%] of Ω.
  isolation_recovery_laps: 3
  isolation_recovery_min_dirty_run: 2
  # int_driver_isolation_lap_panel: races kept out of Ω entirely. 2020_1 (Austrian GP)
  # has wrong lap numbering in bronze (watch W18), and tiers 1 and 3 match cars on
  # lap_number. A list; the panel renders it with a Jinja loop, not as a Python list.
  isolation_exclude_races: ['2020_1']
  # int_driver_isolation_lap_values: a declared season-level offset (s/lap, positive =
  # raised) added to pure_skill_gain_s, via macro driver_isolation_pure_season_offset.
  # W33, 2026-09-30, Option A for v15: a stopgap, not a measurement. y_s is centred on
  # each lap's whole-field median, and cliff laps read fast in y_s (the compound seed's
  # cliff cost over-corrects, WI-02b territory), so a season with many cliff laps has its
  # pre-cliff laps, the ones pure is averaged over, sitting slow against that median.
  # 2018 has 42% cliff laps, against 14-32% in 2019-2024. On dev rebuilt 2026-09-30 (car
  # term constructor_car_fe_isolation_hdfe_v2) 2018's mean race pure is -0.450 s, and the
  # 2019-2024 seasons average -0.077 s (-0.03 to -0.12). +0.37 is that gap: it puts
  # 2018 at the other decision seasons' level. It is not +0.45 (the gap to zero), which
  # would lift 2018 about 0.08 s above them. The offset is constant within a season, so
  # within-season rankings, pair gaps and the tier-3 identity are unchanged; it only
  # makes a 2018 pure value comparable, with a caveat, with a 2019-2024 one. 2025 also
  # sits low (-0.246) and is not offset here; the docs page says so. Removed in this session:
  # WI-02b's cliff-cost refit with a regression-based severity estimation replaces this.
  isolation_pure_season_offset_gain_s: {}
  # ── Label spine (WI-01; _roadmap/_fixes/wi/WI-01-label-spine.md) ──
  # int_dirty_air_tax_component: theta_air's calibration panel is restricted to
  # race_year <= this value (F5). Without a declared cutoff, the panel was
  # "every ingested season," so ingesting a new season silently re-fit theta
  # and relabelled every already-published season's dirty-air tax and
  # driver_skill_residual_s. 2025 is the latest currently-ingested season
  # (2026 is not ingested yet, W19); bumping this var is now the explicit,
  # reviewable act that moves theta to a later window for a new label version,
  # rather than an automatic side effect of the next `dbt build`.
  # Ruled 2026-09-27 (WI-01 verification pass): keep <= 2025 (every ingested
  # season; 2025 is complete). If FD4 (holdout policy) rules 2025 out of
  # estimation, drop this to 2024 and relabel. Since W40 this var bounds the
  # population theta_air_label_value (below) is fitted on outside dbt, so
  # moving it also means re-running that fit and moving that var in the same
  # edit; on its own it now changes only calibration_sample_n.
  theta_air_fit_season_max: 2025
  # The theta_air the label is built with. Since W40 int_dirty_air_tax_component
  # APPLIES this value (it no longer fits theta in SQL), so a change to it is
  # always a reviewed edit and never a side effect of a build. T9
  # (assert_prior_season_labels_frozen) warns if the applied value differs.
  # 0.331 s/lap (ruled 2026-09-27, W40): 06b's pre-registered F2 estimator
  # (partial residual on the lagged dirty-air bit | stint FE + six tyre-age
  # bins, race-clustered) on the model's calibration_panel, 2018-2025:
  # 0.3313 [0.293, 0.370], n = 138,679. Fitted outside dbt by
  # _roadmap/_fixes/_evidence/wi-12-2026-09-27/d2_fit_wi12.py (section W);
  # d2 stops if this var is not that fit to 3 dp.
  # History: 0.1310 (08q, pre-WI-01 label) -> 0.5033 (WI-01's pooled OLS,
  # interim) -> 0.331. To move it: rebuild, re-run d1/d2 on the new panel,
  # edit this var, re-take seeds/label_stability_baseline.csv.
  theta_air_label_value: 0.331

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


models:
  off_the_pace:
    staging:
      +materialized: view
    reference:
      +materialized: table
    intermediate:
      +materialized: view
      +tags: [intermediate]
    marts:
      +materialized: table

seeds:
  off_the_pace:
    # WI-16a: committed with three 'unvalidated' rows and NULL scores; WI-16b's
    # scripts/validate_driver_isolation.py --write-seed fills it. Typed explicitly
    # because an all-empty column would otherwise be sniffed as VARCHAR.
    driver_isolation_method_scores:
      +column_types:
        rating: varchar
        method_score: double
        grade: varchar
        tests_applicable: integer
        tests_passed: integer
        critical_failed: varchar
        validated_at: varchar
        substrate: varchar
        report_path: varchar
    # WI-01 (T9, F5): frozen per-season label snapshot taken the day the label
    # spine version bumped (2026-09-27), re-taken the same day after WI-01's
    # verification pass (theta with tyre cost subtracted, unknown-tyre laps out
    # of the base) -- one bump, one snapshot. assert_prior_season_labels_frozen.sql
    # warns if a COMPLETE season's stats drift from this on a later build.
    # Refresh deliberately (with a note here and in the label-version doc) the
    # next time the label version bumps; never silence a real drift by editing
    # this file to match instead.
    label_stability_baseline:
      +column_types:
        race_year: integer
        row_count: integer
        mean_next_5_lap_jump_s: double
    circuit_reference:
      +column_types:
        era_start_year: integer
        corner_count: integer
        abrasiveness_index: integer
        n_calibration_laps: integer
        calibration_delta_pct: double
        weight_penalty_factor: double
        measured_weight_penalty_factor: double
        prior_weight_penalty_factor: double
        fit_date: date
    compound_cliff_params:
      +column_types:
        season: integer
        compound_cliff_onset_laps: double
        compound_cliff_severity: double
        compound_wear_gradient: double
        compound_grip_peak: double
        n_stints: integer
        fit_date: date
        fit_source: varchar
        onset_source: varchar
        gradient_source: varchar
        severity_source: varchar
    seed_manual_lap_exceptions:
      +column_types:
        race_year: integer
        race_id: varchar
        driver_id: varchar
        lap_number: integer
        event_type: varchar
        correction_weight_override: double
        note: varchar
    race_to_track:
      +column_types:
        race_id: varchar
    # F13 (WI-09): without this DuckDB's CSV sniffer reads '2021_10' as the
    # digit-separated integer 202110, and dim_events / stg_events match no race.
    raw_dim_events:
      +column_types:
        race_id: varchar
    # race_id must be typed: '2021_10' is otherwise sniffed as the digit-separated
    # integer 202110 (F13's defect on raw_dim_events).
    race_scheduled_laps:
      +column_types:
        race_id: varchar
        race_year: integer
        round_number: integer
        event_name: varchar
        scheduled_laps: integer
        total_laps_final: integer
        max_current_lap: integer
        source: varchar
        note: varchar
