version: 2

models:
  - name: int_stint_geometry
    description: >
      Foundation for all downstream window functions. One row per race lap
      (the FULL chronological sequence, including SC/VSC/pit/invalid laps)
      so physics-layer LAG/EWMA windows decay correctly across those gaps
      instead of treating the lap before/after a gap as adjacent. Builds
      stint identifiers (stint_id), lap positions within stints
      (lap_in_stint = chronological ordinal, valid_lap_in_stint = ordinal
      among valid laps only, age_in_stint = tyre_life), and compound
      tracking. Consumers that fit pace/regression models filter to
      is_valid_lap (or key off valid_lap_in_stint) at their own input
      boundary. All Layer 03 window functions partition on stint_id.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: stint_id
        description: Surrogate key combining race_year, race_id, driver_id, stint_number
        tests: [not_null]
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: lap_in_stint
        description: Chronological ordinal within the stint (1, 2, 3, ...), counting every lap including SC/VSC/pit/invalid ones.
        tests: [not_null]
      - name: valid_lap_in_stint
        description: Ordinal among valid laps only within the stint (NULL on invalid laps). Use for pace-fitting position/length logic instead of lap_in_stint.
      - name: stint_length_actual
        description: Total lap count in the stint (valid + invalid).
        tests: [not_null]
      - name: stint_length_valid
        description: Count of valid laps in the stint.
      - name: is_valid_lap
        description: Carried through from stg_laps. Timed, on-track, not deleted, accurate, not lap 1, no SC/VSC.
        tests: [not_null]
      - name: is_pit_lap
        description: Carried through from stg_laps. TRUE for the out-lap/in-lap of a pit stop.
        tests: [not_null]
      - name: is_safety_car_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 4 (full SC).
        tests: [not_null]
      - name: is_vsc_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 6 or 7 (VSC).
        tests: [not_null]
      - name: is_red_flag_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 5 (red flag).
        tests: [not_null]

  - name: int_lap_fuel_state
    description: >
      Fuel burnoff and weight correction. One row per valid lap.
      Calculates fuel_mass_kg based on consumption rate and weight_corrected_lap_time
      by applying weight penalty from fuel load.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_lap_air_state
    description: >
      Air state classification and thermal load from dirty air. One row per stint-lap.
      Classifies air state per sector (free_air, tow_zone, drs_train, dirty_air) and accumulates
      cumulative thermal load on tyre surface and bulk using exponential moving average.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: time_in_dirty_air_s
        description: >
          Real per-lap dirty-air exposure time (seconds), summed from actual
          ~10Hz telemetry sample durations where gap-to-car-ahead < 1.5s.
          Zeroed on SC/VSC laps (no real aero load at safety-car speeds).
          Null-gap samples (~5%, car ahead unavailable) are treated as free
          air, matching dirty_air_share_lap's existing convention.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                # Generous upper bound: red-flag/standing-start stoppages (e.g.
                # 2020 Austrian GP) hold the field bunched at <1.5s gaps for
                # real wall-clock minutes, well past a normal green-flag lap.
                max_value: 900

  - name: int_lap_normalized_pace
    description: >
      Phase C: lap pace with the dirty-air cost removed, so laps run in traffic
      stay usable for wear/cliff fitting instead of being discarded.
      normalized_pace_s = lap_time_s - theta_time * time_in_dirty_air_s, with
      theta_time calibrated on clean, dry, valid laps and applied to the full
      lap sequence. Neither a tow term nor a fixed in-traffic step is applied;
      both were measured against the phase's acceptance metric and made it
      worse (see the model header for the numbers). One row per lap carried by
      int_lap_air_state. Deliberately a graph leaf, consumed only by the
      offline cliff solver: feeding normalized pace into the ratings/residual
      chain would double-count the dirty-air component already modelled in
      int_lap_residual_decomposed.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: normalized_pace_s
        description: >
          Lap time net of the dirty-air penalty. Null only where lap_time_s
          itself is null (untimed lap); the solver filters those out rather
          than having a pace fabricated for them.
        tests:
          # Two bounds rather than one. Normalization must never produce a
          # negative pace on any lap, but no useful upper bound holds across
          # all laps: red-flag stoppages are recorded as single enormous laps
          # (2024 Monaco lap 1 is ~2500s for all 16 running cars), which are
          # real events, not data faults. The tight bound is therefore scoped
          # to the laps the solver actually fits.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "normalized_pace_s is not null"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                # Solver ceiling (200s) plus headroom for the tow add-back.
                max_value: 210
                row_condition: "normalized_pace_s is not null and lap_time_s < 200"
      - name: dirty_air_penalty_s
        description: >
          theta_time * time_in_dirty_air_s, bounded [0, 5.0] (same clamp as
          int_dirty_air_tax_component's dirty_air_tax_s). Zero on clean-air
          laps by construction.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0

  - name: int_lap_thermal_proxy
    description: >
      Cumulative push load from engine thermal management. One row per lap.
      Models engine braking and thermal duty via cumulative exponential moving average,
      aggregated to lap-level push load on braking.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_track_geometry
    description: >
      Circuit geometry (gradient + curvature) from raw X/Y/Z telemetry, binned
      to 25m distance intervals. Grain is (race_year, track_id, distance_bin) --
      per-season, not collapsed to a single per-circuit shape, since GPS
      origin/heading can drift between seasons (verified at Bahrain: 2019
      diverges from 2020-2024). Start/finish bin has NULL gradient/curvature
      (no wraparound across the lap boundary).
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: race_year
        description: Season
        tests: [not_null]
      - name: track_id
        description: Circuit identifier (from race_to_track)
        tests: [not_null]
      - name: distance_bin
        description: Lower edge of the 25m distance bin (meters from start line)
        tests: [not_null]
      - name: gradient_dz_ds
        description: Elevation gradient dZ/ds between the previous and next bin
      - name: curvature_per_m
        description: >
          Menger curvature (1/m) from 3 consecutive binned points. NULL at
          season boundaries or where points are collinear.
      - name: lateral_accel_proxy_ms2
        description: v^2 * curvature_per_m, using median speed at the bin (m/s^2)

  - name: int_corner_metrics
    description: >
      Per-corner telemetry metrics. Grain is (race_year, race_id, driver_id, lap_number,
      corner_name)   one row per corner the driver's telemetry reaches on that lap. Windows come
      from dim_corners, keyed per race, so each session is measured against its own corner
      geometry. Feeds int_corner_skill_residuals and fct_telemetry_deltas.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: driver_id
        description: FastF1 three-letter driver code.
        tests: [not_null]
      - name: lap_number
        description: Lap number within the race.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id.
        tests: [not_null]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: corner_name
        description: Turn label from dim_corners (Turn_7, Turn_7A).
        tests: [not_null]
      - name: track_id
        description: Event slug the corner belongs to, carried from dim_corners as a label.
        tests: [not_null]
      - name: braking_point_m
        description: >
          Distance of the first sample on the brakes inside the corner window. NULL where the
          corner is taken flat   a real answer for a fast corner, not missing data.
      - name: v_min_kph
        description: Minimum speed recorded inside the corner window (the apex speed).
        tests: [not_null]
      - name: throttle_point_m
        description: >
          Distance of the first full-throttle sample at or after the apex: where the driver gets
          back on power. NULL where the driver never reaches 100% throttle before the window ends
          at the next apex.

  - name: int_lap_telemetry_aggregates
    description: >
      Per-lap telemetry features for the tyre-cliff model. One row per race lap.
      Powertrain aggregates (gear changes, rpm, full-throttle/DRS share, short-shift index) plus
      five within-stint-drift cliff signals (mid-corner speed loss, wheelspin proxy, throttle-trace
      decay, braking-point drift, lift-and-coast share), each measured vs the driver's own
      early-stint baseline. Computed lap-internally from the 'car' telemetry channel; NULL where a
      lap has no telemetry (explicit missingness, carried as XGBoost native-NaN).
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: stint_id
        description: Stint surrogate key (baseline partition)
        tests: [not_null]
      - name: pct_full_throttle
        description: Fraction of the lap at full throttle (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "pct_full_throttle is not null"
      - name: pct_drs_active
        description: Fraction of the lap with DRS active (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "pct_drs_active is not null"
      - name: traction_wheelspin_proxy
        description: Share of corner-exit full-throttle samples with non-positive accel (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "traction_wheelspin_proxy is not null"
      - name: lift_coast_share
        description: Off-throttle, non-braking, decelerating share of the lap (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "lift_coast_share is not null"

  - name: int_compound_cliff_predicted
    description: >
      Tyre compound degradation prediction using fitted survival-analysis parameters.
      One row per lap. Predicts degradation rate and cliff onset based on fitted compound parameters
      and current thermal conditions.
    tags: [intermediate]
    meta:
      family: pace-baselines
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_field_pace_curve
    description: >
      Field-level baseline pace curve. Grain is (race_year, race_id, lap_number).
      Computes rolling median of free-air pace for each lap to establish a clean baseline
      uncontaminated by individual driver skill or traffic.
    tags: [intermediate]
    meta:
      family: pace-baselines
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_track_evolution
    description: >
      Track temperature and grip evolution over race. Grain is (race_year, race_id, lap_number).
      Tracks ambient and track surface temperature, and grip envelope changes over the race
      due to rubber lay-down and fuel load shedding.
    tags: [intermediate]
    meta:
      family: pace-baselines
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_synthetic_teammate
    description: >
      Synthetic teammate for driver skill extraction. Grain is (race_year, race_id, ego_driver_id, lap_number).
      Uses closest-match teammate with same car to create a counterfactual for what the driver would have done
      in the same equipment if conditions matched.
    tags: [intermediate]
    meta:
      family: skill
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: ego_driver_id
        description: The driver for whom we synthesize a teammate
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_event_corrections
    description: >
      Safety car, red flag, and other race event corrections. One row per lap with event flags
      indicating whether the lap should be treated as anomalous for skill extraction (e.g., SC restart, red flag laps).
    tags: [intermediate]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_lap_residual_decomposed
    description: >
      One row per lap. 7-term decomposition: splits lap time into fuel penalty, compound degradation,
      track rubber evolution, ambient weather, constructor car pace, dirty-air tax, and driver skill residual.
      Identity: pace_delta_s = fuel_component_s + compound_component_s + rubber_component_s + ambient_component_s
      + constructor_component_s + dirty_air_tax_s + driver_skill_residual_s.
      Driver skill residual = what remains after removing all physics/car/strategy factors.
    tags: [intermediate, causal_decomposition]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: valid_lap_in_stint
        description: Passed through from int_stint_geometry. Ordinal among valid laps only within the stint; consumers should key position/length logic off this, not lap_in_stint.
      - name: stint_length_valid
        description: Passed through from int_stint_geometry. Count of valid laps in the stint.
      - name: constructor_component_s
        description: >
          Constructor structural pace in seconds from int_constructor_structural_pace.
          Positive = slower than field.
        tests: [not_null]
      - name: dirty_air_tax_s
        description: >
          Per-lap dirty-air slowdown cost from int_dirty_air_tax_component.
          Non-negative seconds. Zero when not in dirty air.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0
      - name: driver_skill_residual_s
        description: >
          Residual after all 7 physics components. Cleaned of dirty-air signal vs pre-causal-decomposition.
          Positive = slower than field baseline after all adjustments.
        tests: [not_null]
      - name: total_explained_s
        description: Sum of all 7 components (fuel + compound + rubber + ambient + constructor + dirty_air_tax)
        tests: [not_null]

  - name: int_lap_anomaly_flags
    description: >
      Anomaly detection flags for data quality control. One row per lap.
      Uses trailing-7-lap MAD (median absolute deviation) to classify anomalies robustly
      (cliff, mistakes, event-driven, conditions, normal).
    tags: [intermediate]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_constructor_car_fe
    description: >
      De-biased constructor car pace (constructor×race fixed effect), one row per
      (race_year, race_id, constructor_id). A thin reader over
      data/fits/constructor_car_fe.parquet, fitted by
      tasks/coefficients/fit_constructor_car_fe.py via a two-way FE regression
      (pace_delta_s ~ 1 | driver_id + constructor_race) on the clean lap panel.
      car_fe_s estimates car pace net of driver skill (global driver anchor),
      so subtracting it removes the car without crediting a weak driver's slowness
      as skill. Consumed only by int_driver_race_skill_loro.driver_skill_field_s →
      int_driver_circuit_era_affinity (Ghost Car Standings). Negative = faster than field.
    tags: [intermediate, causal_decomposition, constructor]
    meta:
      family: skill
    columns:
      - name: constructor_car_fe_id
        description: Surrogate PK = race_year_raceid_constructorid
        tests: [not_null, unique]
      - name: race_year
        description: Season year
        tests: [not_null]
      - name: race_id
        description: Race identifier (matches int_lap_fuel_state.race_id, e.g. 2018_5)
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier (stg_laps.constructor_id)
        tests: [not_null]
      - name: car_fe_s
        description: >
          Constructor×race fixed effect in seconds, net of driver skill.
          Negative = faster than field.
        tests: [not_null]

  - name: int_constructor_structural_pace
    description: >
      One row per (race_year, race_id, constructor_id). Car-inherent pace advantage/penalty estimated
      from a re-centred median pace delta across same-constructor teammates in the same race, isolating
      car pace from driver skill via within-constructor, between-driver variation. A placeholder for
      the full panel regression (pyfixest HDFE fit) named in the model's own header; that fixed-effects
      estimate exists separately, as int_constructor_car_fe. Positive = slower car. Includes a normal-
      approximation 95% CI and clean pair sample counts for confidence.
    tags: [intermediate, causal_decomposition]
    meta:
      family: pace-baselines
    columns:
      - name: constructor_race_id
        description: Surrogate PK = hash(race_year, race_id, constructor_id)
        tests: [not_null, unique]
      - name: race_year
        description: Season year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier (FK to dim_constructors)
        tests: [not_null]
      - name: constructor_structural_pace_s
        description: >
          Re-centred median pace-delta coefficient in seconds (not yet a fitted fixed effect
          see the model description). Positive = slower than field. Identified via
          within-constructor, between-driver variation from teammate pairs.
        tests: [not_null]
      - name: constructor_structural_pace_se_s
        description: >
          Standard error of the median pace delta (stddev / √n), not yet a clustered (CRV1)
          regression SE. Positive, ≥0. Captures uncertainty in the coefficient estimate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.0
      - name: constructor_structural_pace_ci_low_s
        description: 95% confidence interval lower bound
        tests: [not_null]
      - name: constructor_structural_pace_ci_high_s
        description: 95% confidence interval upper bound
        tests: [not_null]
      - name: panel_observations_n
        description: Sample size of clean laps used in the aggregate estimate
        tests: [not_null]
      - name: clean_teammate_pair_laps_n
        description: >
          Count of clean laps where both teammates in a constructor ran (used to assess pair quality).
          Flags constructor-seasons where this is <100 laps.
        tests: [not_null]
      - name: r_squared_within
        description: >
          Within fixed-effect R² (sanity check; low is expected, high is good).
          NULL until the pyfixest model is in place   a misleading 0.0 is worse than NULL.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: fit_timestamp
        description: UTC timestamp when this coefficient was fitted (ISO 8601)
        tests: [not_null]
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: constructor_structural_pace_ci_high_s
            column_B: constructor_structural_pace_ci_low_s
            or_equal: true

  - name: int_constructor_deg_sensitivity
    description: >
      One row per (race_year, constructor_id, compound). Constructor-specific tyre degradation
      sensitivity: within-stint fixed-effects slope of the post-decomposition residual on tyre age,
      field-centred per (compound, season) and empirical-Bayes shrunk toward 0 (DerSimonian-Laird).
      Positive = degrades faster than the field-average compound curve. Feeds the ghost-car
      recombination interaction term (host slope minus ego slope) x age_in_stint, which is what
      lets host identity reorder drivers. slope_se and n_laps are carried for downstream SE
      propagation.
      cliff_onset_shift_laps is a per-constructor break-point offset (laps) for the field
      tyre-cliff onset, estimated as a bivariate within-stint hinge coefficient (extra post-onset
      degradation), field-centred and EB-shrunk like the linear slope, then mapped to an onset
      shift via the field severity and typical post-onset depth. Positive = cliff arrives later
      (gentler). Feeds the ghost-car cliff interaction term.
    tags: [intermediate, causal_decomposition, degradation]
    meta:
      family: strategy
    columns:
      - name: deg_sensitivity_id
        description: Surrogate PK = race_year || constructor_id || compound
        tests: [not_null, unique]
      - name: race_year
        description: Season year (cells are season-scoped; no cross-season pooling)
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier
        tests: [not_null]
      - name: compound
        description: Dry tyre compound the slope is estimated for
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD']
      - name: deg_slope_s_per_lap
        description: >
          Production value: EB-shrunk deviation from the field-mean within-stint slope, in s/lap
          per lap of tyre age. Positive = degrades faster than field. 0.0 for low-sample cells.
          2024 reference range: ~±0.025 s/lap on HARD, ~±0.08 on SOFT.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -0.25
                max_value: 0.25
      - name: deg_slope_raw_s_per_lap
        description: >
          Uncentred within-stint FE slope (diagnostic). Uniformly negative (~ -0.08 s/lap in 2024)
          because a common residual fuel under-correction survives the decomposition; the common
          part cancels in field-centring and in the (host - ego) recombination difference.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -0.5
                max_value: 0.5
      - name: field_mean_slope_s_per_lap
        description: Precision-weighted mean raw slope per (race_year, compound); the centring constant.
      - name: deg_slope_se_s_per_lap
        description: >
          FE-regression standard error of the raw slope (dof = n_laps - n_stints - 1), floored at
          1e-4. NULL for low-sample cells. Carried for downstream SE propagation.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.0
      - name: deg_slope_posterior_sd_s_per_lap
        description: >
          EB posterior sd of the shrunk slope; equals tau (prior sd) for low-sample cells and 0
          when tau^2 = 0 (no between-constructor signal).
        tests: [not_null]
      - name: shrink_factor
        description: tau^2 / (tau^2 + se^2) in [0,1]; 0 for low-sample cells.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: tau_s_per_lap
        description: DerSimonian-Laird between-constructor sd per (race_year, compound).
        tests: [not_null]
      - name: n_laps
        description: Clean dry pre-cliff laps in the cell (cell-count; qualifying rule >= 30).
        tests: [not_null]
      - name: n_stints
        description: Distinct stints in the cell (qualifying rule >= 5).
        tests: [not_null]
      - name: is_low_sample
        description: TRUE when the cell fails minimum-cell rules; slope forced to 0, excluded from pooling.
        tests: [not_null]
      - name: cliff_onset_shift_laps
        description: >
          Per-constructor tyre-cliff onset shift in laps relative to the
          field onset. Positive = cliff arrives LATER (gentler), negative = EARLIER (harsher).
          0.0 for cells without enough post-onset depth. Clipped to +/-3 laps.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -3.0
                max_value: 3.0
      - name: cliff_onset_shift_se_laps
        description: >
          SE of the onset shift (hinge SE mapped through ref_depth / severity). NULL for
          low-sample cells. Carried for downstream SE propagation.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 50.0
      - name: cliff_hinge_coef_s_per_lap
        description: >
          Diagnostic: raw bivariate within-stint hinge coefficient (extra s/lap of degradation
          after the field onset). Uniformly negative like the linear slope; common part cancels
          in field-centring.
      - name: cliff_hinge_field_mean_s_per_lap
        description: Precision-weighted mean hinge coefficient per (race_year, compound); the centring constant.
      - name: cliff_severity_used_s_per_lap
        description: Median field post-onset severity (s/lap) per (compound, season), floored at 0.30, used in the shift mapping.
      - name: cliff_ref_depth_laps
        description: Mean laps past the field onset over post-onset clean laps per (compound, season); the depth at which the hinge deviation is converted to an onset shift.
      - name: cliff_hinge_tau_s_per_lap
        description: DerSimonian-Laird between-constructor sd of the hinge coefficient per (race_year, compound).
      - name: n_post_cliff_laps
        description: Post-onset clean laps in the cell (qualifying rule >= 30).
        tests: [not_null]
      - name: n_deep_cliff_laps
        description: Post-onset laps at least 2 laps past onset (depth rule >= 15); guards against shallow-crossing noise.
        tests: [not_null]
      - name: n_stints_cliff
        description: Distinct stints contributing post-onset laps (qualifying rule >= 5).
        tests: [not_null]
      - name: is_low_sample_cliff
        description: TRUE when the cell fails cliff minimum-cell rules; cliff_onset_shift_laps forced to 0.
        tests: [not_null]
      - name: fit_timestamp
        description: UTC timestamp when the slopes were fitted (ISO 8601)
        tests: [not_null]

  - name: int_dirty_air_tax_component
    description: >
      One row per lap. Cost of driving in dirty air (turbulent wake) following another car.
      Uses prior-lap dirty-air intensity to establish causality: current lap slowdown → prior lap's position.
      Avoids reverse causality. Seconds lost = θ_air × dirty_air_intensity_lag1, capped [0, 5.0] seconds.
    tags: [intermediate, causal_decomposition]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: PK, FK to stg_laps
        tests: [not_null, unique]
      - name: dirty_air_intensity_lag1
        description: One-lap-lagged dirty-air intensity from int_lap_air_state
        tests: [not_null]
      - name: dirty_air_tax_s
        description: >
          Per-lap dirty-air slowdown in seconds. θ_air × dirty_air_intensity_lag1.
          Positive (slower cost). Bounded [0, 5.0].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0
      - name: dirty_air_tax_se_s
        description: Standard error of the tax estimate via propagation
        tests: [not_null]
      - name: tax_calibration_confidence
        description: >
          Confidence in the tax [0, 1]. Degrades when calibration sample <1000 or
          intensity is extreme (>2.5).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: cumulative_dirty_air_tax_race_s
        description: Running race-cumulative sum of per-lap dirty-air tax for each driver
        tests: [not_null]
      - name: dirtiest_air_lap_in_race_flag
        description: TRUE on the lap where this driver's per-lap tax is at its maximum in the race
        tests: [not_null]

  - name: int_sector_residual_decomposed
    description: >
      One row per lap per sector (3 rows/lap). Breaks down lap-level physics components
      (fuel, compound, rubber, ambient, constructor, dirty_air) to individual sectors
      proportional to sector time. Grain: (lap_id, sector). Allows per-sector skill analysis.
      Matches stg_sector_times granularity. Identity: sector_pace_delta = sector_components + sector_skill_residual.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: sector_id
        description: PK = lap_id || '_S' || sector. Matches stg_sector_times convention.
        tests: [not_null, unique]
      - name: lap_id
        description: FK to stg_laps
        tests: [not_null]
      - name: sector
        description: Sector number (1, 2, or 3)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: sector_time_s
        description: Raw sector time in seconds
        tests: [not_null]
      - name: sector_pace_delta_s
        description: sector_time_s minus rolling ±3 lap field sector median
        tests: [not_null]
      - name: sector_driver_skill_residual_s
        description: Closure residual after all 6 allocated components
        tests: [not_null]
      - name: sector_total_explained_s
        description: Sum of the 6 allocated components
        tests: [not_null]
      - name: dominant_component_class
        description: >
          Component with the largest absolute value among the 6 allocated components.
          Values: fuel, compound, rubber, ambient, constructor, dirty_air
        tests:
          - accepted_values:
              arguments:
                values: ['fuel', 'compound', 'rubber', 'ambient', 'constructor', 'dirty_air']

  - name: int_corner_skill_residuals
    description: >
      One row per lap per named corner. Decomposes corner skill into braking, mid-corner,
      and exit phases relative to field median (5-lap rolling window). Grain: (lap_id, corner_name).
      Null when field sample < 5 drivers. Enables high-res corner-by-corner skill profiling.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: corner_id
        description: PK = lap_id || '_C_' || corner_name
        tests: [not_null, unique]
      - name: lap_id
        description: FK to stg_laps
        tests: [not_null]
      - name: corner_name
        description: Named corner from dim_corners
        tests: [not_null]
      - name: field_corner_sample_n
        description: Number of drivers in the field median for this corner/lap_window
        tests: [not_null]
      - name: corner_unmapped_flag
        description: TRUE when field_corner_sample_n < 5 (residuals are NULL)
        tests: [not_null]

  # ──────────────────────────────────────────────────────────
  # Simulation   Surface expansion
  # ──────────────────────────────────────────────────────────

  - name: int_qualifying_segments
    description: >
      One row per (race_year, race_id, quali_segment). The Q1/Q2/Q3 windows of each qualifying
      session, recovered by anchoring the session-status timeline (stg_session_status_qualifying)
      to the official per-driver segment times (stg_results_qualifying). FastF1 reports one flat
      lap set per Q session with no segment column, so before this model every qualifying baseline
      was computed per race   pooling a Q1 first effort with a Q3 final lap across ~1s of track
      evolution and a self-selected top-10 field. Verified against the official results by
      assert_quali_segment_matches_official.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
    columns:
      - name: quali_segment_id
        description: Surrogate PK = concat(race_id, '_Q', segment_index).
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id; matches stg_laps_qualifying.race_id.
        tests: [not_null]
      - name: quali_segment
        description: Segment label   'Q1', 'Q2' or 'Q3'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Q1', 'Q2', 'Q3']
      - name: segment_index
        description: 1 for Q1, 2 for Q2, 3 for Q3.
        tests: [not_null]
      - name: segment_start_s
        description: Session clock (s) at the segment's green light.
        tests: [not_null]
      - name: segment_end_s
        description: >
          Session clock (s) at the segment's chequered flag; the unresumed red flag that ended it,
          or the session's 'Finalised', when no chequered flag fell.
      - name: segment_span_s
        description: >
          segment_end_s minus segment_start_s. Nominally 1080s (Q1), 900s (Q2), 720s (Q3); longer
          when a red flag suspended the clock.
      - name: stoppage_n
        description: Red-flag stoppages ('Aborted' events) inside the segment window.
      - name: anchor_lap_n
        description: >
          Official segment times matched back to the lap that set them. Diagnostic   a low count
          means the segment's boundary rests on few anchors.
      - name: window_start_s
        description: >
          Lower bound (inclusive) for assigning a lap to this segment by lap_start_time_s.
          NULL for Q1, whose window is open at the bottom so pre-session installation laps land there.
      - name: window_end_s
        description: >
          Upper bound (exclusive) = the next segment's green light. NULL for Q3. Deliberately not
          the chequered flag: the in-lap every driver runs starts after it and still belongs to
          the segment.

  - name: int_qualifying_push_laps
    description: >
      One row per qualifying lap (gated or not, so consumers filter rather than lose the row set).
      Assigns each lap to its Q1/Q2/Q3 segment and applies the push-lap gate that stg_laps_qualifying
      cannot: is_valid_lap removes out-laps and in-laps, but not the cool-down lap between two push
      laps, which carries no pit time and passes every other check. 25% of the laps previously
      treated as valid were more than 107% off their segment's best.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying.
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id.
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code.
        tests: [not_null]
      - name: quali_segment
        description: >
          Segment the lap was set in   'Q1', 'Q2' or 'Q3', or 'Q' when the session has no
          recoverable segment structure (the pre-segment behaviour, not a dropped row).
        tests: [not_null]
      - name: segment_best_s
        description: Fastest valid lap set in this session's segment.
      - name: driver_segment_best_s
        description: This driver's fastest valid lap in this session's segment.
      - name: ratio_to_segment_best
        description: >
          lap_time_s / segment_best_s. Above 1.07 on a push lap means the lap was admitted by the
          driver's-own-best carve-out rather than the 107% cut   43 laps of 14,165, a handful of
          which are aborted runs that were the driver's only lap in the segment. Filter on this if
          you need a stricter set.
      - name: is_push_lap
        description: >
          The gate: a valid, timed lap within quali_push_lap_ratio (1.07) of its segment's best,
          or the driver's own best lap in that segment so that no driver drops out of the
          decomposition entirely.
        tests: [not_null]

  - name: int_lap_fuel_state_qualifying
    description: >
      One row per qualifying lap. Fuel weight correction for qualifying (flat 12 kg assumption).
      Fuel component negligible (~0.42 s). Enables matching between int_lap_residual_decomposed (race)
      and int_lap_residual_decomposed_qualifying (quali) on grain.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]

  - name: int_constructor_structural_pace_qualifying
    description: >
      One row per (race_year, race_id, constructor_id). Car pace advantage in qualifying
      (one-lap trim) via same panel regression as race version. Different coefficient expected
      vs race due to fuel load and strategy differences. Single-lap setup may favor different cars.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
    columns:
      - name: constructor_race_id
        description: Surrogate PK = concat(race_year, race_id, constructor_id, '_Q')
        tests: [not_null, unique]
      - name: constructor_structural_pace_s
        description: >
          Constructor qualifying-mode coefficient. Fit on each driver's best push lap per Q1/Q2/Q3
          segment, measured against that segment's median push lap and re-centred within the
          segment before pooling. Positive = slower.
        tests: [not_null]

  - name: int_lap_residual_decomposed_qualifying
    description: >
      One row per qualifying lap. 7-term decomposition mirroring int_lap_residual_decomposed
      but with qualifying-specific coefficients (near-zero fuel, cliff-suppressed compound degradation,
      quali-mode car pace). Grain: lap_id. Enables quali-vs-race skill comparison.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]
      - name: quali_driver_skill_residual_s
        description: >
          Driver pure quali skill residual   purer single-lap pace signal than race. The identity
          closes in closed form, so this term absorbs whatever the baseline gets wrong; gating the
          lap set to push laps and taking the baseline per segment moved its mean absolute value
          from 7.04s (sd 13.13) to 0.76s (sd 1.33), against a real qualifying field spread of ~1-3s.
        tests: [not_null]
      - name: quali_segment
        description: Q1/Q2/Q3 segment the lap was set in (FK to int_qualifying_segments).
        tests: [not_null]
      - name: base_track_pace_s
        description: >
          Field-pace baseline: the median push lap of this lap's own segment, not of the whole
          session.
      - name: ratio_to_segment_best
        description: lap_time_s / the best valid lap in the same segment.
      - name: track_unexplained_s
        description: >
          The track-evolution model's own residual for the event, carried informationally and
          deliberately not part of the identity   the same treatment as track_unexplained_s on the
          race side. Race-day proxy, like rubber_component_s and ambient_component_s here.

  - name: int_qualifying_decomposed
    description: >
      One row per qualifying lap. 7-term residual decomposition (public-facing) plus quali_vs_race_skill_delta_s:
      how much faster/slower is this driver in qualifying vs their race average? Positive = single-lap specialist.
      Grain: lap_id. Used in analytics dashboards to profile driver strengths.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]
      - name: quali_skill_residual_s
        description: Per-lap qualifying driver skill residual.
        tests: [not_null]
      - name: quali_vs_race_skill_delta_s
        description: >
          Per-driver per-event differential between qualifying and race skill.
          Positive = qualifying specialist. NULL when no race data available for that event.
      - name: quali_skill_session_avg_s
        description: >
          Driver's qualifying skill for the event: the residual of their best push lap in each
          segment, averaged over the segments they contested. Previously the mean over every lap
          FastF1 flagged IsPersonalBest, which fires on every improving lap (4.58 per driver-race,
          up to 15) and charged a driver who built up incrementally as much as ~4s of pure
          aggregation artefact.
      - name: quali_segments_contested_n
        description: Segments (1-3) in which the driver set a best push lap.
      - name: quali_segment
        description: Q1/Q2/Q3 segment the lap was set in (FK to int_qualifying_segments).
        tests: [not_null]

  - name: int_pit_strategy_value
    description: >
      One row per stint. Evaluates pit strategy: what was the optimal pit lap vs actual?
      The argmin of int_pit_strategy_cost_curve's Total_Cost(L) over every candidate lap in
      the horizon, replacing the "first lap where expected wear exceeds 0.5 s" threshold that
      stood here until 2026-08-23 and had no pit-loss term in it. That threshold returned
      'optimal' on 8 stints of 7,129 and 'unknown' on 2,231; the argmin returns 715 and 266.
      Two horizons are reported. The verdict follows the two-stint window (this stint's first
      lap through the next stint's last), the only framing well posed for the 61% of stints in
      a 2-stop or longer race; the race-remainder optimum is carried alongside as a diagnostic.
      opportunity_cost_s is now Total_Cost(actual) - Total_Cost(optimal), so pitting early
      carries a cost too, which the overrun-only definition could not express.
      Pit-loss is per circuit from int_pit_loss_circuit's empirical, EB-shrunk estimate
      (19.3–29.6 s over the 147 races that resolve one), falling back to the circuit_reference
      seed and then 21.0 s; pit_loss_source records which was used.
    tags: [intermediate, simulation, strategy]
    meta:
      family: strategy
    columns:
      - name: stint_id
        description: PK, FK to int_stint_geometry
        tests: [not_null, unique]
      - name: optimal_pit_lap
        description: >
          Optimal pit lap number (absolute race lap) - the lap the car enters the pit lane,
          i.e. one after the last lap run on the set, matching stg_pits.pit_in_lap_number.
          NULL when the compound has no fitted curve to minimise over.
      - name: optimal_pit_lap_in_stint
        description: >
          Optimal laps to run on the set before boxing, counted in VALID laps. Not a
          chronological lap_in_stint: SC and pit laps do not age a tyre the way a racing lap
          does, and the cost curve is indexed on tyre age.
      - name: actual_pit_lap
        description: Actual pit lap number from stg_pits. NULL for last stint of race.
      - name: overrun_laps
        description: >
          Actual laps run on the set minus optimal, in valid laps. Negative = pitted early.
          Compared as offsets rather than lap numbers so an invalid lap before the stop cannot
          skew it. NULL when either side is NULL. Median -1 across seven seasons: teams stop
          slightly earlier than a degradation-only optimum, which is what track position buys.
      - name: opportunity_cost_s
        description: >
          Total_Cost(actual) - Total_Cost(optimal), in seconds. Non-negative by construction:
          the optimum is a minimum over the same curve. Zero for a stint that never stopped,
          which had no pit decision to grade. Median 5.5 s, p95 83 s.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 6000.0
              config:
                where: "opportunity_cost_s IS NOT NULL"
      - name: strategy_verdict
        description: Strategy classification.
        tests:
          - accepted_values:
              arguments:
                values: ['optimal', 'overran', 'undercut_forced', 'early', 'unknown']
              config:
                where: "strategy_verdict IS NOT NULL"
      - name: optimal_pit_lap_confidence
        description: >
          How sharply identified the optimum is: the share of candidate laps whose total cost
          is more than a second worse than it. 1.0 = one lap stands out; near 0 = the curve is
          flat and the exact lap barely matters. 0.0 where no curve exists. Replaces the
          0.0/0.1/0.8 sentinel ladder, which encoded whether cliff onset was NULL rather than
          anything about the estimate.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: pit_lane_loss_s
        description: >
          Pit-lane loss used for this stint's undercut-threat scan, in seconds. Empirical
          where int_pit_loss_circuit resolves the venue, else the circuit_reference seed,
          else 21.0.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60
      - name: pit_loss_source
        description: Which pit-loss estimate this row used - empirical / seed / default.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['empirical', 'seed', 'default']
      - name: pit_loss_imputed_flag
        description: >
          TRUE when nothing was measured on either side - no empirical stops resolved and the
          seed row was itself a guess.
        tests: [not_null]
      - name: horizon_source
        description: >
          Which horizon the verdict's argmin used - two_stint (4,014 stints) or the
          race_remainder fallback for a stint with no successor (2,642). NULL where no fitted
          compound curve exists to minimise over (473).
        tests:
          - accepted_values:
              arguments:
                values: ['two_stint', 'race_remainder']
              config:
                where: "horizon_source IS NOT NULL"
      - name: horizon_laps
        description: Length of that horizon in valid laps.
      - name: optimal_pit_lap_race_in_stint
        description: >
          The race-remainder optimum, in valid laps on the set. Diagnostic: asks the harsher
          unconditional question "if they had stopped only once more all race, when?" rather
          than grading the stop inside the strategy the team actually ran.
      - name: optimal_pit_lap_race
        description: Absolute race lap for optimal_pit_lap_race_in_stint.
      - name: opportunity_cost_race_s
        description: >
          The same actual-minus-optimal difference measured on the race-remainder horizon.
          Systematically larger than opportunity_cost_s for a 2-stopper, because a one-stop
          counterfactual charges them for a stop they were never going to skip.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 6000.0
              config:
                where: "opportunity_cost_race_s IS NOT NULL"

  - name: int_pit_strategy_cost_curve
    description: >
      One row per (stint_id, horizon_scope, candidate_pit_lap_offset): the Total_Cost(L)
      surface int_pit_strategy_value's header described for two years and never computed.
      Cost of pitting after L laps on the current set = wear on the old set over those laps
      + wear on the next set over the rest of the horizon + a compound baseline offset
      + pit-lane loss discounted by the chance a safety car has already appeared.
      L = H is the no-stop candidate, which pays no pit term and is what makes a stop have to
      justify itself. THE SC DISCOUNT IS LOAD-BEARING: under a fixed one-stop the pit loss is
      the same whenever you take it, so it adds a constant to every candidate and cancels out
      of the argmin entirely - a longer pit lane would move nothing. Discounting it by
      1 - (1 - m)(1 - (1 - h)^L), with h from int_sc_hazard_history, is what makes waiting pay
      and gives the model the property assert_pit_loss_pushes_optimum_later checks.
      Per-lap wear is capped at var('pit_strategy_max_wear_s_per_lap'): the cliff polynomial
      is unbounded, reaching 136 s/lap extrapolated to age 80 and already 93 s/lap in-sample.
    tags: [intermediate, simulation, strategy]
    meta:
      family: strategy
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [stint_id, horizon_scope, candidate_pit_lap_offset]
    columns:
      - name: stint_id
        description: FK to int_stint_geometry. Part of the compound PK.
        tests: [not_null]
      - name: horizon_scope
        description: >
          window = this stint's first lap through the next stint's last; race = through the
          driver's last lap of the race. Both are emitted for every stint that has them.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['window', 'race']
      - name: horizon_laps
        description: Length of the horizon in valid laps.
        tests: [not_null]
      - name: candidate_pit_lap_offset
        description: >
          Laps run on the current set before boxing, in valid laps. Runs 1..horizon_laps;
          the last value is the no-stop candidate. Part of the compound PK.
        tests: [not_null]
      - name: laps_on_new_set
        description: horizon_laps minus the offset. Zero for the no-stop candidate.
        tests: [not_null]
      - name: old_wear_cost_s
        description: >
          Cumulative wear over the laps run on the current set, evaluated on its own fitted
          curve from the age the stint opened on - a stint started on a used set begins
          part-way up that curve rather than at zero.
        tests: [not_null]
      - name: new_wear_cost_s
        description: Cumulative wear over the rest of the horizon on the next set, from age 1.
        tests: [not_null]
      - name: baseline_cost_s
        description: >
          Per-lap pace offset between the two compounds (compound_grip_peak plus the
          optimal-temperature term) over the laps on the new set. Both inputs are per-compound
          CONSTANTS in compound_cliff_params, never fitted, and grip_peak as typed prices SOFT
          slower than HARD. var('pit_strategy_baseline_delta') decides whether this term is
          allowed to move the argmin; setting it FALSE zeroes this column.
        tests: [not_null]
      - name: sc_hazard_per_lap
        description: >
          Per-racing-lap SC/VSC hazard for the circuit, EB-shrunk, from int_sc_hazard_history.
          0.0 for a circuit with no ingested track_status timeline, which makes the discount
          constant and returns the model to the pit-loss-cancels case.
        tests: [not_null]
      - name: sc_probability
        description: P(a caution has appeared within the candidate's laps) = 1 - (1 - h)^L.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: pit_discount_factor
        description: >
          Fraction of the green-flag pit-lane loss this candidate expects to pay. Non-increasing
          in the candidate lap - asserted by assert_pit_discount_monotone - and a hard 0 for the
          no-stop candidate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: wear_cost_s
        description: >
          Everything that does not scale with pit_lane_loss_s. Split out so a consumer - or
          assert_pit_loss_pushes_optimum_later - can re-minimise at a different pit loss
          without rebuilding the curve.
        tests: [not_null]
      - name: total_cost_s
        description: wear_cost_s + pit_lane_loss_s x pit_discount_factor. The argmin target.
        tests: [not_null]

  - name: int_circuit_x_constructor_interaction
    description: >
      One row per (race_year, race_id, constructor_id). Circuit-specific car advantage beyond
      season-average. E.g., Red Bull faster at high-downforce tracks. The shrinkage pool is keyed
      on the physical-circuit id, so a renamed event or double-header (e.g. mexican_grand_prix /
      mexico_city_grand_prix) shares one pool rather than splitting into two thinner cells.
      Shrunk toward 0 (Bayesian prior). Positive = slower at this circuit than season average.
    tags: [intermediate, simulation, ghost_car]
    meta:
      family: pace-baselines
    columns:
      - name: constructor_race_id
        description: Surrogate PK
        tests: [not_null, unique]
      - name: circuit_constructor_interaction_s
        description: Seconds adjustment for this constructor at this circuit. Positive = slower.
        tests: [not_null]

  - name: int_tyre_surface_vs_bulk_decoupling
    description: >
      One row per lap (post-cliff only). After tyre cliff, diagnoses whether degradation is
      surface-recoverable or bulk-structural. surface_bulk_ratio [0,1]: high = recoverable,
      low = must pit. Includes recovery_probability (pace-recovery chance within 2 laps).
      Grain: lap_id filtered to cliff_onset_passed = TRUE.
    tags: [intermediate, simulation, thermal]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps (post-cliff laps only)
        tests: [not_null, unique]
      - name: surface_bulk_ratio
        description: push_load_surface / (push_load_surface + push_load_bulk). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: degradation_source
        description: Classification based on surface_bulk_ratio thresholds.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['surface_driven', 'bulk_driven', 'mixed']
      - name: recovery_probability
        description: Probability of pace recovery within 2 laps. [0, 1]. SQL approximation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: thermal_attribution_s
        description: Share of compound_component_s attributable to thermal (surface) damage.
        tests: [not_null]

  - name: int_driver_circuit_affinity
    description: >
      One row per (driver_id, circuit_id). How much faster/slower is this driver at this circuit
      relative to their career average? circuit_id is the physical-circuit identifier, so renamed
      events and double-headers at one venue (e.g. mexican_grand_prix / mexico_city_grand_prix)
      pool into a single track record. Shrunk toward driver mean (Bayesian, prior = 5 virtual races).
      Negative = faster at this circuit than career average. affinity_confidence [0,1]: < 0.17 = prior-dominated.
      Identifies drivers who suit high-downforce, street, etc. tracks.
    tags: [intermediate, driver_rating, driver_affinity]
    meta:
      family: skill
    columns:
      - name: driver_circuit_id
        description: Surrogate PK = hash(driver_id, circuit_id)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: circuit_id
        description: >
          Physical-circuit identifier (slug of circuit_name). Collapses event-slug
          aliases (renamed events, double-headers) onto one venue.
        tests: [not_null]
      - name: circuit_name
        description: Canonical circuit display name for this circuit_id.
        tests: [not_null]
      - name: n_obs
        description: Number of race-residual observations backing this estimate
        tests: [not_null]
      - name: seasons_observed_n
        description: Count of distinct seasons the driver raced at this circuit
        tests: [not_null]
      - name: raw_affinity_s
        description: Unshrunk observed mean residual at this circuit. Negative = faster.
        tests: [not_null]
      - name: shrunk_affinity_s
        description: Bayesian posterior mean. Pulled toward driver global mean.
        tests: [not_null]
      - name: shrunk_affinity_se_s
        description: Posterior standard error in seconds. Non-negative.
        tests:
          # SE is NULL only for degenerate single-observation cells where the
          # posterior variance collapses to zero (SQRT(NULLIF(var, 0))). On real
          # data every cell is estimable; the NULL surfaces only on tiny CI
          # fixtures. Scope not_null to multi-obs cells, which must always be
          # estimable. Range check ignores NULLs natively.
          - not_null:
              config:
                where: "n_obs > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: shrunk_affinity_ci_low_s
        description: Lower bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_ci_high_s
        description: Upper bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: affinity_confidence
        description: Data fraction of posterior mass. n_obs / (n_obs + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_driver_circuit_era_affinity
    description: >
      One row per (driver_id, circuit_id, era_key). Same shrinkage as int_driver_circuit_affinity
      but split on the 2022 ground-effect regulation boundary so a driver's track record is never
      blended across incomparable car eras (pre2022 = 2018–2021, post2022 = 2022–2024). circuit_id
      is the physical-circuit identifier, so renamed events and double-headers at one venue pool
      into a single track record. Within an
      era the residual is car-removed, so ranking drivers by shrunk_affinity_s ≈ "equal-car track
      record" at that circuit. Shrunk toward the driver's within-era global mean (Bayesian, prior =
      5 virtual races). Negative = faster than field. Backs the Ghost Car Standings feature.
    tags: [intermediate, driver_rating, driver_affinity]
    meta:
      family: skill
    columns:
      - name: driver_circuit_era_id
        description: Surrogate PK = hash(driver_id, circuit_id, era_key)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: circuit_id
        description: >
          Physical-circuit identifier (slug of circuit_name). Collapses event-slug
          aliases (renamed events, double-headers) onto one venue.
        tests: [not_null]
      - name: circuit_name
        description: Canonical circuit display name for this circuit_id.
        tests: [not_null]
      - name: era_key
        description: Regulation era. pre2022 = 2018–2021, post2022 = 2022–2024.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre2022', 'post2022']
      - name: era_label
        description: Human-readable era span ('2018–2021' / '2022–2024').
        tests: [not_null]
      - name: n_obs
        description: Number of race-residual observations backing this estimate within the era
        tests: [not_null]
      - name: seasons_observed_n
        description: Count of distinct seasons the driver raced at this circuit within the era
        tests: [not_null]
      - name: raw_affinity_s
        description: Unshrunk observed mean residual at this circuit-era. Negative = faster.
        tests: [not_null]
      - name: shrunk_affinity_s
        description: Bayesian posterior mean. Pulled toward the driver's within-era global mean.
        tests:
          # NULL at n_obs = 1: a single race is one data point, not a track
          # record, and the posterior at that n is too prior-dominated to be
          # worth publishing. Scope not_null to estimable multi-obs cells.
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_se_s
        description: Posterior standard error in seconds. Non-negative.
        tests:
          # See int_driver_circuit_affinity: SE/CI are NULL only for degenerate
          # single-observation cells (posterior variance collapses to zero).
          # Scope not_null to estimable multi-obs cells.
          - not_null:
              config:
                where: "n_obs > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: shrunk_affinity_ci_low_s
        description: Lower bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_ci_high_s
        description: Upper bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: affinity_confidence
        description: Data fraction of posterior mass. n_obs / (n_obs + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_driver_race_skill_loro
    description: >
      De-confounded absolute equal-car skill, race grain
      (race_year, race_id, driver_id). driver_skill_loro_s = P20 ceiling minus the LORO
      teammate baseline (used by the rating chain). driver_skill_field_s = median pace
      delta minus the de-biased constructor×race FE (int_constructor_car_fe.car_fe_s,
      car pace net of driver skill); used only by int_driver_circuit_era_affinity / Ghost
      Car Standings leaderboard, fixing the weak-teammate inflation confound. Negative =
      faster than field (both signals).
    tags: [intermediate, driver_rating, causal_decomposition]
    meta:
      family: skill
    columns:
      - name: driver_race_skill_id
        description: Surrogate PK = hash(race_year, race_id, driver_id)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: race_year
        description: Race year (integer)
        tests: [not_null]
      - name: race_id
        description: Race identifier (numeric)
        tests: [not_null]
      - name: driver_skill_loro_s
        description: >
          De-confounded equal-car skill, seconds. P20 of focal deltas minus LORO car baseline.
          Negative = faster. NULL when the driver is the only one with clean laps in his car
          that race (no equal-car reference). Used by the rating chain.
      - name: driver_skill_field_s
        description: >
          Field-anchored equal-car skill, seconds. Median pace delta minus the de-biased
          car term (int_constructor_car_fe.car_fe_s the constructor×race FE, car pace
          net of driver skill). The FE's global driver anchor fixes the weak-teammate
          inflation confound that the old constructor-median term still leaked (that
          median absorbed the team's driver skill, so subtracting it handed a weak
          driver's slowness back as skill). NULL when the constructor×race FE is
          unidentified for this race. Used only by int_driver_circuit_era_affinity
          (Ghost Car Standings leaderboard).
      - name: clean_lap_count
        description: Clean laps contributing to this driver-race estimate.
        tests: [not_null]

  - name: int_driver_season_ratings
    description: >
      One row per (driver_id, season). Aggregates race residuals to season grain.
      Shrunk toward season league average (Bayesian, prior = 5 virtual races).
      Negative = faster than season average. Intermediate for era_normalized_driver_rating.
      Isolates driver strength from era variation (e.g., 2016 vs 2022 regulations).
    tags: [intermediate, driver_rating, era_rating]
    meta:
      family: skill
    columns:
      - name: driver_season_id
        description: Surrogate PK = hash(driver_id, season)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: season
        description: Race year (integer)
        tests: [not_null]
      - name: n_races
        description: Races contributing to this estimate
        tests: [not_null]
      - name: raw_residual_mean_s
        description: Unadjusted season mean residual. Negative = faster.
        tests: [not_null]
      - name: shrunk_residual_s
        description: Bayesian posterior mean toward season league average.
        tests: [not_null]
      - name: shrunk_residual_se_s
        description: Posterior standard error in seconds.
        tests:
          # NULL only for degenerate single-race cells where posterior variance
          # collapses to zero. Scope not_null to multi-race cells (always
          # estimable); the NULL surfaces only on tiny CI fixtures.
          - not_null:
              config:
                where: "n_races > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: rating_confidence
        description: Data fraction of posterior mass. n_races / (n_races + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_era_normalized_driver_rating
    description: >
      One row per (driver_id, season). Cross-era driver rating: compares drivers across 2018–2024
      despite regulation changes (2022 ground-effect boundary). Uses bridge drivers (≥8 races both eras)
      to estimate era offset, then adjusts season residuals. era_adjusted_rating = comparable across eras;
      negative = faster than era average. low_anchor_sample_flag = few bridge drivers (weak offset).
    tags: [intermediate, driver_rating, era_rating]
    meta:
      family: skill
    columns:
      - name: driver_season_id
        description: Surrogate PK = hash(driver_id, season). Matches int_driver_season_ratings.
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: season
        description: Race year (integer)
        tests: [not_null]
      - name: raw_residual_mean_s
        description: Unadjusted season mean. Not era-adjusted.
        tests: [not_null]
      - name: shrunk_residual_s
        description: Bayesian posterior mean (season shrinkage applied, no era offset).
        tests: [not_null]
      - name: era_adjusted_rating
        description: Cross-era comparable rating. Negative = faster than era average. Key output column.
        tests: [not_null]
      - name: era_adjusted_rating_se_s
        description: Propagated SE (sqrt of shrunk SE² + era shift SE²).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3.0
      - name: era_adjusted_rating_ci_low_s
        description: Lower bound of 95% CI on era_adjusted_rating
        tests: [not_null]
      - name: era_adjusted_rating_ci_high_s
        description: Upper bound of 95% CI on era_adjusted_rating
        tests: [not_null]
      - name: rating_confidence
        description: n_races / (n_races + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: bridge_driver_anchor_flag
        description: TRUE if this driver was used to estimate the era offset.
        tests: [not_null]
      - name: low_anchor_sample_flag
        description: TRUE if fewer than 3 bridge drivers found; era offset is 0 when this fires.
        tests: [not_null]

  - name: int_sc_hazard_history
    description: >
      Safety-Car / Virtual-Safety-Car base rate per circuit (venue slug), as a
      hazard per racing lap. Estimated from SC/VSC deployment onsets in
      stg_track_status with racing-lap exposure from stg_laps, over the set of
      races that have an ingested track_status timeline. Raw and
      empirical-Bayes-shrunk rates are provided. Not yet read by any downstream
      dbt model or app feature  -  scripts/mc_finish_order.py (the Monte Carlo
      finish-order roll-forward) is a candidate consumer but does not read this
      model today.
    meta:
      family: strategy
    columns:
      - name: circuit_slug
        description: Venue identifier (race name slug, e.g. monaco_grand_prix); recurs across seasons.
        tests: [not_null, unique]
      - name: n_races
        description: Number of races with a track_status timeline observed at this circuit.
        tests: [not_null]
      - name: racing_laps
        description: Total racing-lap exposure (sum of per-race leader lap counts) the hazard denominator.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100000
      - name: sc_hazard_per_lap
        description: Raw Safety-Car onsets per racing lap.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: vsc_hazard_per_lap
        description: Raw Virtual-Safety-Car onsets per racing lap.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: any_hazard_per_lap
        description: Raw combined SC+VSC onsets per racing lap.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: sc_hazard_per_lap_shrunk
        description: Empirical-Bayes SC hazard shrunk toward the global pooled rate (pseudo-count sc_hazard_prior_laps).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: vsc_hazard_per_lap_shrunk
        description: Empirical-Bayes VSC hazard shrunk toward the global pooled rate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: any_hazard_per_lap_shrunk
        description: Empirical-Bayes combined SC+VSC hazard shrunk toward the global pooled rate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_pit_loss_circuit
    description: >
      Empirical circuit-specific pit-lane loss prior, read by int_pit_strategy_value in
      place of the largely-imputed circuit_reference constant. Per stop, loss = (in_lap −
      ref) + (out_lap − ref) where ref is the driver's median green lap that race; the
      value is the median across stops within a sane [pit_loss_min_s, pit_loss_max_s]
      window, EB-shrunk toward the global median. Stops whose in-lap or out-lap ran under
      SC, VSC or a red flag are excluded — under a neutralisation the lap the stop is
      measured against is not the lap the driver would otherwise have run. Estimated per
      physical venue (circuit_id) so a renamed event or double-header shares one pit lane
      and one sample, then emitted per event slug so the consumer's race_to_track join is
      unchanged. Scoped to races with a venue slug available.
    meta:
      family: strategy
    columns:
      - name: circuit_slug
        description: Event identifier (race name slug); recurs across seasons. PK.
        tests: [not_null, unique]
      - name: circuit_id
        description: >
          Physical-venue identifier the estimate is pooled on. Several event slugs can share
          one circuit_id (british / 70th_anniversary, brazilian / são_paulo, mexican /
          mexico_city, austrian / styrian) and then carry identical values by construction.
        tests: [not_null]
      - name: n_stops
        description: Number of clean green-flag pit stops observed at this physical venue.
        tests: [not_null]
      - name: pit_loss_s_empirical
        description: Median empirical pit-lane loss (seconds) across observed stops.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60
      - name: pit_loss_s_shrunk
        description: Pit-lane loss EB-shrunk toward the global median (pseudo-count pit_loss_prior_stops).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60

  - name: int_lap_residual_stint_detrend
    description: >
      Per-stint linear drift of driver_skill_residual_s against lap_in_stint, fit on pre-cliff
      laps only (cliff_onset_passed = FALSE) via OLS REGR_SLOPE. One row per stint with >= 3
      pre-cliff laps; stints with fewer laps get drift_s_per_lap = 0.0 (no detrending, no data).
      Consumed by fct_cliff_prediction_features to produce next_lap_degradation_jump_detrended_s
      the per-lap first-difference with this per-stint drift (fuel burn / track evolution leaking
      into the residual) removed. Diagnostic: pooled median slope ≈ -0.072 s/lap across ~5,950 stints.
    tags: [intermediate, simulation]
    meta:
      family: residual
    columns:
      - name: stint_id
        description: Surrogate key combining race_year, race_id, driver_id, stint_number (grain).
        tests: [not_null]
      - name: drift_s_per_lap
        description: >
          OLS slope of driver_skill_residual_s vs lap_in_stint over pre-cliff laps (seconds per
          lap). Negative = residual trending faster through the stint. 0.0 when the stint has
          fewer than 3 pre-cliff laps.
        tests: [not_null]
