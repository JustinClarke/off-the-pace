version: 2

models:
  - name: int_stint_geometry
    description: >
      Foundation for all downstream window functions. One row per race lap
      (the FULL chronological sequence, including SC/VSC/pit/invalid laps)
      so physics-layer LAG/EWMA windows decay correctly across those gaps
      instead of treating the lap before/after a gap as adjacent. Builds
      stint identifiers (stint_id), lap positions within stints
      (lap_in_stint = chronological ordinal, valid_lap_in_stint = ordinal
      among valid laps only, age_in_stint = tyre_life), and compound
      tracking. Consumers that fit pace/regression models filter to
      is_valid_lap (or key off valid_lap_in_stint) at their own input
      boundary. All Layer 03 window functions partition on stint_id.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: stint_id
        description: Surrogate key combining race_year, race_id, driver_id, stint_number
        tests: [not_null]
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: lap_in_stint
        description: Chronological ordinal within the stint (1, 2, 3, ...), counting every lap including SC/VSC/pit/invalid ones.
        tests: [not_null]
      - name: valid_lap_in_stint
        description: Ordinal among valid laps only within the stint (NULL on invalid laps). Use for pace-fitting position/length logic instead of lap_in_stint.
      - name: stint_length_actual
        description: Total lap count in the stint (valid + invalid).
        tests: [not_null]
      - name: stint_length_valid
        description: Count of valid laps in the stint.
      - name: is_valid_lap
        description: Carried through from stg_laps. Timed, on-track, not deleted, accurate, not lap 1, no SC/VSC.
        tests: [not_null]
      - name: is_pit_lap
        description: Carried through from stg_laps. TRUE for the out-lap/in-lap of a pit stop.
        tests: [not_null]
      - name: is_safety_car_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 4 (full SC).
        tests: [not_null]
      - name: is_vsc_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 6 or 7 (VSC).
        tests: [not_null]
      - name: is_red_flag_lap
        description: Carried through from stg_laps. TRUE when the TrackStatus string contains a 5 (red flag).
        tests: [not_null]
      - name: stint_source
        description: >
          Where stint_number came from (stg_lap_tyre_qa): 'bronze', 'bronze_lap1_repaired'
          (the F25 lap-1 gap filled, TyreLife offset) or 'pit_record' (quarantined, F24).
      - name: tyre_qa_status
        description: >
          Bronze tyre-feed verdict from the pit-record cross-check (stg_lap_tyre_qa): 'ok',
          'quarantined_race' or 'quarantined_driver'. Quarantined laps carry the pit record's
          stint ordinal and NULL compound_in_stint / age_in_stint.
        tests: [not_null]
      - name: age_in_stint
        description: >
          Tyre age in laps at this lap: FastF1 TyreLife after stg_lap_tyre_qa (WI-05). Two
          changes from raw bronze. F25: where bronze left a driver's first one or two laps
          with no stint (17 of 21 2018 races), those laps join the first stint and its
          TyreLife -- counted by bronze from the first assigned lap -- is offset by the laps
          filled. F24: in a quarantined race or driver-race (tyre_qa_status <> 'ok') bronze's
          tyre data contradicts the pit record, so age is NULL there rather than served, and
          the row leaves training (is_training_eligible needs age_in_stint > 3). Otherwise
          NULL only where bronze has no reading; do not assume a NULL-age tyre is fresh (a
          used/scrubbed set starting a stint will have age_in_stint > 1 or NULL, but never
          0). Consumers should carry this column forward or declare how NULLs are handled.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
                row_condition: "age_in_stint is not null"
      - name: compound_code
        description: >
          Tyre compound code (C1-C5) nominated by Pirelli for this race. The ABSOLUTE
          identifier, unlike compound_in_stint which is relative - Pirelli picks 3 of 5
          physical compounds per weekend and calls them hard/medium/soft, so "SOFT" at one
          circuit is not the same rubber as "SOFT" at another. Enables cross-circuit
          compound comparison and physical-parameter lookup in dim_compounds_season.

          JOIN PATH (08p, corrected 2026-09-22): stg_tyre_allocations on
          (race_year, race_to_track.track_id, LOWER(compound)). NOT on this model's own
          upstream `circuit_key` - stg_laps.circuit_key is CAST(race_id AS VARCHAR), a RACE
          key like '2024_24', while stg_tyre_allocations.circuit_key is a circuit slug like
          'abu_dhabi_grand_prix'. The domains are disjoint; joining them directly matches
          zero rows and fails silently. That is exactly the bug 08p found and fixed, and the
          reason the resolution goes through the race_to_track seed as the mart's does.

          NULL RULES, both by construction, neither a sourcing gap:
          (1) ALL of 2018 is NULL. Pirelli's relative hard/medium/soft naming begins in 2019
          and 08d's seed covers 2019-2024 only; 2018's HYPERSOFT/SUPERSOFT/ULTRASOFT are
          dim_compounds_season's own compound_code, out of scope here. Pinned by
          tests/assert_stint_geometry_2018_compound_code_null.sql. This is a SEASON-SHAPED
          missingness pattern - the same shape 02b measured as NOT label-neutral - so a
          consumer must DECLARE its handling rather than COALESCE it away.
          (2) INTERMEDIATE and WET laps are NULL in every season (7,750 + 489 rows
          2019-2024). Cinturato wets are not on the C1-C5 slick scale at all.
          Every slick (HARD/MEDIUM/SOFT) lap in 2019-2024 resolves: 132,113 of 132,113,
          100.000%. Per-season all-lap coverage runs 91.67%-96.84%; the shortfall is
          wet-weather rows only. Do not quote the all-lap figure where the slick figure is
          meant - they are different populations.

          PROVENANCE - READ BEFORE QUOTING. The underlying seed is USER-ATTESTED
          (2026-09-17, full correctness of the 128-row mapping across 2019-2024), NOT
          archivally sourced: only 47 of 128 source_url values resolve, the other 81 are 404
          against a press site that no longer serves its pre-2025 archive. 08p's ruling
          (2026-09-22) admits the table into this lineage as a declared-`assumed` input,
          MART-ONLY, on the 2026-09-10 decision's own terms - it bars QUOTATION, not USE.
          This column is deliberately NOT in FEATURE_COLUMNS. Nothing published may rest on
          it until 08d's archival re-source lands. See
          _improvements/work/08-foundations-repair.md (08d, 08p).
      - name: race_year
        description: Season year.
      - name: race_id
        description: Race identifier.
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).

  - name: int_stint_end_regime
    description: >
      Why did this stint end? One row per stint. The stint-life survival target
      treats every uncensored stint as a completed tyre life, but 28.8% of them
      end under a safety car, VSC or red flag - the moment the pit wall was
      handed a free stop, not the moment the tyre ran out. This model names the
      cause so a consumer can separate the tyre-limit process from the
      interruption process instead of fitting their mixture. It also owns
      is_censored_stint, which fct_stint_features reads from here, so "the
      driver's last stint of the race" has one definition. Precedence is
      declared in the model header: censoring outranks regime, and within an
      uncensored stint red_flag > safety_car > vsc > green.
    tags: [intermediate]
    meta:
      family: strategy
    columns:
      - name: stint_id
        description: PK from int_stint_geometry. One row per stint.
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Race identifier (numeric FastF1 event id cast to string).
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        tests: [not_null]
      - name: stint_number
        description: >
          Stint ordinal within the driver's race. NULL for stints built from laps
          FastF1 never assigned to a stint -- two since WI-05 filled the 2018 lap-1
          gap (2018_2 RIC, 2018_10 HAR; 325 before); those carry stint_end_cause NULL
          and end_cause_confidence 'unassigned_stint'.
      - name: end_lap_id
        description: Foreign key to stg_laps - the lap the stint ended on, chronologically. For an uncensored stint this is the in-lap.
        tests: [not_null]
      - name: end_lap_number
        description: Race lap number of the stint's final lap.
        tests: [not_null]
      - name: end_lap_in_stint
        description: Chronological ordinal of the stint's final lap within the stint (equals stint_length_actual).
        tests: [not_null]
      - name: is_censored_stint
        description: >
          TRUE when this is the driver's last stint of the race, so it ended at
          the flag or at retirement rather than at a tyre change. Remaining
          stint life on these laps is a lower bound, not an observation.
          Consumed by the stint-life survival model (ml/src/features.py) to set
          the AFT upper bound to +inf, and by the blind-test scoreboard to
          report censored and uncensored stints apart. Never a model feature.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: end_regime
        description: >
          Track regime in force on the stint's final lap, for every stint
          including censored ones. Severity precedence red_flag > safety_car >
          vsc > green, because one TrackStatus string can carry several codes
          at once. Crossed with is_censored_stint this reproduces the measured
          end-regime decomposition.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [green, safety_car, vsc, red_flag]
      - name: is_multi_regime_end
        description: TRUE when the final lap carried more than one of red/SC/VSC, so severity precedence had to choose which one names the ending.
        tests: [not_null]
      - name: ended_on_pit_lap
        description: TRUE when the stint's final lap carries a pit marker. FALSE on an uncensored stint means the tyre change is known from the existence of a later stint but is not visible on the lap itself.
        tests: [not_null]
      - name: was_running_at_flag
        description: >
          TRUE when the driver's classified status says the car was still
          circulating at the chequered flag ('Finished', '+N Lap(s)',
          'Lapped'). Disqualification is resolved on distance instead, because
          it is a post-race ruling rather than a reason a stint ended. Only
          meaningful on a censored stint.
        tests: [not_null]
      - name: stint_end_cause
        description: >
          Six-class answer to "why did this stint end": green_pit, sc_pit,
          vsc_pit, red for the four uncensored causes, race_end and retirement
          for the two censored ones. NULL where stint_number is NULL - the row
          is an artefact of unassigned laps, not a stint that ended.
        tests:
          - not_null:
              config:
                where: "stint_number IS NOT NULL"
          - accepted_values:
              arguments:
                values: [green_pit, sc_pit, vsc_pit, red, race_end, retirement]
      - name: end_cause_confidence
        description: >
          How confidently the cause is known. 'observed' where every input was
          read; 'inferred' where severity precedence had to choose, where the
          pit marker is missing on an uncensored stint, or where
          disqualification hides whether the driver was running;
          'unassigned_stint' where the row is not a stint.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [observed, inferred, unassigned_stint]

  - name: int_lap_fuel_state
    description: >
      Fuel burnoff and weight correction. One row per valid lap.
      Calculates fuel_mass_kg based on consumption rate and weight_corrected_lap_time
      by applying weight penalty from fuel load. WI-05 (F6, F32, F52): the load is priced
      from the race's SCHEDULED distance (race_scheduled_laps seed) at the season's FIA
      race-fuel limit (105 kg 2018, 110 kg from 2019), burned evenly over the scheduled
      laps. It no longer aggregates over the race's own laps, so the aggregation-scope
      exemption this model used to carry (MAX(lap_number) over valid laps as a proxy for the
      scheduled distance) is gone with the aggregation.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: race_lap_count
        description: The race's scheduled distance in laps (race_scheduled_laps.scheduled_laps), a pre-race known.
        tests: [not_null]
      - name: initial_fuel_kg
        description: Starting race fuel = the season's FIA limit (macro fuel_regulatory_max_kg).
        tests: [not_null]
      - name: fuel_consumption_rate_kg_per_lap
        description: initial_fuel_kg / race_lap_count -- the limit burned evenly over the scheduled distance.
        tests: [not_null]

  - name: int_lap_air_state
    description: >
      Air state classification and thermal load from dirty air. One row per stint-lap.
      Classifies air state per sector (free_air, tow_zone, drs_train, dirty_air) and accumulates
      cumulative thermal load on tyre surface and bulk using exponential moving average.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: time_in_dirty_air_s
        description: >
          Real per-lap dirty-air exposure time (seconds), summed from actual
          ~10Hz telemetry sample durations where gap-to-car-ahead < 1.5s.
          Zeroed on SC/VSC laps (no real aero load at safety-car speeds).
          Null-gap samples (~5%, car ahead unavailable) are treated as free
          air, matching dirty_air_share_lap's existing convention.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                # Generous upper bound: red-flag/standing-start stoppages (e.g.
                # 2020 Austrian GP) hold the field bunched at <1.5s gaps for
                # real wall-clock minutes, well past a normal green-flag lap.
                max_value: 900

  - name: int_lap_proximity
    description: >
      Phase 10a. True pairwise track gaps from the POSITION channel, reduced to
      per-lap scalars. One row per race lap, on the same spine as
      int_lap_air_state (162,729 rows, verified equal 2026-09-05).

      This is the first feature family in the project built from a different
      sensor rather than from a further transform of the car channel or of lap
      times. Every incumbent traffic signal descends from FastF1's
      DistanceToDriverAhead, which int_lap_air_state divides by point speed to
      get a gap in seconds - a conversion that assumes the car ahead is
      travelling at the same speed as the car behind, which is exactly false in
      the situation the feature exists to describe. This model measures the
      time directly: each lap is cut into 100 fractions of relative_distance,
      the session clock at which each driver first enters each fraction is a
      crossing time of a fixed point on track, and the gap is the difference
      between two crossings of the same point. It needs no speed assumption and
      it is correct for lapped traffic.

      Validated against the FIA's own blue flags, which are not derived from
      telemetry - see assert_proximity_agrees_with_blue_flags.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: proximity_bin_count
        description: >
          How many of the 100 track bins this driver-lap produced a crossing
          for. Mean 99.8. NULL on the 1.22% of laps with no position telemetry
          (1,982 of 162,729) - left NULL rather than zeroed so "no data" stays
          distinguishable from "no traffic".
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      - name: gap_ahead_min_s
        description: >
          Closest the car ahead on track came, this lap (seconds). NULL when no
          other car crossed any of this lap's bins between this driver's own
          consecutive crossings, i.e. a full lap of clear air. Median 0.92 s.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                # A gap larger than this is a full lap of clear air at any
                # circuit on the calendar; the self-match guard in the model
                # should have nulled it instead.
                max_value: 300
                row_condition: "gap_ahead_min_s is not null"
      - name: share_lap_within_1s
        description: >
          Share of the lap's track bins with a car within 1 s ahead. Mean
          0.2011. Zeroed on SC/VSC/red-flag laps for the same reason
          int_lap_air_state zeroes its dirty-air terms - the field bunches at
          a pace that generates no aero load.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_lap_in_train
        description: >
          Share of the lap in a train rather than a single tow: this car within
          1 s of the car ahead AND that car within 1 s of the car ahead of it.
          Mean 0.0800. Must never exceed share_lap_within_1s, which is its own
          first conjunct - asserted by assert_proximity_train_subset_of_within1s.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: ahead_identity_stability
        description: >
          Of the lap's bins that had a car within 3 s ahead, the share held by
          the single most frequent car. 1.0 = one car held the whole lap (a
          settled follow); low = the car ahead rotated (traffic being passed, or
          being lapped). Mean 0.9271. 31.0% NULL overall, stable at 28.6–32.2% per
          season. NULL semantics: only 1,449 of 36,044 nulls represent "no car ahead"
          (free air). The remaining 34,595 nulls mean the statistic is UNDEFINED — the
          proximity calculation cannot settle on a single car ahead, which happens on
          disrupted/bunched laps (SC/VSC/red flag). Do not treat NULL as zero or as
          "free air". A later consumer must condition on this distinction.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "ahead_identity_stability is not null"
      - name: ff_ahead_identity_agreement
        description: >
          Diagnostic, never a feature. Share of the lap's bins where FastF1's
          own DriverAhead names the same car this model derives. 0.8704 across
          all seasons. Kept at lap grain so the incumbent and the new measure
          can be compared rather than one asserted better (Phase 10a: "run the
          ablation against both"). Where they disagree, FastF1's own
          DistanceToDriverAhead is roughly twice as large, i.e. it is naming a
          car further away than the one actually ahead on track.

  - name: int_lap_normalized_pace
    description: >
      Phase C: lap pace with the dirty-air cost removed, so laps run in traffic
      stay usable for wear/cliff fitting instead of being discarded.
      normalized_pace_s = lap_time_s - theta_time * time_in_dirty_air_s, with
      theta_time calibrated on clean, dry, valid laps and applied to the full
      lap sequence. Neither a tow term nor a fixed in-traffic step is applied;
      both were measured against the phase's acceptance metric and made it
      worse (see the model header for the numbers). One row per lap carried by
      int_lap_air_state. Deliberately a graph leaf, consumed only by the
      offline cliff solver: feeding normalized pace into the ratings/residual
      chain would double-count the dirty-air component already modelled in
      int_lap_residual_decomposed.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: normalized_pace_s
        description: >
          Lap time net of the dirty-air penalty. Null only where lap_time_s
          itself is null (untimed lap); the solver filters those out rather
          than having a pace fabricated for them.
        tests:
          # Two bounds rather than one. Normalization must never produce a
          # negative pace on any lap, but no useful upper bound holds across
          # all laps: red-flag stoppages are recorded as single enormous laps
          # (2024 Monaco lap 1 is ~2500s for all 16 running cars), which are
          # real events, not data faults. The tight bound is therefore scoped
          # to the laps the solver actually fits.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                row_condition: "normalized_pace_s is not null"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                # Solver ceiling (200s) plus headroom for the tow add-back.
                max_value: 210
                row_condition: "normalized_pace_s is not null and lap_time_s < 200"
      - name: dirty_air_penalty_s
        description: >
          theta_time * time_in_dirty_air_s, bounded [0, 5.0] (same clamp as
          int_dirty_air_tax_component's dirty_air_tax_s). Zero on clean-air
          laps by construction.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0

  - name: int_lap_thermal_proxy
    description: >
      Cumulative push load from tyre thermal management. One row per lap.
      push_residual is the lap's pace against a POINT-IN-TIME stint baseline -- the
      expanding median of this stint's valid laps strictly before the scored lap
      (macro: trailing_median) -- and the two EW loads are backward sums over it.
      Rebuilt by 08e: the baseline was a MEDIAN over laps 1..CEIL(stint_length*0.60)
      per stint, which both pooled laps the scored lap had not yet run (55.92% of
      mart rows, mean 4.65 laps) and took its window width from stint_length_actual,
      the stint-life target's own numerator. That contamination did not merely add
      noise -- it inverted push_residual's sign against two of the three targets.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: stint_baseline_pace
        description: >
          Median lap_time_s over this stint's VALID laps strictly before this one.
          Expanding, not trailing-N: a stint is short enough that the window stays
          local, and capping it would let the baseline drift with the degradation it
          measures. NULL until one valid prior lap exists (min_observations=1) --
          usually laps 1-2, since lap 1 of a stint is an out-lap and not valid.
          Costs 1.41pp of training-eligible coverage against the old block median.
          The floor is 1 by measurement, not by default: a 2026-09-10 session
          silently raised it to 2, and 08i (RESULT 2026-09-18) gated all four
          priced floors {1,2,3,5} on the v12/08m substrate and reverted to 1.
          Floors 3 and 5 are rejected -- dominated on coverage AND signal. On the
          v12 training-eligible panel floor 1 leaves 2,156/119,822 rows (1.80%)
          thermal-NaN, +2.15pp of coverage against floor 2, and cuts the blind
          rate on the hardest cliff class (0_to_2) from 12.13% to 10.48%.
          LANDED in the v13 bundle (D10, 2026-09-21) and re-measured on the built
          v13 panel 2026-09-22: 2,152/119,775 rows (1.80%) thermal-NaN, +2.13pp
          against the floor-2 counterfactual on the same panel, and the 0_to_2
          blind rate 12.61% -> 11.13%. The levels differ from the v12 figures
          above because 08q moved the label inside the same bump; the gain does
          not.
      - name: baseline_observations_n
        description: >
          How many valid prior laps stint_baseline_pace was computed from. Ships as a
          feature-contract column precisely because the baseline's NULLs are
          deterministic on it and on nothing else the contract carries: unlike 02a's
          rebuild, whose NULLs were declarable from age_in_stint, this count rises
          with SC and pit disruption and is plausibly correlated with the outcome. A
          consumer conditions on it; it must not be imputed away.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: push_residual
        description: >
          stint_baseline_pace - lap_time_s. Positive = faster than the stint's own
          prior pace = pushing. NULL wherever the baseline is NULL: unknown, not zero.
      - name: cumulative_push_load_surface
        description: >
          EW sum of positive push_residual, tau~3 laps, 5-lap lookback. A NULL
          residual on a PRIOR lap contributes 0 (the same convention as laps before
          the stint began); a NULL residual on THIS lap makes the load NULL rather
          than 0, since GREATEST(NULL, 0) = 0 in DuckDB would fabricate "no thermal
          load" for a lap whose load is simply unknown.
      - name: cumulative_push_load_bulk
        description: >
          EW sum of positive push_residual, tau~5 laps, 8-lap lookback. Same NULL
          rule as cumulative_push_load_surface.

  - name: int_track_geometry
    description: >
      Circuit geometry (gradient + curvature) from raw X/Y/Z telemetry, binned
      to 25m distance intervals. Grain is (race_year, track_id, distance_bin) --
      per-season, not collapsed to a single per-circuit shape, since GPS
      origin/heading can drift between seasons (verified at Bahrain: 2019
      diverges from 2020-2024). Start/finish bin has NULL gradient/curvature
      (no wraparound across the lap boundary).
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: race_year
        description: Season
        tests: [not_null]
      - name: track_id
        description: Circuit identifier (from race_to_track)
        tests: [not_null]
      - name: distance_bin
        description: Lower edge of the 25m distance bin (meters from start line)
        tests: [not_null]
      - name: gradient_dz_ds
        description: Elevation gradient dZ/ds between the previous and next bin
      - name: curvature_per_m
        description: >
          Menger curvature (1/m) from 3 consecutive binned points. NULL at
          season boundaries or where points are collinear.
      - name: lateral_accel_proxy_ms2
        description: v^2 * curvature_per_m, using median speed at the bin (m/s^2)

  - name: int_corner_metrics
    description: >
      Per-corner telemetry metrics. Grain is (race_year, race_id, driver_id, lap_number,
      corner_name)   one row per corner the driver's telemetry reaches on that lap. Windows come
      from dim_corners, keyed per race, so each session is measured against its own corner
      geometry. Feeds int_corner_skill_residuals and fct_telemetry_deltas.
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: driver_id
        description: FastF1 three-letter driver code.
        tests: [not_null]
      - name: lap_number
        description: Lap number within the race.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id.
        tests: [not_null]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: corner_name
        description: Turn label from dim_corners (Turn_7, Turn_7A).
        tests: [not_null]
      - name: track_id
        description: Event slug the corner belongs to, carried from dim_corners as a label.
        tests: [not_null]
      - name: braking_point_m
        description: >
          Distance of the first sample on the brakes inside the corner window. NULL where the
          corner is taken flat   a real answer for a fast corner, not missing data.
      - name: v_min_kph
        description: Minimum speed recorded inside the corner window (the apex speed).
        tests: [not_null]
      - name: throttle_point_m
        description: >
          Distance of the first full-throttle sample at or after the apex: where the driver gets
          back on power. NULL where the driver never reaches 100% throttle before the window ends
          at the next apex.

  - name: int_lap_telemetry_aggregates
    description: >
      Per-lap telemetry features for the tyre-cliff model. One row per race lap.
      Powertrain aggregates (gear changes, rpm, full-throttle/DRS share, short-shift index) plus
      five within-stint-drift cliff signals (mid-corner speed loss, wheelspin proxy, throttle-trace
      decay, braking-point drift, lift-and-coast share), each measured vs the driver's own
      early-stint baseline. Computed lap-internally from the 'car' telemetry channel; NULL where a
      lap has no telemetry (explicit missingness, carried as XGBoost native-NaN).
    tags: [intermediate]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: stint_id
        description: Stint surrogate key (baseline partition)
        tests: [not_null]
      - name: pct_full_throttle
        description: Fraction of the lap at full throttle (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "pct_full_throttle is not null"
      - name: pct_drs_active
        description: Fraction of the lap with DRS active (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "pct_drs_active is not null"
      - name: traction_wheelspin_proxy
        description: Share of corner-exit full-throttle samples with non-positive accel (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "traction_wheelspin_proxy is not null"
      - name: lift_coast_share
        description: Off-throttle, non-braking, decelerating share of the lap (0–1)
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
              config:
                where: "lift_coast_share is not null"

  - name: int_compound_cliff_predicted
    description: >
      Tyre compound degradation prediction using fitted survival-analysis parameters.
      One row per lap. Predicts degradation rate and cliff onset based on fitted compound parameters
      and current thermal conditions.
    tags: [intermediate]
    meta:
      family: pace-baselines
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: compound_wear_s
        description: >
          The age-dependent portion of the hockey-stick curve, bounded at
          var('compound_wear_max_s_per_lap'). Exposed as its own column so the
          bound is assertable directly -- see assert_compound_wear_bounded.sql.
          expected_compound_pace_s is this plus grip_peak plus the temperature
          offset, so the pace total legitimately exceeds the bound while this
          column may not.

          As of 08m (2026-09-16) the formula is
          wear_gradient*age + cliff_ramp, where cliff_ramp is the
          de-double-counted, moment-matched saturating post-onset term defined
          once in macros/compound_cliff_wear.sql. It was previously
          wear_gradient*age + 0.002*age^2 + severity*laps_past_cliff. Both of
          the removed terms were unfounded: compound_cliff_severity is FITTED as
          a level shift in seconds over a ~5.5-lap window and was being charged
          once per lap (laps_past_cliff reaches 48), and the 0.002 quadratic was
          a literal constant identical across all 438 seed cells that was never
          fitted against anything. 08l measured them at 60.4% and 18.9% of the
          seed's contribution to the ML target respectively.
        tests: [not_null]
      - name: compound_wear_gradient
        description: >
          The fitted linear wear slope (s/lap) for this lap's
          circuit x compound x season cell, passed through from
          dim_compounds_season. Exposed by 08m alongside compound_cliff_severity
          because any consumer needing a post-onset RATE needs both: severity is
          a level shift, and de-double-counting it against this gradient is what
          turns it into a rate. Use the cliff_ramp_slope_s_per_lap() macro.
        tests: [not_null]
      - name: expected_compound_pace_s
        description: >
          Expected pace loss vs compound baseline, in seconds. Bounded as of
          Phase 8 (2026-08-25): the wear portion is capped, having previously
          reached 93.5 s/lap on laps that were actually run. This column is
          subtracted into driver_skill_residual_s, so the unbounded tail was
          depressing the residual on 12,575 post-onset laps and, through it,
          corrupting both ML targets -- it hid 6,825 cliff-label crossings
          (99.5% of them into 'none_in_stint') and moved the degradation
          target on 9.05% of rows.

          08m (2026-09-16) changed what this column MEANS, not just its
          precision: the severity and quadratic terms it carried were removed
          (see compound_wear_s). Any number in the tree measured against
          next_5_lap_cumulative_jump_s before that date is on the old quantity
          and is not comparable to one measured after it.
        tests: [not_null]

  - name: int_field_pace_curve
    description: >
      Field-level baseline pace curve. Grain is (race_year, race_id, lap_number).
      Computes rolling median of free-air pace for each lap to establish a clean baseline
      uncontaminated by individual driver skill or traffic.
    tags: [intermediate]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            race_fastest supplies the 107% eligibility threshold for the field pace
            curve. The curve itself groups (race_year, race_id, lap_number) and pins
            a lap; only the threshold is race-scoped. Accepted with the spine, and
            recorded as its narrowest instance -- a pre-race reference time, e.g.
            pole or a circuit benchmark, would remove it entirely.
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_track_evolution
    description: >
      Track temperature and grip evolution over race. Grain is (race_year, race_id, lap_number).
      Tracks ambient and track surface temperature, and grip envelope changes over the race
      due to rubber lay-down and fuel load shedding.
    tags: [intermediate]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            Race-level track-evolution baselines: the reference lap and reference
            pace that a race's rubber and ambient components are measured against.
            Race-scoped with the rest of the decomposition spine.
        - keys: [race_year, race_id, mean_lap, mean_pace]
          status: accepted
          reason: >
            The same race-level baseline carried through a join and grouped on the
            aggregate values to re-key, not to aggregate further. Accepted with the
            baseline it carries.
        - keys: [race_year, race_id, mean_track_temp]
          status: accepted
          reason: >
            As above, for the track-temperature baseline behind ambient_component_s.
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_synthetic_teammate
    description: >
      Synthetic teammate for driver skill extraction. Grain is (race_year, race_id, ego_driver_id, lap_number).
      Uses closest-match teammate with same car to create a counterfactual for what the driver would have done
      in the same equipment if conditions matched.
    tags: [intermediate]
    meta:
      family: skill
    columns:
      - name: race_year
        description: Race year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: ego_driver_id
        description: The driver for whom we synthesize a teammate
        tests: [not_null]
      - name: lap_number
        description: Lap number within race
        tests: [not_null]

  - name: int_event_corrections
    description: >
      Safety car, red flag, and other race event corrections. One row per lap with event flags
      indicating whether the lap should be treated as anomalous for skill extraction (e.g., SC restart, red flag laps).
    tags: [intermediate]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            race_fastest is MIN(lap_time_s) over the race, the reference for the
            outlier and correction classification. A race's fastest lap is not known
            until the race has run, so this is race-scoped in the same sense as the
            rest of the decomposition spine, and accepted on the same grounds and at
            the same price.
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_lap_residual_decomposed
    description: >
      One row per lap. 7-term decomposition: splits lap time into fuel penalty, compound degradation,
      track rubber evolution, ambient weather, constructor car pace, dirty-air tax, and driver skill residual.
      Identity: pace_delta_s = fuel_component_s + compound_component_s + rubber_component_s + ambient_component_s
      + constructor_component_s + dirty_air_tax_s + driver_skill_residual_s.
      Driver skill residual = what remains after removing all physics/car/strategy factors.
    tags: [intermediate, causal_decomposition]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]
      - name: valid_lap_in_stint
        description: Passed through from int_stint_geometry. Ordinal among valid laps only within the stint; consumers should key position/length logic off this, not lap_in_stint.
      - name: stint_length_valid
        description: Passed through from int_stint_geometry. Count of valid laps in the stint.
      - name: constructor_component_s
        description: >
          Constructor structural pace in seconds from int_constructor_structural_pace.
          Positive = slower than field.
        tests: [not_null]
      - name: dirty_air_tax_s
        description: >
          Per-lap dirty-air slowdown cost from int_dirty_air_tax_component.
          Non-negative seconds. Zero when not in dirty air.
          Subtracted into driver_skill_residual_s, so θ_air sits inside the ML label: this column
          feeds DEGRADATION_TARGET and CLIFF_TARGET. 08q (2026-09-21) moved θ_air from an unfitted
          0.5 literal to the fitted +0.1310 s/lap, which changes this component on the ~23% of panel
          laps that are dirty-air laps and requires a target rebuild plus a model version bump.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0
      - name: driver_skill_residual_s
        description: >
          Residual after all 7 physics components. Cleaned of dirty-air signal vs pre-causal-decomposition.
          Positive = slower than field baseline after all adjustments.
        tests: [not_null]
      - name: total_explained_s
        description: Sum of all 7 components (fuel + compound + rubber + ambient + constructor + dirty_air_tax)
        tests: [not_null]

  - name: int_lap_anomaly_flags
    description: >
      Anomaly detection flags for data quality control. One row per lap.
      Uses trailing-7-lap MAD (median absolute deviation) to classify anomalies robustly
      (cliff, mistakes, event-driven, conditions, normal).
    tags: [intermediate]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [race_year, race_id, driver_id]
          status: accepted
          reason: >
            residual_stats computes a per-driver-per-race mean and standard deviation
            of driver_skill_residual_s. Diagnostic only, and verified so: the model's
            own comment says the global z-score is "traceability only; not used for
            anomaly_class", and it is not. cliff_candidate_flag is (mad_score > 3.0
            AND cliff_onset_passed AND driver_skill_residual_s > trailing_median_s),
            and both mad_score inputs come from the trailing window (w.lap_number
            BETWEEN r.lap_number - 6 AND r.lap_number), which is backward-only. The
            mart reads lap_id, anomaly_class, cliff_candidate_flag and is_rain_lap
            from this model, and none of the z-score columns.
    columns:
      - name: lap_id
        description: Foreign key to stg_laps
        tests: [not_null, unique]

  - name: int_constructor_car_fe
    description: >
      De-biased constructor car pace (constructor×race fixed effect), one row per
      (race_year, race_id, constructor_id). A thin reader over
      data/fits/constructor_car_fe.parquet, fitted by
      tasks/coefficients/fit_constructor_car_fe.py via a two-way FE regression
      (pace_delta_s ~ 1 | driver_id + constructor_race) on the clean lap panel.
      car_fe_s estimates car pace net of driver skill (global driver anchor),
      so subtracting it removes the car without crediting a weak driver's slowness
      as skill. Consumed only by int_driver_race_skill_loro.driver_skill_field_s →
      int_driver_circuit_era_affinity (Ghost Car Standings). Negative = faster than field.
    tags: [intermediate, causal_decomposition, constructor]
    meta:
      family: skill
    columns:
      - name: constructor_car_fe_id
        description: Surrogate PK = race_year_raceid_constructorid
        tests: [not_null, unique]
      - name: race_year
        description: Season year
        tests: [not_null]
      - name: race_id
        description: Race identifier (matches int_lap_fuel_state.race_id, e.g. 2018_5)
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier (stg_laps.constructor_id)
        tests: [not_null]
      - name: car_fe_s
        description: >
          Constructor×race fixed effect in seconds, net of driver skill.
          Negative = faster than field.
        tests: [not_null]

  - name: int_constructor_structural_pace
    description: >
      One row per (race_year, race_id, constructor_id). Car-inherent pace advantage/penalty estimated
      from a re-centred median pace delta across same-constructor teammates in the same race, isolating
      car pace from driver skill via within-constructor, between-driver variation. A placeholder for
      the full panel regression (pyfixest HDFE fit) named in the model's own header; that fixed-effects
      estimate exists separately, as int_constructor_car_fe. Positive = slower car. Includes a normal-
      approximation 95% CI and clean pair sample counts for confidence.
    tags: [intermediate, causal_decomposition]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [race_year, race_id, constructor_id]
          status: accepted
          reason: >
            constructor_agg is the per-race constructor coefficient: the median pace
            delta over that constructor's laps in that race. Race-scoped by design --
            this warehouse decomposes a COMPLETED race into additive components, and
            a coefficient fitted on part of a race is a different quantity. It does
            not cross the season split. See "the race-scoped spine" in
            _improvements/work/08-foundations-repair.md: the price of this ruling is
            that nothing downstream of driver_skill_residual_s is point-in-time
            correct for live mid-race prediction.
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            race_mean re-centres those coefficients on the race average so they sum
            to zero, which is what makes them pace RELATIVE TO THE FIELD rather than
            absolute. Same race-scoped ruling as the coefficient it centres; centring
            on a subset of the race would not be a zero-sum decomposition.
    columns:
      - name: constructor_race_id
        description: Surrogate PK = hash(race_year, race_id, constructor_id)
        tests: [not_null, unique]
      - name: race_year
        description: Season year
        tests: [not_null]
      - name: race_id
        description: Race identifier
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier (FK to dim_constructors)
        tests: [not_null]
      - name: constructor_structural_pace_s
        description: >
          Re-centred median pace-delta coefficient in seconds (not yet a fitted fixed effect
          see the model description). Positive = slower than field. Identified via
          within-constructor, between-driver variation from teammate pairs.
        tests: [not_null]
      - name: constructor_structural_pace_se_s
        description: >
          Standard error of the median pace delta (stddev / √n), not yet a clustered (CRV1)
          regression SE. Positive, ≥0. Captures uncertainty in the coefficient estimate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.0
      - name: constructor_structural_pace_ci_low_s
        description: 95% confidence interval lower bound
        tests: [not_null]
      - name: constructor_structural_pace_ci_high_s
        description: 95% confidence interval upper bound
        tests: [not_null]
      - name: panel_observations_n
        description: Sample size of clean laps used in the aggregate estimate
        tests: [not_null]
      - name: clean_teammate_pair_laps_n
        description: >
          Count of clean laps where both teammates in a constructor ran (used to assess pair quality).
          Flags constructor-seasons where this is <100 laps.
        tests: [not_null]
      - name: r_squared_within
        description: >
          Within fixed-effect R² (sanity check; low is expected, high is good).
          NULL until the pyfixest model is in place   a misleading 0.0 is worse than NULL.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: fit_timestamp
        description: UTC timestamp when this coefficient was fitted (ISO 8601)
        tests: [not_null]
    tests:
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: constructor_structural_pace_ci_high_s
            column_B: constructor_structural_pace_ci_low_s
            or_equal: true

  - name: int_constructor_deg_sensitivity
    description: >
      One row per (race_year, constructor_id, compound). Constructor-specific tyre degradation
      sensitivity: within-stint fixed-effects slope of the post-decomposition residual on tyre age,
      field-centred per (compound, season) and empirical-Bayes shrunk toward 0 (DerSimonian-Laird).
      Positive = degrades faster than the field-average compound curve. Feeds the ghost-car
      recombination interaction term (host slope minus ego slope) x age_in_stint, which is what
      lets host identity reorder drivers. slope_se and n_laps are carried for downstream SE
      propagation.
      cliff_onset_shift_laps is a per-constructor break-point offset (laps) for the field
      tyre-cliff onset, estimated as a bivariate within-stint hinge coefficient (extra post-onset
      degradation), field-centred and EB-shrunk like the linear slope, then mapped to an onset
      shift via the field severity and typical post-onset depth. Positive = cliff arrives later
      (gentler). Feeds the ghost-car cliff interaction term.
    tags: [intermediate, causal_decomposition, degradation]
    meta:
      family: strategy
    columns:
      - name: deg_sensitivity_id
        description: Surrogate PK = race_year || constructor_id || compound
        tests: [not_null, unique]
      - name: race_year
        description: Season year (cells are season-scoped; no cross-season pooling)
        tests: [not_null]
      - name: constructor_id
        description: Constructor identifier
        tests: [not_null]
      - name: compound
        description: Dry tyre compound the slope is estimated for
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD']
      - name: deg_slope_s_per_lap
        description: >
          Production value: EB-shrunk deviation from the field-mean within-stint slope, in s/lap
          per lap of tyre age. Positive = degrades faster than field. 0.0 for low-sample cells.
          2024 reference range: ~±0.025 s/lap on HARD, ~±0.08 on SOFT.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -0.25
                max_value: 0.25
      - name: deg_slope_raw_s_per_lap
        description: >
          Uncentred within-stint FE slope (diagnostic). Uniformly negative (~ -0.08 s/lap in 2024)
          because a common residual fuel under-correction survives the decomposition; the common
          part cancels in field-centring and in the (host - ego) recombination difference.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -0.5
                max_value: 0.5
      - name: field_mean_slope_s_per_lap
        description: Precision-weighted mean raw slope per (race_year, compound); the centring constant.
      - name: deg_slope_se_s_per_lap
        description: >
          FE-regression standard error of the raw slope (dof = n_laps - n_stints - 1), floored at
          1e-4. NULL for low-sample cells. Carried for downstream SE propagation.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1.0
      - name: deg_slope_posterior_sd_s_per_lap
        description: >
          EB posterior sd of the shrunk slope; equals tau (prior sd) for low-sample cells and 0
          when tau^2 = 0 (no between-constructor signal).
        tests: [not_null]
      - name: shrink_factor
        description: tau^2 / (tau^2 + se^2) in [0,1]; 0 for low-sample cells.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: tau_s_per_lap
        description: DerSimonian-Laird between-constructor sd per (race_year, compound).
        tests: [not_null]
      - name: n_laps
        description: Clean dry pre-cliff laps in the cell (cell-count; qualifying rule >= 30).
        tests: [not_null]
      - name: n_stints
        description: Distinct stints in the cell (qualifying rule >= 5).
        tests: [not_null]
      - name: is_low_sample
        description: TRUE when the cell fails minimum-cell rules; slope forced to 0, excluded from pooling.
        tests: [not_null]
      - name: cliff_onset_shift_laps
        description: >
          Per-constructor tyre-cliff onset shift in laps relative to the
          field onset. Positive = cliff arrives LATER (gentler), negative = EARLIER (harsher).
          0.0 for cells without enough post-onset depth. Clipped to +/-3 laps.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -3.0
                max_value: 3.0
      - name: cliff_onset_shift_se_laps
        description: >
          SE of the onset shift (hinge SE mapped through ref_depth / severity). NULL for
          low-sample cells. Carried for downstream SE propagation.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 50.0
      - name: cliff_hinge_coef_s_per_lap
        description: >
          Diagnostic: raw bivariate within-stint hinge coefficient (extra s/lap of degradation
          after the field onset). Uniformly negative like the linear slope; common part cancels
          in field-centring.
      - name: cliff_hinge_field_mean_s_per_lap
        description: Precision-weighted mean hinge coefficient per (race_year, compound); the centring constant.
      - name: cliff_severity_used_s_per_lap
        description: Median field post-onset severity (s/lap) per (compound, season), floored at 0.30, used in the shift mapping.
      - name: cliff_ref_depth_laps
        description: Mean laps past the field onset over post-onset clean laps per (compound, season); the depth at which the hinge deviation is converted to an onset shift.
      - name: cliff_hinge_tau_s_per_lap
        description: DerSimonian-Laird between-constructor sd of the hinge coefficient per (race_year, compound).
      - name: n_post_cliff_laps
        description: Post-onset clean laps in the cell (qualifying rule >= 30).
        tests: [not_null]
      - name: n_deep_cliff_laps
        description: Post-onset laps at least 2 laps past onset (depth rule >= 15); guards against shallow-crossing noise.
        tests: [not_null]
      - name: n_stints_cliff
        description: Distinct stints contributing post-onset laps (qualifying rule >= 5).
        tests: [not_null]
      - name: is_low_sample_cliff
        description: TRUE when the cell fails cliff minimum-cell rules; cliff_onset_shift_laps forced to 0.
        tests: [not_null]
      - name: fit_timestamp
        description: UTC timestamp when the slopes were fitted (ISO 8601)
        tests: [not_null]

  - name: int_dirty_air_tax_component
    description: >
      One row per lap. Cost of driving in dirty air (turbulent wake) following another car.
      Uses prior-lap dirty-air intensity to establish causality: current lap slowdown → prior lap's position.
      Avoids reverse causality. Seconds lost = θ_air × dirty_air_intensity_lag1, capped [0, 5.0] seconds.
      θ_air IS FITTED FROM THE DATA, not configured: it is the OLS slope of partial residual on the
      lagged dirty-air bit over the full two-arm calibration panel (treated and untreated laps).
      Before 08q (2026-09-21) the panel was filtered to `dirty_air_share_lag1 > 0`, which left the
      binary regressor constant and unidentified, so θ_air silently fell through a COALESCE to the
      literal 0.5 s/lap on every build and dirty_air_tax_s was 0.5 on every dirty-air lap and 0.0
      otherwise. Measured on the v12 substrate the fitted value is +0.1310 s/lap
      [95% CI +0.1144, +0.1476] over 123,993 laps — the shipped 0.5 was 3.8x too high. The COALESCE
      literal is now that measured estimate and serves only as a degenerate-panel guard.
      A global pooled θ is used deliberately; per-season θ runs +0.418 (2018) to -0.011 (2024) and is
      not distinguishable from zero on 2021 and 2024, which is an open ruling for any fan-facing
      surface that reports per-driver seconds (see work/08-foundations-repair.md section 08q).
    tags: [intermediate, causal_decomposition]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: PK, FK to stg_laps
        tests: [not_null, unique]
      - name: dirty_air_intensity_lag1
        description: One-lap-lagged dirty-air intensity from int_lap_air_state
        tests: [not_null]
      - name: dirty_air_tax_s
        description: >
          Per-lap dirty-air slowdown in seconds. θ_air × dirty_air_intensity_lag1.
          Positive (slower cost). Bounded [0, 5.0].
          θ_air is estimated from the two-arm calibration panel, not defaulted (08q). Because
          dirty_air_intensity_lag1 is one bit per lap, this column still takes two values per build —
          0.0 on a clean-air lap and θ_air on a dirty-air lap — but θ_air is now the fitted
          +0.1310 s/lap rather than the unfitted 0.5 literal it was through v12. A dose-response on
          the measured gap (int_lap_air_state.min_gap_s / stg_telemetry_position.distance_to_ahead_m)
          is the standing follow-up; removing the treated-arm filter is the identification fix, not
          the measurement fix.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 5.0
      - name: dirty_air_tax_se_s
        description: Standard error of the tax estimate via propagation
        tests: [not_null]
      - name: tax_calibration_confidence
        description: >
          Confidence in the tax [0, 1], as n / (n + 500) over the calibration sample n.
          Since 08q restored both arms to that panel, n is the full 123,993-lap panel rather than
          the 28,523 treated laps it was through v12, so this reads ~0.996 rather than ~0.983.
          It measures calibration SAMPLE SIZE ONLY and is not a statement about whether θ_air is
          distinguishable from zero in a given season — it is near 1.0 on every season including
          2021 and 2024, where the per-season estimate straddles zero.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: cumulative_dirty_air_tax_race_s
        description: Running race-cumulative sum of per-lap dirty-air tax for each driver
        tests: [not_null]
      - name: dirtiest_air_lap_in_race_flag
        description: TRUE on the lap where this driver's per-lap tax is at its maximum in the race
        tests: [not_null]

  - name: int_sector_residual_decomposed
    description: >
      One row per lap per sector (3 rows/lap). Breaks down lap-level physics components
      (fuel, compound, rubber, ambient, constructor, dirty_air) to individual sectors
      proportional to sector time. Grain: (lap_id, sector). Allows per-sector skill analysis.
      Matches stg_sector_times granularity. Identity: sector_pace_delta = sector_components + sector_skill_residual.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: sector_id
        description: PK = lap_id || '_S' || sector. Matches stg_sector_times convention.
        tests: [not_null, unique]
      - name: lap_id
        description: FK to stg_laps
        tests: [not_null]
      - name: sector
        description: Sector number (1, 2, or 3)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: sector_time_s
        description: Raw sector time in seconds
        tests: [not_null]
      - name: sector_pace_delta_s
        description: sector_time_s minus rolling ±3 lap field sector median
        tests: [not_null]
      - name: sector_driver_skill_residual_s
        description: Closure residual after all 6 allocated components
        tests: [not_null]
      - name: sector_total_explained_s
        description: Sum of the 6 allocated components
        tests: [not_null]
      - name: dominant_component_class
        description: >
          Component with the largest absolute value among the 6 allocated components.
          Values: fuel, compound, rubber, ambient, constructor, dirty_air
        tests:
          - accepted_values:
              arguments:
                values: ['fuel', 'compound', 'rubber', 'ambient', 'constructor', 'dirty_air']

  - name: int_corner_skill_residuals
    description: >
      One row per lap per named corner. Decomposes corner skill into braking, mid-corner,
      and exit phases relative to field median (backward-only trailing-5 window, rebuilt 02g).
      Grain: (lap_id, corner_name). Null when field sample < 5 drivers. Enables high-res
      corner-by-corner skill profiling.

      WINDOW CHANGE (rebuilt 02g): field medians now use RANGE BETWEEN 5 PRECEDING AND 1 PRECEDING
      (trailing-5, all drivers at each lap level, excluding the focal lap). Previous construction
      used FLOOR(lap/5)*5 block buckets which reached forward 1.877 laps on average (38.45% of the
      median drawn from future, up to 76% at block position 0), placing future label signals in
      the baseline. Rebuild eliminated reach; contamination signal was weak (corr +0.0344 vs
      +0.0083 control, marginal; sd 0.116 vs 0.043 block, noise-shaped).

      COVERAGE: Lap-2 coverage loss (21.4pp on laps ≤ 6) is deterministic and non-leaking—lap 2
      has no predecessor, so trailing window returns NULL. This loss sits on lap_number (already
      in contract via age_in_stint) and is declarable, not a hazard. No expanding window rescue
      attempted: lap 1 never reaches any lap to base a median on. An expanding window would pool
      early and late race track states (2026-09-08, measured trailing-5 vs expanding, identical
      formula, identical coverage loss on lap 2 in both cases). Trailing-5 kept for consistency
      with its width replacing the old block.

      SIGN CONVENTION (00d, 2026-09-20): all three phases are POSITIVE = SECONDS LOST vs the
      field median, negative = seconds gained, and corner_residual_total_s is their straight sum
      and therefore a real "seconds lost at this corner". The direction of the underlying measure
      decides the subtraction: braking_point_m and v_min_kph are higher-is-faster so their
      residuals are (field - own); throttle_point_m is higher-is-slower (on power later) so its
      residual is (own - field). Before 00d, braking_loss_s alone was built as (own - field), so
      positive meant braking LATER = faster, while mart_corner_skill_driver summed all three
      z-scores into corner_skill_index and ordered ASC with no negation in between -- one of three
      terms entered a shipped public leaderboard inverted, and corner_residual_total_s summed a
      gain with two losses. Fixed at the source rather than negated in the mart (the ruling and the
      full consumer trace are in _improvements/work/00-corrections.md, 00d). The direction is now
      pinned against the raw geometry by transform/tests/assert_corner_skill_sign_convention.sql,
      which no sign-agnostic closure or count test could catch -- that is how the defect survived
      both the 02g and 02c rebuilds of this model.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: corner_id
        description: PK = lap_id || '_C_' || corner_name
        tests: [not_null, unique]
      - name: lap_id
        description: FK to stg_laps
        tests: [not_null]
      - name: corner_name
        description: Named corner from dim_corners
        tests: [not_null]
      - name: braking_loss_s
        description: >
          Seconds lost on corner entry vs the backward-only trailing-5 field median, as
          (field median - own braking_point_m) * dt_per_dm at the sector-2 trap speed.
          POSITIVE = braked EARLIER than the field = time LOST. Negative = braked later = time
          gained. NULL when field_corner_sample_n < 5 or the corner is taken flat (no
          braking_point_m), both real answers rather than missing data. The (field - own)
          orientation is the fix 00d made and matches the house convention already in the feature
          contract (int_lap_telemetry_aggregates' braking_point_drift_m is base - lap).
      - name: mid_corner_residual_s
        description: >
          Seconds lost at the apex vs the trailing-5 field median, as (field v_min - own v_min)
          converted at the field apex speed. POSITIVE = carried LESS speed than the field = time
          LOST. Highest-coverage of the three phases: every corner has an apex.
      - name: exit_residual_s
        description: >
          Seconds lost on exit vs the trailing-5 field median, as (own throttle_point_m - field
          median) * dt_per_dm. POSITIVE = regained full throttle LATER than the field = time LOST.
          Note the subtraction runs the other way round from the other two phases because
          throttle_point_m is higher-is-slower while braking_point_m and v_min_kph are
          higher-is-faster; all three still read positive = loss.
      - name: corner_residual_total_s
        description: >
          braking_loss_s + mid_corner_residual_s + exit_residual_s: total seconds lost at this
          corner vs the field median. Non-NULL only where all three phases are measurable (the
          intersection, 38.59% of corner rows), which is why int_lap_corner_inputs aggregates each
          phase over its own measurable corners instead of using this column. Only a meaningful
          total since 00d gave the three phases one sign convention -- before that it summed a gain
          with two losses, which is why 06b moved its headline off it. Closure pinned by
          transform/tests/assert_corner_closure.sql.
      - name: field_corner_sample_n
        description: >
          Number of field observations behind this corner/lap's median. Trailing-5 window
          (laps t-5 to t-1, RANGE frame): counts valid, non-NULL braking_point_m rows across
          ALL drivers in that lap interval.

          Reported UNFLOORED and never NULL, which is the trailing_observation_count
          contract: the count is what the >= 5 floor is applied to, so flooring it here
          would make "no prior lap at all" and "four prior laps" indistinguishable and
          leave the residual NULLs unexplainable. 0 on lap 2, which has no predecessor.
          The residuals themselves NULL out through trailing_median's own
          min_observations=5, and corner_unmapped_flag carries the gate.
        tests: [not_null]
      - name: corner_unmapped_flag
        description: TRUE when field_corner_sample_n < 5 (residuals are NULL)
        tests: [not_null]

  - name: int_lap_corner_inputs
    description: >
      02c (Tier 2). int_corner_skill_residuals aggregated from (lap × corner) grain to lap
      grain, so the corner channel can join a lap-grain feature matrix. One row per race lap
      that has at least one measured corner (134,948 laps).

      WHY IT EXISTS. The degradation target's variance is 99.06% within stint
      (between_stint_share = 0.0094). Every other candidate channel in item 02 -- qualifying
      (02b), safety-car hazard (02d) -- is constant inside a stint and can only address the
      other 0.94%. This is the only lap-varying candidate, so it is the only one that can
      reach the degradation trio at all.

      MECHANISM. Braking, rotation and throttle application are the direct physical inputs of
      energy into a tyre. The incumbent `thermal` group (push_residual,
      cumulative_push_load_*) INFERS push load from lap-time residuals; this MEASURES the
      inputs. That is a different construct even though it shares the telemetry sensor with
      `proximity`. Phase 9 dropped `powertrain` and `telemetry_cliff` -- the mart's whole
      consumption of int_lap_telemetry_aggregates -- and Phase 10a then cleared at 1.54x/2.17x
      re-reading the same ingestion through a different aggregation. The evidence says the
      aggregation failed, not the sensor, which is why this model's risk is concentrated in
      the aggregation design and stated there.

      AGGREGATION. mean / sd / max per phase. Mean is the lap's overall input level, max the
      single hardest corner, sd the one with a tyre-management story: a driver even across the
      lap loads the tyre differently from one spiking in two corners and coasting the rest, at
      equal mean. Each phase is aggregated over the corners where THAT phase is measurable,
      not over the intersection of all three -- corner-grain availability, re-measured on the
      shipped table 2026-09-11, is braking 69.94%, mid-corner 81.12%, exit 47.00% (18.88% of
      corner rows are unmapped outright at field_corner_sample_n < 5; among mapped rows the
      three run 86.21% / 100% / 57.94%), and corner_residual_total_s (exactly that
      intersection) is non-null on only 38.59% of corner rows. An earlier draft quoted
      mid-corner 97.6% and exit 60.9%; those do not reproduce and are corrected here.

      CORNER-TYPE SPLIT: CONSIDERED AND DECLINED, recorded so it is not re-derived. §3 of the
      leaf doc suggests splitting by corner type since a slow hairpin and a high-speed sweep
      load a tyre differently. Declined for the primary arm on two grounds. (1) The only
      within-warehouse classifier of corner speed is apex speed, and a per-(race, corner)
      speed class pooled over the race reaches forward into the label window -- the exact
      defect 02a ruled on in this same model. A point-in-time classifier would have to be
      trailing, which makes the corner's TYPE vary lap to lap, which is not what a corner-type
      split means. (2) dim_corners carries only geometry (apex distance, neighbour spacing),
      which is a weak proxy for how a corner loads a tyre. It stays available as a declared
      follow-on arm if the primary clears; it is not in the primary arm.

      POINT-IN-TIME. Every input is a residual against a backward-only trailing-5 field median
      (02g). The GROUP BY is keyed on lap_id, which pins one lap, so this model contributes no
      aggregation scope of its own -- the whole argument rests on int_corner_skill_residuals
      above.

      COVERAGE IS NOT NEUTRAL, and is emitted as a column rather than left as a NaN pattern.
      Measured on the mart's training-eligible rows, corner_braking_loss_mean_s is NULL on
      4.15%, and those rows average +1.393 s of 5-lap jump against -2.330 s for covered rows
      (sd 10.196 vs 5.938). The missingness carries label signal. It is not forward leakage --
      a lap is uncovered because its own telemetry is absent, or because the trailing baseline
      over t-5..t-1 held fewer than five valid observations, both settled strictly before t+1
      -- but a model handed bare NaNs could split on "corner inputs missing" and score a win
      that has nothing to do with driver inputs. corner_input_coverage is therefore admitted
      to the contract beside the residuals so the ablation can separate the two (arm C).
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps. One row per lap with at least one measured corner.
        tests: [not_null, unique]
      - name: corners_total_n
        description: Corners the telemetry placed on this lap (mean 16.35).
        tests: [not_null]
      - name: corners_mapped_n
        description: >
          Corners that cleared int_corner_skill_residuals' field_corner_sample_n >= 5 gate and
          so carry a residual (mean 13.27).
        tests: [not_null]
      - name: corner_input_coverage
        description: >
          corners_mapped_n / corners_total_n (mean 0.813). The contract column: the raw count
          conflates coverage with circuit corner count (Monaco 19 vs Monza 11), and circuit
          identity already enters the feature set three times over.
        tests: [not_null]
      - name: corner_braking_n
        description: Corners on this lap with a measured braking point. Companion column, not a feature.
        tests: [not_null]
      - name: corner_mid_n
        description: Corners on this lap with a measured apex speed. Companion column, not a feature.
        tests: [not_null]
      - name: corner_exit_n
        description: Corners on this lap with a measured full-throttle point. Companion column, not a feature.
        tests: [not_null]
      - name: corner_braking_loss_mean_s
        description: >
          Mean braking_loss_s across the lap's braking corners; positive = braked earlier than the
          field = time lost (mean +0.0065 s since 00d fixed the sign; it read -0.0065 s before).
          NULL, never 0.0, when unmeasured.
      - name: corner_braking_loss_sd_s
        description: >
          Sample sd of braking_loss_s across the lap's corners (mean 0.3289 s, unchanged by 00d's
          sign fix: a sample sd is invariant to negation). NULL on 2.57% of rows here -- laps with
          fewer than two measured braking corners, where a sample sd is undefined rather than zero.
      - name: corner_braking_loss_max_s
        description: >
          Largest braking_loss_s on the lap: the corner where the driver lost the most time on
          entry (mean +0.6475 s). NOT a sign flip of its pre-00d self -- MAX does not commute with
          negation, so this column changed from "the corner braked latest" to "the corner braked
          earliest relative to the field", which is what a column named max loss should mean.
          Pre-00d mean was +0.5459 s and corr(old, new) = 0.080 over 131,482 laps.
      - name: corner_mid_residual_mean_s
        description: Mean mid_corner_residual_s across the lap's corners (mean -0.0102 s). Highest-coverage phase.
      - name: corner_mid_residual_sd_s
        description: Sample sd of mid_corner_residual_s across the lap's corners (mean 0.1439 s; NULL on 2.39%).
      - name: corner_mid_residual_max_s
        description: Largest mid_corner_residual_s on the lap (mean 0.2543 s).
      - name: corner_exit_residual_mean_s
        description: Mean exit_residual_s across the lap's corners that reach full throttle (mean 0.0589 s). Sparsest phase.
      - name: corner_exit_residual_sd_s
        description: Sample sd of exit_residual_s across the lap's corners (mean 0.2115 s; NULL on 9.78%).
      - name: corner_exit_residual_max_s
        description: Largest exit_residual_s on the lap (mean 0.4367 s).

  - name: int_corner_drift_from_early_stint
    description: >
      Item 02h. int_corner_skill_residuals residualized a SECOND time: for each (stint_id,
      corner_name), the mean of the three phase residuals over the stint's own first 6 valid
      laps (valid_lap_in_stint 1-6) is taken as a BASELINE, and every later lap's residual minus
      that baseline is DRIFT. Grain: (lap_id, corner_name), same as int_corner_skill_residuals.

      WHY. 02c's residuals do not persist lap-to-lap (measured lag-1 within-stint
      autocorrelation 0.032-0.176) because (field trailing-5 median - own) is a relative-PACE
      construct, and the columns that survive ablation elsewhere in the contract all sit at
      .27-.42 (proximity .421, thermal's push_residual .343, dirty_air .266). A driver who is
      steadily 0.05s worse than the field all race has zero drift and is captured by pace
      already three times over; a driver who opens that gap from 0.05s to 0.35s across the
      stint has +0.30s of drift, which is the tyre-degradation signal a pace residual cannot
      distinguish from a driver who is simply slow-but-stable.

      LEAKAGE. The baseline window is FIXED at valid_lap_in_stint 1-6, not trailing relative to
      the query lap. Every row with a non-NULL drift value has valid_lap_in_stint >= 7, strictly
      after the baseline window, so the baseline never draws on the lap it is subtracted from or
      any lap after it. Rows with valid_lap_in_stint <= 6 -- the baseline-defining window -- get
      drift = NULL by construction (verified: zero exceptions). Stints with fewer than 7 valid
      laps get NULL throughout (no lap to report a drift value for). A (stint, corner, phase)
      baseline additionally requires >= 3 non-NULL observations inside the 6-lap window.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [stint_id, corner_name]
          status: accepted
          reason: >
            The `baseline` CTE's GROUP BY (stint_id, corner_name) does not pin a lap on its
            own, but the FILTER clause fixes its input to valid_lap_in_stint <= 6 regardless
            of which lap later reads the result, and the final SELECT NULLs every row with
            valid_lap_in_stint <= 6 (the window that defines the baseline) so no row ever
            reads a baseline drawn even partly from itself or its own future. Verified before
            the 02h ablation ran: 0 of the rows with valid_lap_in_stint <= 6 carry a non-NULL
            drift value, and every non-NULL drift row has valid_lap_in_stint >= 7. Same shape
            as int_lap_residual_stint_detrend's exemption in spirit (a stint-grain
            aggregate), but this one is a live FEATURE_COLUMNS candidate rather than
            label-construction-only, which is why the leakage argument is carried in full
            here rather than by reference to EXCLUDED_LEAKAGE_COLUMNS.
    columns:
      - name: corner_id
        description: PK = lap_id || '_C_' || corner_name
        tests: [not_null, unique]
      - name: lap_id
        description: FK to stg_laps
        tests: [not_null]
      - name: stint_id
        description: FK to int_stint_geometry
        tests: [not_null]
      - name: corner_name
        description: Named corner from dim_corners
        tests: [not_null]
      - name: valid_lap_in_stint
        description: Ordinal among valid laps only within this stint (from int_stint_geometry). Drift is NULL for values 1-6, the baseline-defining window.
        tests: [not_null]
      - name: drift_in_baseline_window
        description: >
          TRUE when this row sits inside the baseline window (valid_lap_in_stint <= 6) or the
          stint never reached 7 valid laps -- i.e. TRUE whenever all three drift columns are
          necessarily NULL for a reason other than a missing corner residual. Diagnostic, not a
          feature.
        tests: [not_null]
      - name: braking_drift_s
        description: >
          braking_loss_s minus the stint's own early-stint (valid_lap_in_stint 1-6) mean
          braking_loss_s for this corner. NULL inside the baseline window, on stints shorter
          than 7 valid laps, on a baseline with fewer than 3 usable observations, or where this
          lap's own braking_loss_s is NULL.
      - name: mid_drift_s
        description: mid_corner_residual_s minus the stint's own early-stint mean mid_corner_residual_s for this corner. Same NULL policy as braking_drift_s.
      - name: exit_drift_s
        description: exit_residual_s minus the stint's own early-stint mean exit_residual_s for this corner. Same NULL policy as braking_drift_s.

  - name: int_lap_corner_drift
    description: >
      Item 02h. int_corner_drift_from_early_stint aggregated from (lap x corner) grain to lap
      grain -- the same mean/sd/max-per-phase shape int_lap_corner_inputs (02c) uses, applied to
      DRIFT instead of PACE. One row per race lap that has at least one corner row in the
      upstream model.

      COVERAGE IS TWO CONFOUNDS AT ONCE, named so it is not mistaken for one. A lap's drift can
      be NULL because its own corner telemetry / field baseline is unmapped (02c's confound), OR
      because the lap sits inside the baseline window or its stint is shorter than 7 valid laps
      (a new, purely mechanical confound: a function of lap_in_stint / age_in_stint, both already
      in the 32-column contract). corner_drift_coverage is admitted as its own column, same
      reasoning as 02c's corner_input_coverage, and ablated separately as this item's arm C.
    tags: [intermediate, feature_engineering]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps.
        tests: [not_null, unique]
      - name: corners_total_n
        description: Corners the lineage placed on this lap.
        tests: [not_null]
      - name: corners_drift_mapped_n
        description: Corners on this lap with at least one non-NULL phase drift value.
        tests: [not_null]
      - name: corner_drift_coverage
        description: corners_drift_mapped_n / corners_total_n. The contract column -- see model description.
        tests: [not_null]
      - name: corner_braking_drift_n
        description: Corners on this lap with a measured braking drift. Companion column, not a feature.
        tests: [not_null]
      - name: corner_mid_drift_n
        description: Corners on this lap with a measured mid-corner drift. Companion column, not a feature.
        tests: [not_null]
      - name: corner_exit_drift_n
        description: Corners on this lap with a measured exit drift. Companion column, not a feature.
        tests: [not_null]
      - name: corner_braking_drift_mean_s
        description: Mean braking_drift_s across the lap's corners. Positive = braking has drifted earlier (worse) than the driver's own early-stint baseline.
      - name: corner_braking_drift_sd_s
        description: Sample sd of braking_drift_s across the lap's corners.
      - name: corner_braking_drift_max_s
        description: Largest braking_drift_s on the lap.
      - name: corner_mid_drift_mean_s
        description: Mean mid_drift_s across the lap's corners. Positive = apex speed has drifted down from the driver's own early-stint baseline.
      - name: corner_mid_drift_sd_s
        description: Sample sd of mid_drift_s across the lap's corners.
      - name: corner_mid_drift_max_s
        description: Largest mid_drift_s on the lap.
      - name: corner_exit_drift_mean_s
        description: Mean exit_drift_s across the lap's corners. Positive = throttle application has drifted later than the driver's own early-stint baseline.
      - name: corner_exit_drift_sd_s
        description: Sample sd of exit_drift_s across the lap's corners.
      - name: corner_exit_drift_max_s
        description: Largest exit_drift_s on the lap.

  # ──────────────────────────────────────────────────────────
  # Simulation   Surface expansion
  # ──────────────────────────────────────────────────────────

  - name: int_qualifying_segments
    description: >
      One row per (race_year, race_id, quali_segment). The Q1/Q2/Q3 windows of each qualifying
      session, recovered by anchoring the session-status timeline (stg_session_status_qualifying)
      to the official per-driver segment times (stg_results_qualifying). FastF1 reports one flat
      lap set per Q session with no segment column, so before this model every qualifying baseline
      was computed per race   pooling a Q1 first effort with a Q3 final lap across ~1s of track
      evolution and a self-selected top-10 field. Verified against the official results by
      assert_quali_segment_matches_official.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [driver_id, race_id, race_year]
          status: accepted
          reason: >
            q1_anchor / q2_anchor / q3_anchor each resolve the one lap that matched a
            driver's official segment time, from stg_laps_qualifying and
            stg_results_qualifying. Both sources are the qualifying session's own
            timeline; race_id identifies which weekend, not a race-lap sequence.
        - keys: [race_id, race_year, segment_index]
          status: accepted
          reason: >
            anchors / bracket_chequered / green_choice resolve one segment's opening
            and closing session-clock times from stg_session_status_qualifying's green
            lights and chequered flags. Entirely internal to the qualifying session's
            wall clock, strictly prior to the race.
    columns:
      - name: quali_segment_id
        description: Surrogate PK = concat(race_id, '_Q', segment_index).
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id; matches stg_laps_qualifying.race_id.
        tests: [not_null]
      - name: quali_segment
        description: Segment label   'Q1', 'Q2' or 'Q3'.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Q1', 'Q2', 'Q3']
      - name: segment_index
        description: 1 for Q1, 2 for Q2, 3 for Q3.
        tests: [not_null]
      - name: segment_start_s
        description: Session clock (s) at the segment's green light.
        tests: [not_null]
      - name: segment_end_s
        description: >
          Session clock (s) at the segment's chequered flag; the unresumed red flag that ended it,
          or the session's 'Finalised', when no chequered flag fell.
      - name: segment_span_s
        description: >
          segment_end_s minus segment_start_s. Nominally 1080s (Q1), 900s (Q2), 720s (Q3); longer
          when a red flag suspended the clock.
      - name: stoppage_n
        description: Red-flag stoppages ('Aborted' events) inside the segment window.
      - name: anchor_lap_n
        description: >
          Official segment times matched back to the lap that set them. Diagnostic   a low count
          means the segment's boundary rests on few anchors.
      - name: window_start_s
        description: >
          Lower bound (inclusive) for assigning a lap to this segment by lap_start_time_s.
          NULL for Q1, whose window is open at the bottom so pre-session installation laps land there.
      - name: window_end_s
        description: >
          Upper bound (exclusive) = the next segment's green light. NULL for Q3. Deliberately not
          the chequered flag: the in-lap every driver runs starts after it and still belongs to
          the segment.

  - name: int_qualifying_push_laps
    description: >
      One row per qualifying lap (gated or not, so consumers filter rather than lose the row set).
      Assigns each lap to its Q1/Q2/Q3 segment and applies the push-lap gate that stg_laps_qualifying
      cannot: is_valid_lap removes out-laps and in-laps, but not the cool-down lap between two push
      laps, which carries no pit time and passes every other check. 25% of the laps previously
      treated as valid were more than 107% off their segment's best.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [quali_segment, race_id, race_year]
          status: accepted
          reason: >
            segment_best takes MIN(lap_time_s) per (race, segment) over qualifying push
            laps only, to build the segment field-pace baseline. Qualifying-session
            internal; race_id identifies the weekend, not a race-lap sequence.
        - keys: [driver_id, quali_segment, race_id, race_year]
          status: accepted
          reason: >
            driver_segment_best is the same MIN(lap_time_s), narrowed to one driver.
            Same qualifying-only argument as the segment-grain exemption above.
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying.
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id.
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code.
        tests: [not_null]
      - name: quali_segment
        description: >
          Segment the lap was set in   'Q1', 'Q2' or 'Q3', or 'Q' when the session has no
          recoverable segment structure (the pre-segment behaviour, not a dropped row).
        tests: [not_null]
      - name: segment_best_s
        description: Fastest valid lap set in this session's segment.
      - name: driver_segment_best_s
        description: This driver's fastest valid lap in this session's segment.
      - name: ratio_to_segment_best
        description: >
          lap_time_s / segment_best_s. Above 1.07 on a push lap means the lap was admitted by the
          driver's-own-best carve-out rather than the 107% cut   43 laps of 14,165, a handful of
          which are aborted runs that were the driver's only lap in the segment. Filter on this if
          you need a stricter set.
      - name: is_push_lap
        description: >
          The gate: a valid, timed lap within quali_push_lap_ratio (1.07) of its segment's best,
          or the driver's own best lap in that segment so that no driver drops out of the
          decomposition entirely.
        tests: [not_null]

  - name: int_lap_fuel_state_qualifying
    description: >
      One row per qualifying lap. Fuel weight correction for qualifying (flat 12 kg assumption).
      Fuel component negligible (~0.42 s). Enables matching between int_lap_residual_decomposed (race)
      and int_lap_residual_decomposed_qualifying (quali) on grain.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: physics
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]

  - name: int_constructor_structural_pace_qualifying
    description: >
      One row per (race_year, race_id, constructor_id). Car pace advantage in qualifying
      (one-lap trim) via same panel regression as race version. Different coefficient expected
      vs race due to fuel load and strategy differences. Single-lap setup may favor different cars.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [quali_segment, race_id, race_year]
          status: accepted
          reason: >
            segment_pace (the segment field-pace baseline) and segment_centre
            (re-centring pace deltas within a segment before pooling to the
            constructor) both group push laps within one qualifying session. Neither
            reads or produces anything race-session-scoped; race_id identifies the
            weekend, not a race-lap sequence.
        - keys: [constructor_id, race_id, race_year]
          status: accepted
          reason: >
            The final pooling of re-centred, qualifying-only pace deltas to one
            constructor-weekend coefficient. Same argument as above, one level up.
        - keys: [race_id, race_year]
          status: accepted
          reason: >
            race_mean averages the per-constructor qualifying medians (constructor_agg,
            itself qualifying-only) to re-centre constructor_structural_pace_s on the
            weekend's field average. No race-session column enters this model anywhere
            -- see int_constructor_structural_pace for the race-session mirror, which
            is a separate model.
    columns:
      - name: constructor_race_id
        description: Surrogate PK = concat(race_year, race_id, constructor_id, '_Q')
        tests: [not_null, unique]
      - name: constructor_structural_pace_s
        description: >
          Constructor qualifying-mode coefficient. Fit on each driver's best push lap per Q1/Q2/Q3
          segment, measured against that segment's median push lap and re-centred within the
          segment before pooling. Positive = slower.
        tests: [not_null]

  - name: int_lap_residual_decomposed_qualifying
    description: >
      One row per qualifying lap. 7-term decomposition mirroring int_lap_residual_decomposed
      but with qualifying-specific coefficients (near-zero fuel, cliff-suppressed compound degradation,
      quali-mode car pace). Grain: lap_id. Enables quali-vs-race skill comparison.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [quali_segment, race_id, race_year]
          status: accepted
          reason: >
            base_track_pace_s reads the segment field-pace baseline (a segment median
            over qualifying push laps -- see int_lap_fuel_state_qualifying /
            int_qualifying_push_laps). Qualifying-session internal; race_id identifies
            the weekend, not a race-lap sequence.
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]
      - name: quali_driver_skill_residual_s
        description: >
          Driver pure quali skill residual   purer single-lap pace signal than race. The identity
          closes in closed form, so this term absorbs whatever the baseline gets wrong; gating the
          lap set to push laps and taking the baseline per segment moved its mean absolute value
          from 7.04s (sd 13.13) to 0.76s (sd 1.33), against a real qualifying field spread of ~1-3s.
        tests: [not_null]
      - name: quali_segment
        description: Q1/Q2/Q3 segment the lap was set in (FK to int_qualifying_segments).
        tests: [not_null]
      - name: base_track_pace_s
        description: >
          Field-pace baseline: the median push lap of this lap's own segment, not of the whole
          session.
      - name: ratio_to_segment_best
        description: lap_time_s / the best valid lap in the same segment.
      - name: track_unexplained_s
        description: >
          The track-evolution model's own residual for the event, carried informationally and
          deliberately not part of the identity   the same treatment as track_unexplained_s on the
          race side. Race-day proxy, like rubber_component_s and ambient_component_s here.

  - name: int_qualifying_decomposed
    description: >
      One row per qualifying lap. 7-term residual decomposition (public-facing) plus quali_vs_race_skill_delta_s:
      how much faster/slower is this driver in qualifying vs their race average? Positive = single-lap specialist.
      Grain: lap_id. Used in analytics dashboards to profile driver strengths.
    tags: [intermediate, simulation, qualifying]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [driver_id, quali_segment, race_id, race_year]
          status: accepted
          reason: >
            quali_driver_segment_best (the residual of the driver's best push lap per
            Q1/Q2/Q3 segment). Every input row is a qualifying push lap, all of which
            precede the race in wall-clock time; race_id here identifies the weekend's
            session, not a race-lap sequence, so this key set never pools laps that a
            race-lap feature would need to be point-in-time correct against.
        - keys: [driver_id, race_id, race_year]
          status: accepted
          reason: >
            This key set covers TWO different CTEs that happen to group on the same
            columns. quali_driver_session_avg averages the per-segment personal bests
            computed above -- qualifying-only, same argument as the segment-grain
            exemption. race_driver_race_avg is the one that needs the careful reading:
            it averages driver_skill_residual_s from int_lap_residual_decomposed over
            the driver's laps in THIS race (a genuine race-session aggregate), to build
            quali_vs_race_skill_delta_s. That average is not knowable until the race has
            finished, so quali_vs_race_skill_delta_s is a real forward-reach construct
            with respect to any race-lap label -- the same shape 02a ruled on in
            int_corner_skill_residuals, one grain coarser (the whole race instead of a
            5-lap bucket). It is accepted here, not declared a known_leak, because
            nothing in the mart's lineage reads it: int_qualifying_driver_summary (item
            02b) is the only model that selects FROM int_qualifying_decomposed for
            feature purposes, and its own SELECT deliberately omits
            quali_vs_race_skill_delta_s -- see that model's header for the ruling. If
            any future model reads this column into the mart's lineage, this exemption
            must be revisited (split into its own key-set entry with status
            known_leak) rather than assumed to still cover it.
    columns:
      - name: lap_id
        description: PK, FK to stg_laps_qualifying
        tests: [not_null, unique]
      - name: quali_skill_residual_s
        description: Per-lap qualifying driver skill residual.
        tests: [not_null]
      - name: quali_vs_race_skill_delta_s
        description: >
          Per-driver per-event differential between qualifying and race skill.
          Positive = qualifying specialist. NULL when no race data available for that event.
      - name: quali_skill_session_avg_s
        description: >
          Driver's qualifying skill for the event: the residual of their best push lap in each
          segment, averaged over the segments they contested. Previously the mean over every lap
          FastF1 flagged IsPersonalBest, which fires on every improving lap (4.58 per driver-race,
          up to 15) and charged a driver who built up incrementally as much as ~4s of pure
          aggregation artefact.
      - name: quali_segments_contested_n
        description: Segments (1-3) in which the driver set a best push lap.
      - name: quali_segment
        description: Q1/Q2/Q3 segment the lap was set in (FK to int_qualifying_segments).
        tests: [not_null]

  - name: int_qualifying_driver_summary
    description: >
      02b (Tier 1). Driver-weekend qualifying summary, one row per (race_year, race_id,
      driver_id), read off int_qualifying_decomposed's push-lap rows and rolled up to
      the whole qualifying session. The first channel in the feature contract's lineage
      sourced from a strictly-prior SESSION rather than a further transform of race-lap
      residuals -- qualifying runs before the race, so no lag/expanding-window treatment
      is needed, PROVIDED (as here) every input column is itself scoped to the
      qualifying session.

      quali_vs_race_skill_delta_s is DELIBERATELY NOT CARRIED. int_qualifying_decomposed
      computes it by subtracting a same-race average of driver_skill_residual_s
      (race_driver_race_avg) -- a race-session aggregate not knowable until the race has
      finished, the same forward-reach shape 02a ruled on in int_corner_skill_residuals,
      one grain coarser (the whole race instead of a 5-lap bucket). See this model's own
      SQL header and int_qualifying_decomposed's own aggregation_scope_exemptions entry
      above for the full ruling.

      HONEST CEILING. This grain is stint-invariant: every lap of a driver's race sees
      the same value. Per the leaf doc's §1, 99.06% of the degradation target's variance
      is within-stint, so this group can only ever address the other 0.94%. Expected to
      move cliff_classifier and/or stint_life_regressor, not the degradation trio -- 02b's
      pre-registered arms test that expectation, they do not assume it.
    tags: [intermediate, feature_engineering, qualifying]
    meta:
      family: pace-baselines
      aggregation_scope_exemptions:
        - keys: [race_year, race_id, driver_id]
          status: accepted
          reason: >
            The model's only GROUP BY, rolling int_qualifying_decomposed's push-lap rows
            up to one row per driver-weekend. Every input row is a qualifying push lap,
            strictly prior in wall-clock time to every lap of the race it will later be
            joined onto -- the same "qualifying precedes the race" argument
            int_lap_fuel_state's race-level starting-fuel constant is declared on, one
            level narrower (a session, not a whole race). Unlike
            int_qualifying_decomposed's race_driver_race_avg (grouped on this same key
            set, in a DIFFERENT CTE, one model upstream), no column this model SELECTs
            reads anything race-scoped: the list is constructor_component_s (+ SE),
            quali_pace_delta_s, ratio_to_segment_best, quali_skill_session_avg_s and
            quali_segments_contested_n, all qualifying-session columns.
            quali_vs_race_skill_delta_s -- the one column with the forward-reach defect
            -- is deliberately excluded from the SELECT above; see the model description.
            Confirmed mechanically: ml/src/features.py::audit_aggregation_scope returns
            CLEAN with this exemption in place.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_year, race_id, driver_id]
    columns:
      - name: race_year
        description: Season year.
        tests: [not_null]
      - name: race_id
        description: Race identifier.
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code.
        tests: [not_null]
      - name: quali_push_laps_n
        description: >
          Push laps this driver set across Q1/Q2/Q3 this weekend (COUNT(*) over
          int_qualifying_decomposed's push-lap rows for this driver-weekend). The mart
          COALESCEs this to 0 for a driver-weekend with no row here at all -- a genuine
          "no qualifying record" (DNQ or a data gap), not an invented value.
        tests: [not_null]
      - name: quali_constructor_pace_mean_s
        description: >
          Mean constructor_component_s over the driver's push laps this weekend: a car's
          one-lap aero/power level, measured with fuel, strategy and traffic all
          near-absent. MEAN smooths Q1/Q2/Q3 segment-to-segment noise in a term expected
          to be near-stable across one weekend.
      - name: quali_constructor_pace_se_mean_s
        description: >
          Mean of constructor_component_se_s over the same push laps -- the average
          estimation uncertainty on the pace term above.
      - name: quali_pace_delta_best_s
        description: >
          MIN(quali_pace_delta_s) over the weekend, i.e. the driver's single best push
          lap: quali_pace_delta_s is positive/higher = slower by construction (see
          int_lap_residual_decomposed_qualifying's header), so MIN is the fastest lap.
      - name: quali_ratio_to_segment_best_min
        description: >
          MIN(ratio_to_segment_best) over the weekend -- how close the driver's best lap
          in any segment came to that segment's own fastest push lap. Same
          "higher = slower" orientation as quali_pace_delta_best_s above.
      - name: quali_skill_session_avg_s
        description: >
          MAX(quali_skill_session_avg_s) over the driver's push-lap rows. Already
          computed at this exact (race_year, race_id, driver_id) grain one level up in
          int_qualifying_decomposed and repeated on every push-lap row there, so MAX is a
          value-preserving collapse of an already-constant column, not a real
          aggregation -- the same property 02c's QUALIFY ROW_NUMBER() dedupe relies on
          for its own repeated-value rows.
      - name: quali_segments_contested_n
        description: >
          MAX(quali_segments_contested_n) over the driver's push-lap rows -- same
          value-preserving collapse as quali_skill_session_avg_s above. Segments (1-3) in
          which the driver set a best push lap.

  - name: int_pit_strategy_value
    description: >
      One row per stint. Evaluates pit strategy: what was the optimal pit lap vs actual?
      The argmin of int_pit_strategy_cost_curve's Total_Cost(L) over every candidate lap in
      the horizon, replacing the "first lap where expected wear exceeds 0.5 s" threshold that
      stood here until 2026-08-23 and had no pit-loss term in it. That threshold returned
      'optimal' on 8 stints of 7,129 and 'unknown' on 2,231; the argmin returns 715 and 266.
      Two horizons are reported. The verdict follows the two-stint window (this stint's first
      lap through the next stint's last), the only framing well posed for the 61% of stints in
      a 2-stop or longer race; the race-remainder optimum is carried alongside as a diagnostic.
      opportunity_cost_s is now Total_Cost(actual) - Total_Cost(optimal), so pitting early
      carries a cost too, which the overrun-only definition could not express.
      Pit-loss is per circuit from int_pit_loss_circuit's empirical, EB-shrunk estimate
      (19.3–29.6 s over the 147 races that resolve one), falling back to the circuit_reference
      seed and then 21.0 s; pit_loss_source records which was used.
    tags: [intermediate, simulation, strategy]
    meta:
      family: strategy
    columns:
      - name: stint_id
        description: PK, FK to int_stint_geometry
        tests: [not_null, unique]
      - name: optimal_pit_lap
        description: >
          Optimal pit lap number (absolute race lap) - the lap the car enters the pit lane,
          i.e. one after the last lap run on the set, matching stg_pits.pit_in_lap_number.
          NULL when the compound has no fitted curve to minimise over.
      - name: optimal_pit_lap_in_stint
        description: >
          Optimal laps to run on the set before boxing, counted in VALID laps. Not a
          chronological lap_in_stint: SC and pit laps do not age a tyre the way a racing lap
          does, and the cost curve is indexed on tyre age.
      - name: actual_pit_lap
        description: Actual pit lap number from stg_pits. NULL for last stint of race.
      - name: overrun_laps
        description: >
          Actual laps run on the set minus optimal, in valid laps. Negative = pitted early.
          Compared as offsets rather than lap numbers so an invalid lap before the stop cannot
          skew it. NULL when either side is NULL. Median -1 across seven seasons: teams stop
          slightly earlier than a degradation-only optimum, which is what track position buys.
      - name: opportunity_cost_s
        description: >
          Total_Cost(actual) - Total_Cost(optimal), in seconds. Non-negative by construction:
          the optimum is a minimum over the same curve. Zero for a stint that never stopped,
          which had no pit decision to grade. Median 5.5 s, p95 83 s.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 6000.0
              config:
                where: "opportunity_cost_s IS NOT NULL"
      - name: strategy_verdict
        description: Strategy classification.
        tests:
          - accepted_values:
              arguments:
                values: ['optimal', 'overran', 'undercut_forced', 'early', 'unknown']
              config:
                where: "strategy_verdict IS NOT NULL"
      - name: optimal_pit_lap_confidence
        description: >
          How sharply identified the optimum is: the share of candidate laps whose total cost
          is more than a second worse than it. 1.0 = one lap stands out; near 0 = the curve is
          flat and the exact lap barely matters. 0.0 where no curve exists. Replaces the
          0.0/0.1/0.8 sentinel ladder, which encoded whether cliff onset was NULL rather than
          anything about the estimate.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: pit_lane_loss_s
        description: >
          Pit-lane loss used for this stint's undercut-threat scan, in seconds. Empirical
          where int_pit_loss_circuit resolves the venue, else the circuit_reference seed,
          else 21.0.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60
      - name: pit_loss_source
        description: Which pit-loss estimate this row used - empirical / seed / default.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['empirical', 'seed', 'default']
      - name: pit_loss_imputed_flag
        description: >
          TRUE when nothing was measured on either side - no empirical stops resolved and the
          seed row was itself a guess.
        tests: [not_null]
      - name: horizon_source
        description: >
          Which horizon the verdict's argmin used - two_stint (4,014 stints) or the
          race_remainder fallback for a stint with no successor (2,642). NULL where no fitted
          compound curve exists to minimise over (473).
        tests:
          - accepted_values:
              arguments:
                values: ['two_stint', 'race_remainder']
              config:
                where: "horizon_source IS NOT NULL"
      - name: horizon_laps
        description: Length of that horizon in valid laps.
      - name: optimal_pit_lap_race_in_stint
        description: >
          The race-remainder optimum, in valid laps on the set. Diagnostic: asks the harsher
          unconditional question "if they had stopped only once more all race, when?" rather
          than grading the stop inside the strategy the team actually ran.
      - name: optimal_pit_lap_race
        description: Absolute race lap for optimal_pit_lap_race_in_stint.
      - name: opportunity_cost_race_s
        description: >
          The same actual-minus-optimal difference measured on the race-remainder horizon.
          Systematically larger than opportunity_cost_s for a 2-stopper, because a one-stop
          counterfactual charges them for a stop they were never going to skip.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 6000.0
              config:
                where: "opportunity_cost_race_s IS NOT NULL"

  - name: int_pit_strategy_cost_curve
    description: >
      One row per (stint_id, horizon_scope, candidate_pit_lap_offset): the Total_Cost(L)
      surface int_pit_strategy_value's header described for two years and never computed.
      Cost of pitting after L laps on the current set = wear on the old set over those laps
      + wear on the next set over the rest of the horizon + a compound baseline offset
      + pit-lane loss discounted by the chance a safety car has already appeared.
      L = H is the no-stop candidate, which pays no pit term and is what makes a stop have to
      justify itself. THE SC DISCOUNT IS LOAD-BEARING: under a fixed one-stop the pit loss is
      the same whenever you take it, so it adds a constant to every candidate and cancels out
      of the argmin entirely - a longer pit lane would move nothing. Discounting it by
      1 - (1 - m)(1 - (1 - h)^L), with h from int_sc_hazard_history, is what makes waiting pay
      and gives the model the property assert_pit_loss_pushes_optimum_later checks.
      Per-lap wear is capped at var('compound_wear_max_s_per_lap') -- the shared bound, which
      int_compound_cliff_predicted now applies to the same three terms as of Phase 8. The cliff polynomial
      is unbounded, reaching 136 s/lap extrapolated to age 80 and already 93 s/lap in-sample.
    tags: [intermediate, simulation, strategy]
    meta:
      family: strategy
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [stint_id, horizon_scope, candidate_pit_lap_offset]
    columns:
      - name: stint_id
        description: FK to int_stint_geometry. Part of the compound PK.
        tests: [not_null]
      - name: horizon_scope
        description: >
          window = this stint's first lap through the next stint's last; race = through the
          driver's last lap of the race. Both are emitted for every stint that has them.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['window', 'race']
      - name: horizon_laps
        description: Length of the horizon in valid laps.
        tests: [not_null]
      - name: candidate_pit_lap_offset
        description: >
          Laps run on the current set before boxing, in valid laps. Runs 1..horizon_laps;
          the last value is the no-stop candidate. Part of the compound PK.
        tests: [not_null]
      - name: laps_on_new_set
        description: horizon_laps minus the offset. Zero for the no-stop candidate.
        tests: [not_null]
      - name: old_wear_cost_s
        description: >
          Cumulative wear over the laps run on the current set, evaluated on its own fitted
          curve from the age the stint opened on - a stint started on a used set begins
          part-way up that curve rather than at zero.
        tests: [not_null]
      - name: new_wear_cost_s
        description: Cumulative wear over the rest of the horizon on the next set, from age 1.
        tests: [not_null]
      - name: baseline_cost_s
        description: >
          Per-lap pace offset between the two compounds (compound_grip_peak plus the
          optimal-temperature term) over the laps on the new set. Both inputs are per-compound
          CONSTANTS in compound_cliff_params, never fitted, and grip_peak as typed prices SOFT
          slower than HARD. var('pit_strategy_baseline_delta') decides whether this term is
          allowed to move the argmin; setting it FALSE zeroes this column.
        tests: [not_null]
      - name: sc_hazard_per_lap
        description: >
          Per-racing-lap SC/VSC hazard for the circuit, EB-shrunk, from int_sc_hazard_history.
          0.0 for a circuit with no ingested track_status timeline, which makes the discount
          constant and returns the model to the pit-loss-cancels case.
        tests: [not_null]
      - name: sc_probability
        description: P(a caution has appeared within the candidate's laps) = 1 - (1 - h)^L.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: pit_discount_factor
        description: >
          Fraction of the green-flag pit-lane loss this candidate expects to pay. Non-increasing
          in the candidate lap - asserted by assert_pit_discount_monotone - and a hard 0 for the
          no-stop candidate.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: wear_cost_s
        description: >
          Everything that does not scale with pit_lane_loss_s. Split out so a consumer - or
          assert_pit_loss_pushes_optimum_later - can re-minimise at a different pit loss
          without rebuilding the curve.
        tests: [not_null]
      - name: total_cost_s
        description: wear_cost_s + pit_lane_loss_s x pit_discount_factor. The argmin target.
        tests: [not_null]

  - name: int_circuit_x_constructor_interaction
    description: >
      One row per (race_year, race_id, constructor_id). Circuit-specific car advantage beyond
      the constructor's season-TO-DATE average. E.g., Red Bull faster at high-downforce tracks.
      The shrinkage pool is keyed on the physical-circuit id, so a renamed event or double-header
      (e.g. mexican_grand_prix / mexico_city_grand_prix) shares one pool rather than splitting
      into two thinner cells. Shrunk toward 0 (Bayesian prior). Positive = slower at this circuit
      than the season so far.
      Point-in-time since 08f-2: both the season average and the shrinkage pool are expanding
      windows over races STRICTLY BEFORE this one, where both used to be GROUP BYs that pooled
      the whole season and every ingested season respectively. Consequence to know before reading
      the column: 2018 is the first ingested season, so no 2018 row has a prior visit and the
      interaction is identically 0 across it.
    tags: [intermediate, simulation, ghost_car]
    meta:
      family: pace-baselines
    columns:
      - name: constructor_race_id
        description: Surrogate PK
        tests: [not_null, unique]
      - name: circuit_constructor_interaction_s
        description: Seconds adjustment for this constructor at this circuit. Positive = slower.
        tests: [not_null]

  - name: int_tyre_surface_vs_bulk_decoupling
    description: >
      One row per lap (post-cliff only). After tyre cliff, diagnoses whether degradation is
      surface-recoverable or bulk-structural. surface_bulk_ratio [0,1]: high = recoverable,
      low = must pit. Includes recovery_probability (pace-recovery chance within 2 laps).
      Grain: lap_id filtered to cliff_onset_passed = TRUE.
    tags: [intermediate, simulation, thermal]
    meta:
      family: residual
    columns:
      - name: lap_id
        description: PK, FK to stg_laps (post-cliff laps only)
        tests: [not_null, unique]
      - name: surface_bulk_ratio
        description: push_load_surface / (push_load_surface + push_load_bulk). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: degradation_source
        description: Classification based on surface_bulk_ratio thresholds.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['surface_driven', 'bulk_driven', 'mixed']
      - name: recovery_probability
        description: Probability of pace recovery within 2 laps. [0, 1]. SQL approximation.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: thermal_attribution_s
        description: Share of compound_component_s attributable to thermal (surface) damage.
        tests: [not_null]

  - name: int_driver_circuit_affinity
    description: >
      One row per (driver_id, circuit_id). How much faster/slower is this driver at this circuit
      relative to their career average? circuit_id is the physical-circuit identifier, so renamed
      events and double-headers at one venue (e.g. mexican_grand_prix / mexico_city_grand_prix)
      pool into a single track record. Shrunk toward driver mean (Bayesian, prior = 5 virtual races).
      Negative = faster at this circuit than career average. affinity_confidence [0,1]: < 0.17 = prior-dominated.
      Identifies drivers who suit high-downforce, street, etc. tracks.
    tags: [intermediate, driver_rating, driver_affinity]
    meta:
      family: skill
    columns:
      - name: driver_circuit_id
        description: Surrogate PK = hash(driver_id, circuit_id)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: circuit_id
        description: >
          Physical-circuit identifier (slug of circuit_name). Collapses event-slug
          aliases (renamed events, double-headers) onto one venue.
        tests: [not_null]
      - name: circuit_name
        description: Canonical circuit display name for this circuit_id.
        tests: [not_null]
      - name: n_obs
        description: Number of race-residual observations backing this estimate
        tests: [not_null]
      - name: seasons_observed_n
        description: Count of distinct seasons the driver raced at this circuit
        tests: [not_null]
      - name: raw_affinity_s
        description: Unshrunk observed mean residual at this circuit. Negative = faster.
        tests: [not_null]
      - name: shrunk_affinity_s
        description: Bayesian posterior mean. Pulled toward driver global mean.
        tests: [not_null]
      - name: shrunk_affinity_se_s
        description: Posterior standard error in seconds. Non-negative.
        tests:
          # SE is NULL only for degenerate single-observation cells where the
          # posterior variance collapses to zero (SQRT(NULLIF(var, 0))). On real
          # data every cell is estimable; the NULL surfaces only on tiny CI
          # fixtures. Scope not_null to multi-obs cells, which must always be
          # estimable. Range check ignores NULLs natively.
          - not_null:
              config:
                where: "n_obs > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: shrunk_affinity_ci_low_s
        description: Lower bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_ci_high_s
        description: Upper bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: affinity_confidence
        description: Data fraction of posterior mass. n_obs / (n_obs + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_driver_circuit_era_affinity
    description: >
      One row per (driver_id, circuit_id, era_key). Same shrinkage as int_driver_circuit_affinity
      but split on the 2022 ground-effect regulation boundary so a driver's track record is never
      blended across incomparable car eras (pre2022 = 2018–2021, post2022 = 2022–2024). circuit_id
      is the physical-circuit identifier, so renamed events and double-headers at one venue pool
      into a single track record. Within an
      era the residual is car-removed, so ranking drivers by shrunk_affinity_s ≈ "equal-car track
      record" at that circuit. Shrunk toward the driver's within-era global mean (Bayesian, prior =
      5 virtual races). Negative = faster than field. Backs the Ghost Car Standings feature.
    tags: [intermediate, driver_rating, driver_affinity]
    meta:
      family: skill
    columns:
      - name: driver_circuit_era_id
        description: Surrogate PK = hash(driver_id, circuit_id, era_key)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: circuit_id
        description: >
          Physical-circuit identifier (slug of circuit_name). Collapses event-slug
          aliases (renamed events, double-headers) onto one venue.
        tests: [not_null]
      - name: circuit_name
        description: Canonical circuit display name for this circuit_id.
        tests: [not_null]
      - name: era_key
        description: Regulation era. pre2022 = 2018–2021, post2022 = 2022–2024.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre2022', 'post2022']
      - name: era_label
        description: Human-readable era span ('2018–2021' / '2022–2024').
        tests: [not_null]
      - name: n_obs
        description: Number of race-residual observations backing this estimate within the era
        tests: [not_null]
      - name: seasons_observed_n
        description: Count of distinct seasons the driver raced at this circuit within the era
        tests: [not_null]
      - name: raw_affinity_s
        description: Unshrunk observed mean residual at this circuit-era. Negative = faster.
        tests: [not_null]
      - name: shrunk_affinity_s
        description: Bayesian posterior mean. Pulled toward the driver's within-era global mean.
        tests:
          # NULL at n_obs = 1: a single race is one data point, not a track
          # record, and the posterior at that n is too prior-dominated to be
          # worth publishing. Scope not_null to estimable multi-obs cells.
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_se_s
        description: Posterior standard error in seconds. Non-negative.
        tests:
          # See int_driver_circuit_affinity: SE/CI are NULL only for degenerate
          # single-observation cells (posterior variance collapses to zero).
          # Scope not_null to estimable multi-obs cells.
          - not_null:
              config:
                where: "n_obs > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: shrunk_affinity_ci_low_s
        description: Lower bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: shrunk_affinity_ci_high_s
        description: Upper bound of 95% credible interval
        tests:
          - not_null:
              config:
                where: "n_obs > 1"
      - name: affinity_confidence
        description: Data fraction of posterior mass. n_obs / (n_obs + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_driver_race_skill_loro
    description: >
      De-confounded absolute equal-car skill, race grain
      (race_year, race_id, driver_id). driver_skill_loro_s = P20 ceiling minus the LORO
      teammate baseline (used by the rating chain). driver_skill_field_s = median pace
      delta minus the de-biased constructor×race FE (int_constructor_car_fe.car_fe_s,
      car pace net of driver skill); used only by int_driver_circuit_era_affinity / Ghost
      Car Standings leaderboard, fixing the weak-teammate inflation confound. Negative =
      faster than field (both signals).
    tags: [intermediate, driver_rating, causal_decomposition]
    meta:
      family: skill
    columns:
      - name: driver_race_skill_id
        description: Surrogate PK = hash(race_year, race_id, driver_id)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: race_year
        description: Race year (integer)
        tests: [not_null]
      - name: race_id
        description: Race identifier (numeric)
        tests: [not_null]
      - name: driver_skill_loro_s
        description: >
          De-confounded equal-car skill, seconds. P20 of focal deltas minus LORO car baseline.
          Negative = faster. NULL when the driver is the only one with clean laps in his car
          that race (no equal-car reference). Used by the rating chain.
      - name: driver_skill_field_s
        description: >
          Field-anchored equal-car skill, seconds. Median pace delta minus the de-biased
          car term (int_constructor_car_fe.car_fe_s the constructor×race FE, car pace
          net of driver skill). The FE's global driver anchor fixes the weak-teammate
          inflation confound that the old constructor-median term still leaked (that
          median absorbed the team's driver skill, so subtracting it handed a weak
          driver's slowness back as skill). NULL when the constructor×race FE is
          unidentified for this race. Used only by int_driver_circuit_era_affinity
          (Ghost Car Standings leaderboard).
      - name: clean_lap_count
        description: Clean laps contributing to this driver-race estimate.
        tests: [not_null]

  - name: int_driver_season_ratings
    description: >
      One row per (driver_id, season). Aggregates race residuals to season grain.
      Shrunk toward season league average (Bayesian, prior = 5 virtual races).
      Negative = faster than season average. Intermediate for era_normalized_driver_rating.
      Isolates driver strength from era variation (e.g., 2016 vs 2022 regulations).
    tags: [intermediate, driver_rating, era_rating]
    meta:
      family: skill
    columns:
      - name: driver_season_id
        description: Surrogate PK = hash(driver_id, season)
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: season
        description: Race year (integer)
        tests: [not_null]
      - name: n_races
        description: Races contributing to this estimate
        tests: [not_null]
      - name: raw_residual_mean_s
        description: Unadjusted season mean residual. Negative = faster.
        tests: [not_null]
      - name: shrunk_residual_s
        description: Bayesian posterior mean toward season league average.
        tests: [not_null]
      - name: shrunk_residual_se_s
        description: Posterior standard error in seconds.
        tests:
          # NULL only for degenerate single-race cells where posterior variance
          # collapses to zero. Scope not_null to multi-race cells (always
          # estimable); the NULL surfaces only on tiny CI fixtures.
          - not_null:
              config:
                where: "n_races > 1"
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2.0
      - name: rating_confidence
        description: Data fraction of posterior mass. n_races / (n_races + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: int_era_normalized_driver_rating
    description: >
      One row per (driver_id, season). Cross-era driver rating: compares drivers across 2018–2024
      despite regulation changes (2022 ground-effect boundary). Uses bridge drivers (≥8 races both eras)
      to estimate era offset, then adjusts season residuals. era_adjusted_rating = comparable across eras;
      negative = faster than era average. low_anchor_sample_flag = few bridge drivers (weak offset).
    tags: [intermediate, driver_rating, era_rating]
    meta:
      family: skill
    columns:
      - name: driver_season_id
        description: Surrogate PK = hash(driver_id, season). Matches int_driver_season_ratings.
        tests: [not_null, unique]
      - name: driver_id
        description: Driver identifier
        tests: [not_null]
      - name: season
        description: Race year (integer)
        tests: [not_null]
      - name: raw_residual_mean_s
        description: Unadjusted season mean. Not era-adjusted.
        tests: [not_null]
      - name: shrunk_residual_s
        description: Bayesian posterior mean (season shrinkage applied, no era offset).
        tests: [not_null]
      - name: era_adjusted_rating
        description: Cross-era comparable rating. Negative = faster than era average. Key output column.
        tests: [not_null]
      - name: era_adjusted_rating_se_s
        description: Propagated SE (sqrt of shrunk SE² + era shift SE²).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 3.0
      - name: era_adjusted_rating_ci_low_s
        description: Lower bound of 95% CI on era_adjusted_rating
        tests: [not_null]
      - name: era_adjusted_rating_ci_high_s
        description: Upper bound of 95% CI on era_adjusted_rating
        tests: [not_null]
      - name: rating_confidence
        description: n_races / (n_races + 5). [0, 1].
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: bridge_driver_anchor_flag
        description: TRUE if this driver was used to estimate the era offset.
        tests: [not_null]
      - name: low_anchor_sample_flag
        description: TRUE if fewer than 3 bridge drivers found; era offset is 0 when this fires.
        tests: [not_null]

  - name: int_sc_hazard_history
    description: >
      Safety-Car / Virtual-Safety-Car base rate per circuit (venue slug) as a
      hazard per racing lap, POINT-IN-TIME AS OF THE START OF EACH SEASON.
      Grain is one row per (circuit_slug, season); the rate on a row is
      estimated from races at that circuit in seasons STRICTLY BEFORE it, so a
      2019 row never sees 2019 or later. Estimated from SC/VSC deployment
      onsets in stg_track_status with racing-lap exposure from stg_laps. Raw and
      empirical-Bayes-shrunk rates are provided; the EB prior is itself
      season-lagged (pooled over all circuits, seasons < S), because shrinking
      toward an all-time pooled rate would leak the future through the prior.


      REBUILT 2026-09-11 (work item 02d). The previous version pooled every
      season into ONE row per circuit, so a 2018 consumer read a hazard
      partly estimated from 2024 races. Any consumer must now join on
      (circuit_slug, season), not circuit_slug alone -- a circuit-only join
      silently fans out 5-7x and reinstates the leak. int_pit_strategy_cost_curve
      is the one dbt consumer and was updated with it.


      TRACK-STATUS COVERAGE, measured against data/dev.duckdb on 2026-09-11.
      The old header warned ingestion was "incomplete for some seasons"; that
      caveat was stale. Every race with laps has a track_status timeline:
      2018 21/21, 2019 21/21, 2020 17/17, 2021 22/22, 2022 22/22, 2023 22/22,
      2024 24/24 -- 148/148, 100% in every season. Timelines are thin on
      incident-free races (19 races carry <= 3 messages, the minimum being a
      single AllClear), which is an absence of events rather than an absence of
      ingestion, and the hazard numerator counts onsets so it reads those
      correctly as zero.


      MISSINGNESS, deterministic and declarable. The raw rates are NULL where a
      circuit has no prior exposure -- its debut season -- because "unknowable"
      and "measured, no onsets" are different statements: 36 rows of 149, one
      per circuit. The shrunk rates survive a circuit debut (zero prior
      exposure shrinks fully to the pooled prior, the correct EB answer) and
      are NULL only where the pooled prior is itself unknowable: all 21 rows of
      season 2018, the earliest season in the warehouse. Both NULL sets are
      deterministic on (circuit_slug, season) and readable off the companion
      prior_seasons_n / prior_racing_laps columns, which are never NULL.


      ENTERED THE FEATURE LINEAGE 2026-09-20 (02d). Five columns are read by
      fct_cliff_prediction_features on the (circuit_key, race_year) join. That
      moves this model out of features.py's report-only survey and into
      audit_aggregation_scope's enforced scope, which is why the four exemptions
      below now exist: they were the advance notice the survey was written to
      give, and this is the ruling arriving. The columns are mart-only and are
      NOT in ml/src/schema.py's FEATURE_COLUMNS pending 02d's arms.
    meta:
      family: strategy
      aggregation_scope_exemptions:
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            Two CTEs group on this key set, and both pin a RACE, which is the
            grain the quantity is defined at. `onsets` counts SC/VSC deployment
            messages per race; `exposure` takes MAX(lap_number) per race as the
            racing-lap count. Neither reaches across races, so neither can reach
            forward past the season boundary the lag enforces. The forward-reach
            question for this model is settled one level up, at the season frame,
            not here: see assert_sc_hazard_no_forward_leakage, which re-derives
            the whole window with an inequality join rather than a window frame.
            MAX(lap_number) is the same race-distance proxy already accepted in
            int_lap_fuel_state, and is a within-race observable, not a forward one.
        - keys: [circuit_slug, race_year]
          status: accepted
          reason: >
            per_circuit_season rolls the races of one venue in one season into a
            single row. This is deliberately the COARSEST grain in the model and
            the reason it is safe: 02g's fan-out defect was a window frame
            evaluated at a finer grain than the key it was later joined on, and
            pre-aggregating to exactly (circuit, season) before the trailing
            window runs is what forecloses it. The group cannot span seasons, so
            it cannot pull a later season into an earlier row.
        - keys: [season]
          status: accepted
          reason: >
            per_season_global totals every circuit within one season, the input
            to the season-lagged pooled EB prior. Pooling ACROSS CIRCUITS is the
            point of a pooled prior; pooling across seasons is what would leak,
            and this group cannot do it because season is the key. The lag is
            applied afterwards, in global_prior, which ends at 1 PRECEDING on the
            season axis -- so the prior a season-S row shrinks toward is itself
            built from seasons < S. Shrinking toward an all-time pooled rate is
            the back-door version of the leak this whole model was rebuilt to
            close, and this exemption is the record that it was considered.
    columns:
      - name: circuit_slug
        description: Venue identifier (race name slug, e.g. monaco_grand_prix); recurs across seasons.
        tests: [not_null]
      - name: season
        description: >
          The season this estimate is "as of the start of". The estimate uses
          seasons < this value only; the current season's own races are
          deliberately excluded, so the value is constant across a season.
        tests: [not_null]
      - name: season_races_n
        description: >
          Races at this circuit in THIS season -- exposure the season lag
          deliberately excludes from the estimate. Carried so a consumer can see
          how much is being withheld, not as an input to any rate.
        tests: [not_null]
      - name: prior_seasons_n
        description: >
          Distinct earlier seasons contributing to the estimate. 0 on a
          circuit's debut season; never NULL. This is the companion count that
          makes the rate NULLs explainable from the data.
        tests: [not_null]
      - name: prior_races_n
        description: Races in the estimate (this circuit, seasons < season). 0 on a debut; never NULL.
        tests: [not_null]
      - name: prior_racing_laps
        description: >
          Racing-lap exposure in the estimate (sum of per-race leader lap counts
          over seasons < season) -- the hazard denominator. 0 on a debut season;
          never NULL.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000
      - name: prior_sc_onsets
        description: Safety-Car onsets in the estimate window. Never NULL.
        tests: [not_null]
      - name: prior_vsc_onsets
        description: Virtual-Safety-Car onsets in the estimate window. Never NULL.
        tests: [not_null]
      - name: prior_any_onsets
        description: Combined SC+VSC onsets in the estimate window. Never NULL.
        tests: [not_null]
      - name: sc_hazard_per_lap
        description: >
          Raw Safety-Car onsets per racing lap over seasons < season. NULL on a
          circuit's debut season (no prior exposure) -- see the model
          description's missingness note.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "sc_hazard_per_lap is not null"
      - name: vsc_hazard_per_lap
        description: Raw Virtual-Safety-Car onsets per racing lap over seasons < season. NULL on a circuit's debut season.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "vsc_hazard_per_lap is not null"
      - name: any_hazard_per_lap
        description: Raw combined SC+VSC onsets per racing lap over seasons < season. NULL on a circuit's debut season.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "any_hazard_per_lap is not null"
      - name: sc_hazard_per_lap_shrunk
        description: >
          Empirical-Bayes SC hazard shrunk toward the season-lagged pooled rate
          (pseudo-count sc_hazard_prior_laps). NULL only for season 2018, which
          has no prior season to pool.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "sc_hazard_per_lap_shrunk is not null"
      - name: vsc_hazard_per_lap_shrunk
        description: Empirical-Bayes VSC hazard shrunk toward the season-lagged pooled rate. NULL only for season 2018.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "vsc_hazard_per_lap_shrunk is not null"
      - name: any_hazard_per_lap_shrunk
        description: Empirical-Bayes combined SC+VSC hazard shrunk toward the season-lagged pooled rate. NULL only for season 2018.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
                row_condition: "any_hazard_per_lap_shrunk is not null"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - circuit_slug
              - season

  - name: int_pit_loss_circuit
    description: >
      Empirical circuit-specific pit-lane loss prior, read by int_pit_strategy_value in
      place of the largely-imputed circuit_reference constant. Per stop, loss = (in_lap −
      ref) + (out_lap − ref) where ref is the driver's median green lap that race; the
      value is the median across stops within a sane [pit_loss_min_s, pit_loss_max_s]
      window, EB-shrunk toward the global median. Stops whose in-lap or out-lap ran under
      SC, VSC or a red flag are excluded — under a neutralisation the lap the stop is
      measured against is not the lap the driver would otherwise have run. Estimated per
      physical venue (circuit_id) so a renamed event or double-header shares one pit lane
      and one sample, then emitted per event slug so the consumer's race_to_track join is
      unchanged. Scoped to races with a venue slug available.
    meta:
      family: strategy
    columns:
      - name: circuit_slug
        description: Event identifier (race name slug); recurs across seasons. PK.
        tests: [not_null, unique]
      - name: circuit_id
        description: >
          Physical-venue identifier the estimate is pooled on. Several event slugs can share
          one circuit_id (british / 70th_anniversary, brazilian / são_paulo, mexican /
          mexico_city, austrian / styrian) and then carry identical values by construction.
        tests: [not_null]
      - name: n_stops
        description: Number of clean green-flag pit stops observed at this physical venue.
        tests: [not_null]
      - name: pit_loss_s_empirical
        description: Median empirical pit-lane loss (seconds) across observed stops.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60
      - name: pit_loss_s_shrunk
        description: Pit-lane loss EB-shrunk toward the global median (pseudo-count pit_loss_prior_stops).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 8
                max_value: 60

  - name: int_lap_residual_stint_detrend
    description: >
      Per-stint linear drift of driver_skill_residual_s against lap_in_stint, fit on pre-cliff
      laps only (cliff_onset_passed = FALSE) via OLS REGR_SLOPE. One row per stint with >= 3
      pre-cliff laps; stints with fewer laps get drift_s_per_lap = 0.0 (no detrending, no data).
      Consumed by fct_cliff_prediction_features to produce next_lap_degradation_jump_detrended_s
      the per-lap first-difference with this per-stint drift (fuel burn / track evolution leaking
      into the residual) removed. Diagnostic: pooled median slope ≈ -0.072 s/lap across ~5,950 stints.
    tags: [intermediate, simulation]
    meta:
      family: residual
      aggregation_scope_exemptions:
        - keys: [stint_id]
          status: accepted
          reason: >
            REGR_SLOPE over a stint's pre-cliff laps produces drift_s_per_lap, which
            exists to detrend the target. It is in EXCLUDED_LEAKAGE_COLUMNS ("C1:
            per-stint drift slope carried in base; causally encodes the target"), and
            this model is not an ancestor of any model that defines a FEATURE_COLUMN.
            Label construction, barred from X by name.
    columns:
      - name: stint_id
        description: Surrogate key combining race_year, race_id, driver_id, stint_number (grain).
        tests: [not_null]
      - name: drift_s_per_lap
        description: >
          OLS slope of driver_skill_residual_s vs lap_in_stint over pre-cliff laps (seconds per
          lap). Negative = residual trending faster through the stint. 0.0 when the stint has
          fewer than 3 pre-cliff laps.
        tests: [not_null]
