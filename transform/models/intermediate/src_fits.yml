version: 2

sources:
  - name: fits
    database: read_only
    tables:
      - name: degradation_isotonic
        meta:
          external_location: "{{ var('fits_base', '../data/fits') }}/degradation_isotonic.parquet"
        description: >
          Weighted isotonic tyre-degradation fits + modulation coefficients for the
          Degradation Simulator headline. Produced by
          tasks/coefficients/fit_degradation_isotonic.py a deterministic statistical
          fit (no ML retrain). One row per (circuit_id, era, compound, lap_in_stint).
          Isotonic base guarantees 0 monotone violations and MAE ≤ 0.5s vs raw
          obs_deg_from_fresh_p50 on the accuracy basket. Dirty-air multiplier is
          sign+significance gated (falls back to 1.0 for noisy/negative cells). Temp
          penalty uses a compound-aware headroom (softs overheat sooner). Read by
          mart_degradation_history_envelope to supply the app headline columns.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [circuit_id, era, compound, lap_in_stint]
        columns:
          - name: circuit_id
            description: Physical circuit identifier (from dim_circuits)
            tests:
              - not_null
          - name: era
            description: Regulation era pre2022 or post2022
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['pre2022', 'post2022']
          - name: compound
            description: Tyre compound (HARD/MEDIUM/SOFT/…/_all for rollup)
            tests:
              - not_null
          - name: lap_in_stint
            description: Lap number within the stint (1-based)
            tests:
              - not_null
          - name: obs_deg_from_fresh_p10_mono_s
            description: Isotonic-fitted p10 degradation from fresh tyre (s); monotone non-decreasing
            tests:
              - not_null
          - name: obs_deg_from_fresh_p50_mono_s
            description: Isotonic-fitted p50 degradation from fresh tyre (s); monotone non-decreasing
            tests:
              - not_null
          - name: obs_deg_from_fresh_p90_mono_s
            description: Isotonic-fitted p90 degradation from fresh tyre (s); monotone non-decreasing
            tests:
              - not_null
          - name: dirty_air_deg_mult
            description: >
              Dirty-air degradation multiplier in [1.0, 1.15]. Positive within-race-centred
              contrast on deg-from-fresh, sign+significance gated; 1.0 when gate fails.
            tests:
              - not_null
          - name: temp_headroom_c
            description: >
              °C of ambient_temp_delta before the compound-window overheating penalty engages.
              Softer compounds have smaller headroom.
            tests:
              - not_null
          - name: temp_penalty_s_per_deg
            description: >
              Seconds of additional degradation per °C of ambient_temp_delta past the headroom.
              Small calibrated constant (0.01 s/°C).
            tests:
              - not_null
          - name: fit_date
            description: Provenance ISO date the fit was run
          - name: data_window
            description: Provenance season span the fit covers (e.g. 2018_to_2024)
          - name: fit_method
            description: Provenance fit identifier (degradation_isotonic_v1)
          - name: git_sha
            description: Provenance short git SHA at fit time
          - name: fit_timestamp
            description: Provenance UTC timestamp the fit was written

      - name: constructor_car_fe
        meta:
          external_location: "{{ var('fits_base', '../data/fits') }}/constructor_car_fe.parquet"
        description: >
          De-biased constructor car pace (constructor×race fixed effect) fitted by
          tasks/coefficients/fit_constructor_car_fe.py a two-way FE regression
          (pace_delta_s ~ 1 | driver_id + constructor_race) on the clean lap panel.
          One row per (race_year, race_id, constructor_id). car_fe_s is the car pace
          net of driver skill (negative = faster than field). A per-build fit, not a
          curated seed, so it lives in data/fits/ (gitignored, regenerated each build)
          rather than as a CSV seed. Read by int_constructor_car_fe.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [race_year, race_id, constructor_id]
        columns:
          - name: race_year
            description: Race year (integer)
            tests:
              - not_null
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_5); matches int_lap_fuel_state.race_id
            tests:
              - not_null
          - name: constructor_id
            description: Constructor identifier (stg_laps.constructor_id, e.g. 'Ferrari')
            tests:
              - not_null
          - name: car_fe_s
            description: Constructor×race fixed effect in seconds (negative = faster than field)
            tests:
              - not_null
          - name: fit_date
            description: Provenance ISO date the fit was run
          - name: data_window
            description: Provenance season span the fit covers (e.g. 2018_to_2024)
          - name: fit_method
            description: Provenance fit identifier (constructor_car_fe_hdfe_v1)
          - name: git_sha
            description: Provenance short git SHA at fit time
          - name: fit_timestamp
            description: Provenance UTC timestamp the fit was written

      - name: constructor_car_fe_isolation
        meta:
          external_location: "{{ var('fits_base', '../data/fits') }}/constructor_car_fe_isolation.parquet"
        description: >
          Driver-isolation car term (WI-16a) fitted by
          tasks/coefficients/fit_constructor_car_fe.py --panel isolation: a two-way FE
          regression y_s ~ 1 | driver_era + constructor_race on the clean-lap panel Ω
          (int_driver_isolation_lap_panel), where y_s is the lap time with compound and
          dirty air removed and centred on the lap's field median. It is fitted on the same
          scale as the quantity the ratings subtract it from, which int_constructor_car_fe
          (fitted on pace_delta_s) is not. One row per (race_year, race_id, constructor_id)
          present in Ω. car_iso_s is the constructor×race FE re-centred to a lap-weighted
          mean of zero inside each race (negative = faster). An era that the teammate
          network does not connect falls back to a global-driver fit (car_term_source).
          A per-build fit, not a curated seed, so it lives in data/fits/ (gitignored,
          regenerated by `make car-fe-isolation-fit`). Read by
          int_constructor_car_fe_isolation.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [race_year, race_id, constructor_id]
        columns:
          - name: race_year
            description: Race year (integer)
            tests:
              - not_null
          - name: race_id
            description: FastF1 event id (e.g. 2021_8); matches int_driver_isolation_lap_panel.race_id
            tests:
              - not_null
          - name: constructor_id
            description: Constructor identifier (stg_laps.constructor_id)
            tests:
              - not_null
          - name: era
            description: Regulation era of the race, pre<era_boundary> or post<era_boundary>
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['pre2022', 'post2022']
          - name: n_laps
            description: Ω laps of this constructor in this race; the weight of the per-race re-centring
            tests:
              - not_null
          - name: car_fe_raw_s
            description: >
              The fitted constructor×race FE before re-centring, in seconds on the y_s scale.
              NULL when the cell is unidentified or was dropped as a pyfixest singleton.
          - name: car_iso_s
            description: >
              Car term in seconds, re-centred so the lap-weighted mean over the race's
              identified cells is 0. Negative = faster than the race's lap-weighted car.
              NULL when car_fe_raw_s is NULL.
          - name: car_term_source
            description: >
              driver_id (the era's driver-FE fit), unidentified (the cell is not connected
              to the rest of its race through any chain of drivers), or not_estimated
              (singleton, no FE). These are the only values fit_constructor_car_fe.py writes.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['driver_id', 'unidentified', 'not_estimated']
          - name: race_components_n
            description: >
              Number of connected components the race's constructor×race cells span under
              the driver key used. 1 = every car level in the race is comparable.
            tests:
              - not_null
          - name: connectivity_note
            description: Per-era connected-set diagnostics and the fallback decision, as logged by the fit
          - name: fit_date
            description: Provenance ISO date the fit was run
          - name: data_window
            description: Provenance season span the fit covers (e.g. 2018_to_2025)
          - name: fit_method
            description: Provenance fit identifier (constructor_car_fe_isolation_hdfe_v1)
          - name: git_sha
            description: Provenance short git SHA at fit time
          - name: fit_timestamp
            description: Provenance UTC timestamp the fit was written
