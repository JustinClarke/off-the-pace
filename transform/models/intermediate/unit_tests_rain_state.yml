version: 2

# Rain-state contract (int_lap_rain_state). The rain state of a lap is decided by
# the weather observation alone, never by whether the lap has a pace reference.
# Fixtures use year 2099 and dyadic values so nothing depends on float rounding.
unit_tests:
  # Fixtures 1-6 on the model that owns the contract. int_field_pace_curve is
  # deliberately NOT an input of int_lap_rain_state, so every lap here is, by
  # construction, classified without a pace reference.
  - name: rain_state_classified_by_weather_not_pace
    description: >
      One race, six laps. Lap 1 dry and lap 2 wet (fixtures 1 and 2: with a pace
      reference, see the int_track_evolution test below). Lap 3 dry and lap 4 wet
      with NO pace reference (fixtures 3 and 4): weather exists, so DRY / WET, not
      NO_WEATHER (fixture 6). Lap 5 has no weather observation for any car:
      NO_WEATHER with a NULL rainfall_flag, never DRY (fixture 5). Lap 1 has two
      cars with different samples (a boundary tie): one row per lap, the latest
      sample wins, so the lap stays unique (fixture 7 at the unit level).
    model: int_lap_rain_state
    given:
      - input: ref('stg_laps')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, driver_id: AAA}
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, driver_id: BBB}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, driver_id: AAA}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, driver_id: AAA}
          - {race_year: 2099, race_id: '2099_1', lap_number: 4, driver_id: AAA}
          - {race_year: 2099, race_id: '2099_1', lap_number: 5, driver_id: AAA}
      - input: ref('stg_weather')
        rows:
          - {lap_id: a1, race_year: 2099, race_id: '2099_1', lap_number: 1, driver_id: AAA, weather_session_time_s: 10.0, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false}
          - {lap_id: b1, race_year: 2099, race_id: '2099_1', lap_number: 1, driver_id: BBB, weather_session_time_s: 20.0, track_temp_c: 31.0, humidity_pct: 51.0, rainfall_flag: false}
          - {lap_id: a2, race_year: 2099, race_id: '2099_1', lap_number: 2, driver_id: AAA, weather_session_time_s: 30.0, track_temp_c: 30.0, humidity_pct: 90.0, rainfall_flag: true}
          - {lap_id: a3, race_year: 2099, race_id: '2099_1', lap_number: 3, driver_id: AAA, weather_session_time_s: 40.0, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false}
          - {lap_id: a4, race_year: 2099, race_id: '2099_1', lap_number: 4, driver_id: AAA, weather_session_time_s: 50.0, track_temp_c: 28.0, humidity_pct: 95.0, rainfall_flag: true}
    expect:
      rows:
        - {race_id: '2099_1', lap_number: 1, track_temp_c: 31.0, rainfall_flag: false, rain_state: DRY}
        - {race_id: '2099_1', lap_number: 2, track_temp_c: 30.0, rainfall_flag: true, rain_state: WET}
        - {race_id: '2099_1', lap_number: 3, track_temp_c: 30.0, rainfall_flag: false, rain_state: DRY}
        - {race_id: '2099_1', lap_number: 4, track_temp_c: 28.0, rainfall_flag: true, rain_state: WET}
        - {race_id: '2099_1', lap_number: 5, track_temp_c: null, rainfall_flag: null, rain_state: NO_WEATHER}

  # Fixtures 1 and 2 on int_track_evolution (laps WITH a pace reference), and the
  # grain guarantee: a lap with weather but a thin pace cell stays out of this
  # model (its grain and fit population are unchanged) yet is classified in
  # int_lap_rain_state, which is what the consumers read.
  - name: track_evolution_carries_rain_state_for_pace_laps
    description: >
      Lap 1 dry and lap 2 wet, both with a non-thin pace cell: DRY / rainfall_flag
      FALSE and WET / rainfall_flag TRUE (fixtures 1 and 2). Lap 3 has weather but a
      thin pace cell, so it is not a row of int_track_evolution (grain unchanged).
    model: int_track_evolution
    given:
      - input: ref('int_field_pace_curve')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, field_pace_smoothed_s: 89.5, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, field_pace_smoothed_s: null, low_sample_flag: true}
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, track_temp_c: 30.0, humidity_pct: 90.0, rainfall_flag: true, rain_state: WET}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false, rain_state: DRY}
    expect:
      rows:
        - {lap_number: 1, rain_state: DRY, rainfall_flag: false}
        - {lap_number: 2, rain_state: WET, rainfall_flag: true}

  # Consumer: the dry-only panel keeps a dry lap that has no pace reference at
  # all, drops a wet lap and a lap with no weather observation. int_field_pace_curve
  # is not an input of int_driver_race_paired_laps, and int_track_evolution is no
  # longer one either: classification does not depend on the pace reference.
  - name: dry_only_consumer_keeps_dry_lap_without_pace_reference
    description: >
      AAA and BBB (same car) run laps 1-4. Lap 1 dry, lap 2 wet, lap 3 has no
      weather observation, lap 4 dry. Only laps 1 and 4 enter the dry panel.
      No lap has a pace reference in this fixture, so lap 4 being kept is the
      regression case: a dry lap whose weather exists is restored.
    model: int_driver_race_paired_laps
    given:
      - input: ref('int_lap_fuel_state')
        rows:
          - {lap_id: a1, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 1, lap_time_s: 90.0}
          - {lap_id: a2, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 2, lap_time_s: 90.0}
          - {lap_id: a3, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 3, lap_time_s: 90.0}
          - {lap_id: a4, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 4, lap_time_s: 90.0}
          - {lap_id: b1, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 1, lap_time_s: 90.25}
          - {lap_id: b2, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 2, lap_time_s: 90.25}
          - {lap_id: b3, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 3, lap_time_s: 90.25}
          - {lap_id: b4, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 4, lap_time_s: 90.25}
      - input: ref('stg_laps')
        rows:
          - {lap_id: a1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
      - input: ref('int_event_corrections')
        rows:
          - {lap_id: a1, correction_weight: 1.0}
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, rainfall_flag: true, rain_state: WET}
          - {race_year: 2099, race_id: '2099_1', lap_number: 4, rainfall_flag: false, rain_state: DRY}
      - input: ref('int_lap_residual_decomposed')
        rows:
          - {lap_id: a1, compound_component_s: 0.5}
          - {lap_id: b1, compound_component_s: 0.5}
          - {lap_id: a4, compound_component_s: 0.5}
          - {lap_id: b4, compound_component_s: 0.5}
    expect:
      rows:
        - {driver_id: AAA, teammate_id: BBB, lap_number: 1, paired_delta_s: -0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: -0.25, tyre_adjustment_missing: false}
        - {driver_id: AAA, teammate_id: BBB, lap_number: 4, paired_delta_s: -0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: -0.25, tyre_adjustment_missing: false}
        - {driver_id: BBB, teammate_id: AAA, lap_number: 1, paired_delta_s: 0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: 0.25, tyre_adjustment_missing: false}
        - {driver_id: BBB, teammate_id: AAA, lap_number: 4, paired_delta_s: 0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: 0.25, tyre_adjustment_missing: false}
