version: 2

# WI-14b (F40, F44): fixture tests for the rating chain's sign conventions.
# dbt unit tests run the model's SQL against the hand-built rows below and
# compare the listed columns exactly. Every value is a dyadic fraction
# (0.25, 0.125, 0.375, ...) so the float arithmetic is exact and the
# comparison needs no tolerance. They run with `dbt test` / `dbt build`
# (select them alone with `dbt test --select test_type:unit`).

unit_tests:
  - name: loro_rating_is_paired_median_gap_to_teammate
    description: >
      F40 / FD5 option C. driver_skill_loro_s is the median of
      (own lap time - teammate lap time) over laps BOTH drivers ran clean,
      paired on lap_number. Negative = faster than the teammate. AAA beats
      BBB on 2 of the 3 clean shared laps (-0.25, +0.125, -0.5) so AAA is
      -0.25 and BBB exactly +0.25 (antisymmetric). AAA's lap 4 is
      downweighted (correction_weight 0.5) and lap 5 is a rain lap: both are
      out of the panel. Were they paired, the deltas would add +5.0 and +2.0
      and the median would flip to +0.125, so this also pins the clean
      filter. CCC is alone in his car: no equal-car reference, NULL rating,
      0 paired laps.
    model: int_driver_race_skill_loro
    given:
      - input: ref('int_lap_fuel_state')
        rows:
          - {lap_id: a1, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 1, lap_time_s: 90.0}
          - {lap_id: a2, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 2, lap_time_s: 90.5}
          - {lap_id: a3, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 3, lap_time_s: 91.0}
          - {lap_id: a4, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 4, lap_time_s: 95.0}
          - {lap_id: a5, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 5, lap_time_s: 92.0}
          - {lap_id: b1, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 1, lap_time_s: 90.25}
          - {lap_id: b2, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 2, lap_time_s: 90.375}
          - {lap_id: b3, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 3, lap_time_s: 91.5}
          - {lap_id: b4, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 4, lap_time_s: 90.0}
          - {lap_id: b5, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 5, lap_time_s: 90.0}
          - {lap_id: c1, race_year: 2099, race_id: '2099_1', driver_id: CCC, lap_number: 1, lap_time_s: 91.0}
          - {lap_id: c2, race_year: 2099, race_id: '2099_1', driver_id: CCC, lap_number: 2, lap_time_s: 91.0}
      - input: ref('stg_laps')
        rows:
          - {lap_id: a1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a5, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b5, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: c1, constructor_id: car_b, compound: SOFT, tyre_life: 5}
          - {lap_id: c2, constructor_id: car_b, compound: SOFT, tyre_life: 5}
      - input: ref('int_field_pace_curve')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, field_pace_smoothed_s: 90.0}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, field_pace_smoothed_s: 90.0}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, field_pace_smoothed_s: 90.0}
          - {race_year: 2099, race_id: '2099_1', lap_number: 4, field_pace_smoothed_s: 90.0}
          - {race_year: 2099, race_id: '2099_1', lap_number: 5, field_pace_smoothed_s: 90.0}
      - input: ref('int_event_corrections')
        rows:
          - {lap_id: a4, correction_weight: 0.5}
      # Rain state comes from the weather observation (int_lap_rain_state), not
      # from the pace reference. Laps 1-4 are dry, lap 5 is wet. A lap with no
      # row here has no weather reading (NO_WEATHER) and is not in the dry panel.
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 4, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 5, rainfall_flag: true, rain_state: WET}
      - input: ref('race_to_track')
        rows:
          - {race_id: '2099_1', track_id: fixture_grand_prix}
      - input: ref('int_constructor_car_fe')
        rows:
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, car_fe_s: 0.0}
      # TX-01: the pairing moved to int_driver_race_paired_laps. These are the
      # rows that model produces from the fixture above (pinned by
      # paired_laps_pair_clean_laps_on_lap_number below).
      - input: ref('int_driver_race_paired_laps')
        rows:
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: AAA, adjusted_paired_delta_s: -0.25}
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: AAA, adjusted_paired_delta_s: 0.125}
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: AAA, adjusted_paired_delta_s: -0.5}
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: BBB, adjusted_paired_delta_s: 0.25}
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: BBB, adjusted_paired_delta_s: -0.125}
          - {race_year: 2099, race_id: '2099_1', constructor_id: car_a, driver_id: BBB, adjusted_paired_delta_s: 0.5}
    expect:
      rows:
        - {driver_id: AAA, driver_skill_loro_s: -0.25, paired_lap_count: 3, clean_lap_count: 3}
        - {driver_id: BBB, driver_skill_loro_s: 0.25, paired_lap_count: 3, clean_lap_count: 4}
        - {driver_id: CCC, driver_skill_loro_s: null, paired_lap_count: 0, clean_lap_count: 2}

  - name: paired_laps_pair_clean_laps_on_lap_number
    description: >
      TX-01. int_driver_race_paired_laps holds the rows behind driver_skill_loro_s:
      own lap time minus the same-car teammate's on the same lap number, over laps
      both ran clean, plus the tyre-adjusted gap (paired_delta_s minus own-minus-teammate
      compound_component_s; NULL when either is unknown). Same fixture as loro_rating_is_paired_median_gap_to_teammate.
      AAA's lap 4 (correction_weight 0.5) and lap 5 (rain) are out of the panel, so
      only laps 1-3 pair; BBB's rows are AAA's with the sign flipped; CCC is alone
      in his car and has no rows.
    model: int_driver_race_paired_laps
    given:
      - input: ref('int_lap_fuel_state')
        rows:
          - {lap_id: a1, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 1, lap_time_s: 90.0}
          - {lap_id: a2, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 2, lap_time_s: 90.5}
          - {lap_id: a3, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 3, lap_time_s: 91.0}
          - {lap_id: a4, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 4, lap_time_s: 95.0}
          - {lap_id: a5, race_year: 2099, race_id: '2099_1', driver_id: AAA, lap_number: 5, lap_time_s: 92.0}
          - {lap_id: b1, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 1, lap_time_s: 90.25}
          - {lap_id: b2, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 2, lap_time_s: 90.375}
          - {lap_id: b3, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 3, lap_time_s: 91.5}
          - {lap_id: b4, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 4, lap_time_s: 90.0}
          - {lap_id: b5, race_year: 2099, race_id: '2099_1', driver_id: BBB, lap_number: 5, lap_time_s: 90.0}
          - {lap_id: c1, race_year: 2099, race_id: '2099_1', driver_id: CCC, lap_number: 1, lap_time_s: 91.0}
          - {lap_id: c2, race_year: 2099, race_id: '2099_1', driver_id: CCC, lap_number: 2, lap_time_s: 91.0}
      - input: ref('stg_laps')
        rows:
          - {lap_id: a1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: a5, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b1, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b2, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b3, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b4, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: b5, constructor_id: car_a, compound: SOFT, tyre_life: 5}
          - {lap_id: c1, constructor_id: car_b, compound: SOFT, tyre_life: 5}
          - {lap_id: c2, constructor_id: car_b, compound: SOFT, tyre_life: 5}
      - input: ref('int_event_corrections')
        rows:
          - {lap_id: a4, correction_weight: 0.5}
      # Rain state comes from the weather observation (int_lap_rain_state), not
      # from the pace reference. Laps 1-4 are dry, lap 5 is wet. A lap with no
      # row here has no weather reading (NO_WEATHER) and is not in the dry panel.
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 4, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 5, rainfall_flag: true, rain_state: WET}
      # Tyre component (compound_component_s). Lap 1: equal, so no adjustment.
      # Lap 2: b2 has no value (unknown tyre), so the adjusted gap is NULL, not
      # the raw gap. Lap 3: BBB's tyre is 0.25 s cheaper, so AAA's -0.5 s gap
      # becomes -0.5 - (0.5 - 0.25) = -0.75 s.
      - input: ref('int_lap_residual_decomposed')
        rows:
          - {lap_id: a1, compound_component_s: 0.5}
          - {lap_id: a2, compound_component_s: 0.5}
          - {lap_id: a3, compound_component_s: 0.5}
          - {lap_id: b1, compound_component_s: 0.5}
          - {lap_id: b2, compound_component_s: null}
          - {lap_id: b3, compound_component_s: 0.25}
    expect:
      rows:
        - {driver_id: AAA, teammate_id: BBB, lap_number: 1, paired_delta_s: -0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: -0.25, tyre_adjustment_missing: false}
        - {driver_id: AAA, teammate_id: BBB, lap_number: 2, paired_delta_s: 0.125, tyre_component_diff_s: null, adjusted_paired_delta_s: null, tyre_adjustment_missing: true}
        - {driver_id: AAA, teammate_id: BBB, lap_number: 3, paired_delta_s: -0.5, tyre_component_diff_s: 0.25, adjusted_paired_delta_s: -0.75, tyre_adjustment_missing: false}
        - {driver_id: BBB, teammate_id: AAA, lap_number: 1, paired_delta_s: 0.25, tyre_component_diff_s: 0.0, adjusted_paired_delta_s: 0.25, tyre_adjustment_missing: false}
        - {driver_id: BBB, teammate_id: AAA, lap_number: 2, paired_delta_s: -0.125, tyre_component_diff_s: null, adjusted_paired_delta_s: null, tyre_adjustment_missing: true}
        - {driver_id: BBB, teammate_id: AAA, lap_number: 3, paired_delta_s: 0.5, tyre_component_diff_s: -0.25, adjusted_paired_delta_s: 0.75, tyre_adjustment_missing: false}

  - name: circuit_affinity_is_drawn_as_deviation_from_driver_mean
    description: >
      F44. AAA beats his teammate at every circuit (every level negative), so
      drawing the level paints his whole row green. The affinity the page
      draws is shrunk_affinity_s - global_driver_mean_s: better than his own
      average at Circuit X (negative), worse at Circuit Y (positive).
      Shrinkage is toward the driver's own mean (-0.375) with 5 virtual
      races: X = (3 x -0.5 + 5 x -0.375) / 8 = -0.421875, Y = (3 x -0.25 +
      5 x -0.375) / 8 = -0.328125.
    model: int_driver_circuit_affinity
    given:
      - input: ref('int_driver_race_skill_loro')
        rows:
          - {driver_id: AAA, race_year: 2097, race_id: '2097_1', circuit_key: x_grand_prix, driver_skill_loro_s: -0.5, clean_lap_count: 50}
          - {driver_id: AAA, race_year: 2098, race_id: '2098_1', circuit_key: x_grand_prix, driver_skill_loro_s: -0.5, clean_lap_count: 50}
          - {driver_id: AAA, race_year: 2099, race_id: '2099_1', circuit_key: x_grand_prix, driver_skill_loro_s: -0.5, clean_lap_count: 50}
          - {driver_id: AAA, race_year: 2097, race_id: '2097_2', circuit_key: y_grand_prix, driver_skill_loro_s: -0.25, clean_lap_count: 50}
          - {driver_id: AAA, race_year: 2098, race_id: '2098_2', circuit_key: y_grand_prix, driver_skill_loro_s: -0.25, clean_lap_count: 50}
          - {driver_id: AAA, race_year: 2099, race_id: '2099_2', circuit_key: y_grand_prix, driver_skill_loro_s: -0.25, clean_lap_count: 50}
      - input: ref('circuit_reference')
        rows:
          - {circuit_key: x_grand_prix, circuit_name: Circuit X}
          - {circuit_key: y_grand_prix, circuit_name: Circuit Y}
    expect:
      rows:
        - {driver_id: AAA, circuit_name: Circuit X, shrunk_affinity_s: -0.421875, global_driver_mean_s: -0.375, affinity_vs_driver_mean_s: -0.046875}
        - {driver_id: AAA, circuit_name: Circuit Y, shrunk_affinity_s: -0.328125, global_driver_mean_s: -0.375, affinity_vs_driver_mean_s: 0.046875}

  # Rubber slope observability and rain_state for int_track_evolution. Every
  # value is a dyadic fraction so the OLS arithmetic is exact. int_field_pace_curve
  # is mocked with only the columns the model reads.
  - name: track_evolution_rubber_status_and_rain_state
    description: >
      Four races on one model. R1 (laps 1-3, pace 90.0, 89.5, 89.0): raw slope
      -0.5, MEASURED, published = raw. R2 (pace 90.0, 90.5, 91.0): raw slope
      +0.5, CLAMPED_POSITIVE, published 0.0 and every rubber_component_s 0.0.
      R3 (flat 90.0): measured zero stays 0.0 and is MEASURED. R4 (one lap):
      fewer than 2 distinct laps, so raw and published slope are NULL,
      INSUFFICIENT_LAPS (rubber_component_s is checked in the next test and by
      assert_track_evolution_rubber_status_consistent; the zero-slope components are
      signed zeros, which the fixture comparison cannot tell apart). Weather: R1 lap 1
      dry, lap 2 wet, lap 3 has no weather row; the missing row is NO_WEATHER
      with a NULL rainfall_flag, never DRY.
    model: int_track_evolution
    given:
      - input: ref('int_field_pace_curve')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, field_pace_smoothed_s: 89.5, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, field_pace_smoothed_s: 89.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_2', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_2', lap_number: 2, field_pace_smoothed_s: 90.5, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_2', lap_number: 3, field_pace_smoothed_s: 91.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_3', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_3', lap_number: 2, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_3', lap_number: 3, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_4', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          # A thin cell is not a row of this model (grain preserved, not padded).
          - {race_year: 2099, race_id: '2099_4', lap_number: 2, field_pace_smoothed_s: null, low_sample_flag: true}
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false, rain_state: DRY}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: true, rain_state: WET}
    expect:
      rows:
        - {race_id: '2099_1', lap_number: 1, rain_state: DRY, rainfall_flag: false, rubber_slope_raw_s_per_lap: -0.5, rubber_slope_s_per_lap: -0.5, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_1', lap_number: 2, rain_state: WET, rainfall_flag: true, rubber_slope_raw_s_per_lap: -0.5, rubber_slope_s_per_lap: -0.5, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_1', lap_number: 3, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: -0.5, rubber_slope_s_per_lap: -0.5, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_2', lap_number: 1, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.5, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: CLAMPED_POSITIVE}
        - {race_id: '2099_2', lap_number: 2, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.5, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: CLAMPED_POSITIVE}
        - {race_id: '2099_2', lap_number: 3, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.5, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: CLAMPED_POSITIVE}
        - {race_id: '2099_3', lap_number: 1, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.0, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_3', lap_number: 2, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.0, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_3', lap_number: 3, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: 0.0, rubber_slope_s_per_lap: 0.0, rubber_fit_lap_count: 3, rubber_status: MEASURED}
        - {race_id: '2099_4', lap_number: 1, rain_state: NO_WEATHER, rainfall_flag: null, rubber_slope_raw_s_per_lap: null, rubber_slope_s_per_lap: null, rubber_fit_lap_count: 1, rubber_status: INSUFFICIENT_LAPS}

  - name: track_evolution_no_field_base_rows_have_null_components
    description: >
      A row that reaches the model with no field-pace base (field_pace_smoothed_s
      NULL on a non-thin cell; defensive, since thin cells are filtered upstream
      of the fit) is NO_FIELD_BASE with NULL rubber_component_s and NULL
      track_state_index_s, and it does not enter the fit: the two measured laps
      still give slope -0.5 over rubber_fit_lap_count 2.
    model: int_track_evolution
    given:
      - input: ref('int_field_pace_curve')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, field_pace_smoothed_s: 90.0, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 2, field_pace_smoothed_s: 89.5, low_sample_flag: false}
          - {race_year: 2099, race_id: '2099_1', lap_number: 3, field_pace_smoothed_s: null, low_sample_flag: false}
      - input: ref('int_lap_rain_state')
        rows:
          - {race_year: 2099, race_id: '2099_1', lap_number: 1, track_temp_c: 30.0, humidity_pct: 50.0, rainfall_flag: false, rain_state: DRY}
    expect:
