version: 2

models:
  - name: fct_driver_skill_features
    description: >
      Race-grain driver skill feature table for the driver skill extraction model.
      One row per (race_year, race_id, driver_id). Aggregates clean-lap residuals,
      synthetic-teammate deltas, constructor pace indices, and circuit context.
      Clean-lap filter: correction_weight = 1.0 AND anomaly_class NOT IN ('mistake','conditions')
      AND is_rain_lap = FALSE.
    config:
      contract:
        enforced: true
    tags: [marts]
    columns:
      - name: driver_race_id
        description: Surrogate PK   hash of (race_year, race_id, driver_id)
        data_type: varchar
        constraints:
          - type: not_null
          - type: unique
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM)
        data_type: varchar
        constraints:
          - type: not_null
      - name: race_year
        description: Season year
        data_type: integer
        constraints:
          - type: not_null
      - name: race_id
        description: Race identifier (e.g. 2021_19)
        data_type: varchar
        constraints:
          - type: not_null
      - name: constructor_id
        description: Team name as used in FastF1
        data_type: varchar
      - name: circuit_key
        description: Stable circuit identifier matching dim_circuits
        data_type: varchar
      - name: pu_family
        description: Power unit family (e.g. mercedes_pu, honda_pu)
        data_type: varchar
      - name: driver_debut_year
        description: First season in the dataset
        data_type: integer
      - name: driver_residual_mean_s
        description: Mean driver skill residual over clean laps. Negative = faster than field.
        data_type: double
      - name: driver_residual_stddev_s
        description: Stddev of driver skill residual over clean laps
        data_type: double
      - name: driver_residual_median_s
        description: Median driver skill residual over clean laps
        data_type: double
      - name: clean_lap_count
        description: Number of laps passing the clean-lap filter
        data_type: bigint
        constraints:
          - type: not_null
      - name: driver_skill_proxy_mean_s
        description: >
          Weighted mean of synthetic-teammate delta over clean laps.
          Positive = ego driver faster than synthetic teammate.
        data_type: double
      - name: pair_quality_weight_mean
        description: Mean pair quality weight (higher = more consistent comparison)
        data_type: double
      - name: teammate_available_flag
        description: TRUE if a teammate comparison was available for at least one lap
        data_type: boolean
        constraints:
          - type: not_null
      - name: strategic_divergence_share
        description: Fraction of clean laps where strategic_divergence_flag = TRUE
        data_type: double
        constraints:
          - type: not_null
      - name: constructor_power_pace_index_final
        description: EW-smoothed constructor power-sector pace index at race end
        data_type: double
      - name: constructor_aero_pace_index_final
        description: EW-smoothed constructor aero-sector pace index at race end
        data_type: double
      - name: constructor_index_confidence_final
        description: Confidence score (0–1) for constructor pace index at race end
        data_type: double
      - name: race_wet_flag
        description: TRUE if any rainfall was detected during the race
        data_type: boolean
        constraints:
          - type: not_null
      - name: circuit_energy_index
        description: Track energy index from dim_circuits (proxy for power sensitivity)
        data_type: double
      - name: circuit_abrasiveness_index
        description: Track abrasiveness index from dim_circuits (proxy for tyre wear)
        data_type: integer
      - name: total_race_laps
        description: Total laps recorded for this driver in this race
        data_type: bigint
        constraints:
          - type: not_null
      - name: ml_eligible_lap_share
        description: Fraction of driver's laps with usable_for_modelling = TRUE
        data_type: double
        constraints:
          - type: not_null
    tests:
      - dbt_expectations.expect_column_values_to_be_between:
          column_name: ml_eligible_lap_share
          arguments:
            min_value: 0
            max_value: 1

  - name: fct_cliff_prediction_features
    description: >
      Lap-grain feature table for the tyre cliff XGBoost model.
      One row per valid race lap. Target is next_lap_degradation_jump_s
      (NULL on the last lap of each stint). Excludes synthetic-teammate
      features to prevent causal label leakage into a predictive model.
    config:
      contract:
        enforced: true
    tags: [marts]
    columns:
      - name: lap_id
        description: Surrogate PK from stg_laps
        data_type: varchar
        constraints:
          - type: not_null
          - type: unique
      - name: stint_id
        description: Stint surrogate key
        data_type: varchar
        constraints:
          - type: not_null
      - name: race_year
        description: Season year
        data_type: integer
        constraints:
          - type: not_null
      - name: race_id
        description: Race identifier
        data_type: varchar
        constraints:
          - type: not_null
      - name: circuit_key
        description: Circuit identifier (track_id via race_to_track); L0-1 cohort key and predictions output column
        data_type: varchar
        constraints:
          - type: not_null
      - name: driver_id
        description: FastF1 three-letter driver code
        data_type: varchar
        constraints:
          - type: not_null
      - name: constructor_id
        description: Team name
        data_type: varchar
      - name: lap_number
        description: Lap number within race
        data_type: integer
        constraints:
          - type: not_null
      - name: lap_in_stint
        description: Lap position within current tyre stint
        data_type: bigint
      - name: age_in_stint
        description: Tyre age in laps (may differ from lap_in_stint for used tyres)
        data_type: integer
      - name: compound
        description: Tyre compound (SOFT, MEDIUM, HARD, etc.)
        data_type: varchar
      - name: compound_grip_peak
        description: Fitted peak grip coefficient for this compound × circuit × season
        data_type: double
      - name: compound_wear_gradient
        description: Fitted wear gradient (s/lap) for this compound × circuit × season
        data_type: double
      - name: compound_optimal_temp_low
        description: Lower bound of optimal operating temperature window (°C)
        data_type: double
      - name: compound_optimal_temp_high
        description: Upper bound of optimal operating temperature window (°C)
        data_type: double
      - name: compound_cliff_onset_laps
        description: Expected lap age at cliff onset for this compound × circuit × season
        data_type: double
      - name: compound_cliff_severity
        description: Fitted cliff severity (s/lap post-cliff) for this compound × circuit × season
        data_type: double
      - name: push_residual
        description: Lap-level push load residual from int_lap_thermal_proxy
        data_type: double
      - name: cumulative_push_load_surface
        description: EW cumulative push load (τ≈3 laps) for tyre surface
        data_type: double
      - name: cumulative_push_load_bulk
        description: EW cumulative push load (τ≈5 laps) for tyre bulk
        data_type: double
      - name: dirty_air_share_lap
        description: Fraction of this lap spent in dirty air (sector 2)
        data_type: decimal(2,1)
        constraints:
          - type: not_null
      - name: dirty_air_thermal_load_surface
        description: EW dirty air thermal load on tyre surface
        data_type: double
        constraints:
          - type: not_null
      - name: dirty_air_thermal_load_bulk
        description: EW dirty air thermal load on tyre bulk
        data_type: double
        constraints:
          - type: not_null
      - name: air_state_dominant
        description: Dominant air state this lap (free_air, tow_zone, drs_train, dirty_air)
        data_type: varchar
        constraints:
          - type: not_null
      - name: expected_compound_pace_s
        description: Model-expected compound pace contribution from int_compound_cliff_predicted
        data_type: double
      - name: expected_degradation_rate_s_per_lap
        description: Model-expected degradation rate (s/lap) at current tyre age
        data_type: double
      - name: cliff_onset_passed
        description: TRUE if tyre has passed its fitted cliff onset lap
        data_type: boolean
      - name: laps_past_cliff
        description: Laps elapsed since cliff onset (0 if not passed)
        data_type: double
      - name: ambient_temp_delta
        description: Difference between current ambient temp and optimal temp midpoint (°C)
        data_type: double
      - name: track_energy_index
        description: Track energy index from dim_circuits
        data_type: double
      - name: circuit_abrasiveness_index
        description: Track abrasiveness index from dim_circuits
        data_type: integer
      - name: n_gear_changes
        description: Gear changes this lap (telemetry powertrain group; NULL if no telemetry)
        data_type: integer
      - name: mean_rpm
        description: Mean engine RPM this lap
        data_type: double
      - name: max_rpm
        description: Max engine RPM this lap
        data_type: double
      - name: pct_full_throttle
        description: Fraction of the lap at full throttle (0–1)
        data_type: double
      - name: pct_drs_active
        description: Fraction of the lap with DRS active (0–1)
        data_type: double
      - name: short_shift_index
        description: Fraction of upshifts taken below 92% of lap-max RPM (short-shifting)
        data_type: double
      - name: mid_corner_speed_loss_kph
        description: >
          Within-stint drift: early-stint baseline minus this lap's mean local-minimum (corner-apex)
          speed. Positive = slow points getting slower vs own baseline. NULL if no telemetry.
        data_type: double
      - name: traction_wheelspin_proxy
        description: Share of corner-exit full-throttle samples with non-positive accel (wheelspin proxy, 0–1)
        data_type: double
      - name: throttle_trace_decay
        description: Within-stint drift of full-throttle fraction (early-stint baseline minus this lap)
        data_type: double
      - name: braking_point_drift_m
        description: >
          Within-stint drift: early-stint baseline minus this lap's mean brake-onset distance.
          Positive = braking earlier than own baseline. NULL if no telemetry.
        data_type: double
      - name: lift_coast_share
        description: >
          Off-throttle, non-braking, decelerating share of the lap (0–1). CONFOUND with fuel-saving  
          consumed alongside int_lap_fuel_state, not equated with degradation.
        data_type: double
      - name: fuel_mass_kg
        description: Estimated fuel mass on board at this lap
        data_type: double
      - name: event_flag_any
        description: TRUE if any race event contaminated this lap (SC, VSC, restart, etc.)
        data_type: boolean
        constraints:
          - type: not_null
      - name: cliff_candidate_flag
        description: TRUE if this lap shows a MAD-score cliff spike consistent with tyre cliff
        data_type: boolean
      - name: anomaly_class
        description: Anomaly classification (clean_cliff, mistake, event_driven, conditions, normal)
        data_type: varchar
      - name: is_rain_lap
        description: TRUE if rainfall was detected on this lap
        data_type: boolean
      - name: surface_bulk_ratio
        description: >
          C3 feature (42nd): ratio of surface thermal load to total thermal load
          (cumulative_push_load_surface / (surface + bulk)). NULL when both loads are zero.
          Helps the model distinguish early-stint surface-dominated warming from bulk-driven
          structural degradation.
        data_type: double
      - name: survival_weight
        description: >
          C2 metadata (not a feature): IPW weight = 1 / P(stint reaches lap_in_stint | compound),
          clipped to [0.25, 4]. Used by train.py for quantile regressor sample weighting to
          correct for survivorship bias (degraded stints pitted early are under-represented
          at high lap_in_stint values).
        data_type: double
      - name: next_lap_degradation_jump_detrended_s
        description: >
          C1 PRIMARY target: per-lap change in driver skill residual with per-stint linear
          drift removed. drift_s_per_lap (OLS slope on pre-cliff laps, Step 0 median -0.072
          s/lap) is subtracted so fuel-lightening and track-evolution leaks are cancelled.
          Bounded [-10, 10]. NULL on last lap of each stint.
        data_type: double
      - name: next_lap_degradation_jump_s
        description: >
          Legacy target (undetrended): change in driver skill residual on the next lap, bounded
          [-10, 10]. Kept alongside the detrended primary for gate comparison. NULL on last lap.
        data_type: double
      - name: next_3_lap_cumulative_jump_s
        description: >
          Cumulative degradation jump over the next 3 laps (sum of residuals k=1..3 minus
          current residual). NULL when fewer than 3 laps remain in stint. GREATEST floored at 0.
        data_type: double
      - name: next_5_lap_cumulative_jump_s
        description: >
          Cumulative degradation jump over the next 5 laps. NULL when fewer than 5 remain.
        data_type: double
      - name: laps_until_cliff_class
        description: >
          Bucket: 0_to_2, 3_to_5, 6_plus, none_in_stint. Based on >1.0s cumulative jump threshold
          looking ahead up to 6 laps. NULL on last lap.
        data_type: varchar
      - name: is_training_eligible
        description: TRUE if this lap is suitable for model training (age_in_stint > 3, no anomaly)
        data_type: boolean
        constraints:
          - type: not_null
    tests:
      - dbt_expectations.expect_column_values_to_be_between:
          column_name: next_lap_degradation_jump_s
          arguments:
            min_value: -10
            max_value: 10
          config:
            where: "next_lap_degradation_jump_s IS NOT NULL"
            warn_if: ">0"
            error_if: ">0"
      - dbt_expectations.expect_column_values_to_be_between:
          column_name: next_lap_degradation_jump_detrended_s
          arguments:
            min_value: -10
            max_value: 10
          config:
            where: "next_lap_degradation_jump_detrended_s IS NOT NULL"
            warn_if: ">0"
            error_if: ">0"

  - name: fct_stint_features
    description: >
      One row per stint. Pit strategy feature table: compound, stint length, tyre age progression,
      thermal load buildup, cumulative dirty air tax, cliff onset lap, and pace degradation slope.
      Used to model pit strategy decision: is it time to box? Includes tyre_management_score and
      pit_decision_class derived from int_pit_strategy_value.
    tags: [marts, feature_engineering]
    columns:
      - name: stint_id
        description: PK from int_stint_geometry
        tests: [not_null, unique]
      - name: driver_id
        tests: [not_null]
      - name: race_id
        tests: [not_null]
      - name: race_year
        tests: [not_null]
      - name: stint_length_laps
        description: Total laps in this stint
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100
      - name: compound
        description: Tyre compound for this stint
      - name: starting_tyre_age_laps
        description: Tyre age at the start of this stint (before first lap)
      - name: cumulative_thermal_load_end
        description: EW cumulative thermal load at the end of the stint
      - name: cumulative_dirty_air_tax_s
        description: Sum of dirty air tax across all laps in the stint
      - name: cliff_lap_in_stint
        description: Lap position within stint where cliff is first detected (NULL if no cliff)
      - name: tyre_management_score
        description: "Tyre management score: actual end-of-stint driver residual normalised against the optimal pit opportunity cost. Low score = good management."
      - name: end_of_stint_pace_falloff_s_per_lap
        description: OLS slope of driver_skill_residual_s over last 3 laps. NULL when short_stint_flag = TRUE.
      - name: short_stint_flag
        description: TRUE when stint_length_laps < 3 (slope is NULL/unreliable)
        tests: [not_null]
      - name: pit_decision_class
        description: "Pit strategy decision verdict from int_pit_strategy_value (optimal / overran / undercut_forced / early)."

  - name: fct_ghost_car_pace
    description: >
      One row per (ego_driver, host_constructor, race, lap). "What if" lap times: recombines
      ego driver's skill (residual) with host constructor's car pace. predicted_lap_time_s = ego skill + host car.
      Degenerate check: ego == host → predicted == actual. Powers "ghost car" simulator: replay with different cars.
    tags: [marts, simulation, ghost_car]
    columns:
      - name: ghost_id
        description: Surrogate PK = MD5(ego_driver_id || host_constructor_id || race_id || lap_number)
        tests: [not_null, unique]
      - name: predicted_lap_time_s
        description: Recombined lap time using ego skill + host constructor pace.
        tests: [not_null]
      - name: actual_lap_time_s
        description: Observed actual lap time for the ego driver.
        tests: [not_null]
      - name: delta_vs_actual_lap_s
        description: predicted_lap_time_s minus actual_lap_time_s. 0 when ego == host.
        tests: [not_null]
      - name: deg_interaction_s
        description: >
          Transform v0.2 Fix 1: (host deg slope - ego deg slope) x age_in_stint, slopes from
          int_constructor_deg_sensitivity at the ego lap's (compound, season). The only
          host-dependent term that varies within a race, so it is what lets different hosts
          produce different driver orders. Exactly 0 when ego == host; 0 when no cell exists
          (wet compounds / low-sample = field-average degradation).
        tests: [not_null]
      - name: host_deg_slope_s_per_lap
        description: Host constructor's deg slope for the ego lap's compound; 0 when no cell.
        tests: [not_null]
      - name: ego_deg_slope_s_per_lap
        description: Ego constructor's deg slope for the ego lap's compound; 0 when no cell.
        tests: [not_null]
      - name: cliff_interaction_s
        description: >
          Transform v0.2 Fix 2: severity x [hinge(host) - hinge(ego)] where
          hinge(c) = GREATEST(0, age - field_onset - cliff_onset_shift(c)). The nonlinear
          host-dependent term: it only fires once tyres approach/pass the cliff, reordering
          drivers on long stints. Exactly 0 when ego == host. Guardrail-clipped to +/-2 s.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -2.0
                max_value: 2.0
      - name: host_cliff_shift_laps
        description: Host constructor's cliff-onset shift (laps) for the ego lap's compound; 0 when no cell.
        tests: [not_null]
      - name: ego_cliff_shift_laps
        description: Ego constructor's cliff-onset shift (laps) for the ego lap's compound; 0 when no cell.
        tests: [not_null]
      - name: recombination_confidence
        description: >
          Continuous confidence in recombination [0, 1] = host_obs_factor
          (panel_obs / (panel_obs + 50)) × the lap's correction_weight. Degrades smoothly
          when the host has sparse panel data or the lap was soft-down-weighted.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: host_constructor_pace_se_s
        description: >
          Fix 3 SE-propagation ingredient: SE of the host constructor's structural pace
          (0 when no panel cell). Aggregated into predicted_mean_lap_se_s downstream; cancels
          in within-scenario ordering since every driver shares the host car.
        tests: [not_null]
      - name: host_deg_slope_sd_s_per_lap
        description: "Fix 3: posterior sd of the host deg slope for the ego lap's compound; 0 when no cell."
        tests: [not_null]
      - name: ego_deg_slope_sd_s_per_lap
        description: "Fix 3: posterior sd of the ego deg slope for the ego lap's compound; 0 when no cell."
        tests: [not_null]
      - name: host_cliff_shift_se_laps
        description: "Fix 3: SE (laps) of the host cliff-onset shift; 0 when no cell."
        tests: [not_null]
      - name: ego_cliff_shift_se_laps
        description: "Fix 3: SE (laps) of the ego cliff-onset shift; 0 when no cell."
        tests: [not_null]
      - name: host_cliff_active
        description: "Fix 3: 1.0 when the host car is past its shifted cliff onset on this lap, else 0.0."
        tests: [not_null]
      - name: ego_cliff_active
        description: "Fix 3: 1.0 when the ego car is past its shifted cliff onset on this lap, else 0.0."
        tests: [not_null]

  - name: fct_ghost_race_finish
    description: >
      One row per (host_constructor, ego_driver, race). Projects finishing position if ego
      driver raced in host constructor's car, ranked by predicted MEAN lap pace (invariant to
      lap count, so DNF / partial runs are ranked fairly and flagged via is_short_run).
      Filtered to recombination_confidence ≥ 0.3. Powers "what if" race outcome scenarios.
    tags: [marts, simulation, ghost_car]
    columns:
      - name: ghost_race_id
        description: Surrogate PK = MD5(race_year || race_id || ego_driver_id || host_constructor_id)
        tests: [not_null, unique]
      - name: is_self_scenario
        description: True when ego driver is placed in their own constructor's car (degenerate identity).
        tests: [not_null]
      - name: predicted_finish_position
        description: Projected finish position within this host-constructor scenario (ranked by mean pace).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 25
      - name: actual_finish_position
        description: >
          Actual finishing position. §5.4: sourced from official classified results
          (stg_results) classified finishers get their official position, retirements
          get NULL. Falls back to the legacy last-valid-lap position only for races not
          yet in stg_results during the partial v0.2 backfill (see finish_from_results).
      - name: actual_is_dnf
        description: True when official results classify the driver as a retirement (NULL position). FALSE when results absent.
      - name: actual_dnf_cause
        description: Coarse DNF cause from stg_results ('racing'/'mechanical'/'non_classified'); NULL for finishers or races without results.
      - name: finish_from_results
        description: True when actual_finish_position came from official classified results; False when it fell back to the lap-derived position.
      - name: delta_vs_actual_position
        description: >
          Projected minus actual finish position. Negative = would have finished higher.
          NULL when the driver has no real finishing position (DNF).
      - name: predicted_mean_lap_s
        description: Mean predicted lap time across counted laps; the ranking key.
        tests: [not_null]
      - name: lap_coverage
        description: laps_counted / race_distance_laps in [0,1]; fraction of the race the driver contributes.
      - name: is_short_run
        description: True when lap_coverage < ghost_short_run_threshold (default 0.5) DNF / partial run.
        tests: [not_null]
      - name: avg_recombination_confidence
        description: >
          Legacy coverage-weighted lap confidence (n/(n+50) heuristic × sqrt coverage).
          Retained one release for app diffing; superseded by the Fix 3 SE columns below.
      - name: predicted_mean_lap_se_s
        description: >
          Fix 3: marginal standard error (seconds) of predicted_mean_lap_s, propagating
          host structural-pace SE, host/ego deg-slope posterior sds, host/ego cliff-shift
          SEs (scaled by tyre-age and past-cliff exposure), and the finite-sample SE of the
          lap mean. Includes the host-pace term that cancels in within-scenario ordering.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 30
      - name: p_beats_next
        description: >
          Fix 3: probability this driver finishes ahead of the driver ranked immediately
          below it in this scenario, under a normal approximation on the pairwise pace gap
          (host structural pace cancels). NULL for the last-ranked driver (no one below).
          ≥ 0.5 by construction since the driver above always has the lower predicted pace.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: finish_pos_se
        description: >
          Fix 3: standard error of the projected finish position the Poisson-binomial sd
          of the number of drivers predicted ahead (sqrt of sum p_k(1-p_k) over pairwise
          order probabilities). 0 when the scenario has a single driver.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 25

  - name: mart_corner_skill_driver
    description: >
      Ghost-car-style driver corner skill ranking. Grain: (race_year, driver_id).
      Estimates driver skill as their deviation from their car's average corner geometry
      (braking point, apex speed, throttle point), converts to seconds, and z-scores
      each phase across the field so all three contribute equally to corner_skill_index.
      SC / VSC / pit / inaccurate laps are excluded before car averages are formed.
      Negative values = faster. corner_skill_index = sum of three z-scores; lower = faster.
    tags: [marts]
    columns:
      - name: race_year
        description: Season year
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM)
        tests: [not_null]
      - name: constructor_id
        description: Driver's team for the season (ANY_VALUE may vary for mid-season changes)
        tests: [not_null]
      - name: braking_skill_s
        description: Mean braking deviation from car average (seconds). Negative = earlier brake = faster.
        tests: [not_null]
      - name: mid_corner_skill_s
        description: Mean apex speed deviation from car average (seconds). Negative = higher apex speed = faster.
        tests: [not_null]
      - name: exit_skill_s
        description: Mean throttle-point deviation from car average (seconds). Negative = earlier throttle = faster.
        tests: [not_null]
      - name: braking_skill_z
        description: braking_skill_s standardised within season (zero mean, unit variance).
        tests: [not_null]
      - name: mid_corner_skill_z
        description: mid_corner_skill_s standardised within season.
        tests: [not_null]
      - name: exit_skill_z
        description: exit_skill_s standardised within season.
        tests: [not_null]
      - name: corner_skill_index
        description: >
          Sum of the three z-scores. Lower = faster driver in corner skill.
          Mid-season replacements with few races can reach ±9 because the car baseline
          is dominated by the full-season driver; this is expected behaviour.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -12
                max_value: 12
      - name: mapped_corners
        description: Number of corner observations used in the season aggregate (≥ 100).
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [race_year, driver_id]

  - name: mart_degradation_history_envelope
    description: >
      Pre-aggregated historical stint envelope for the Degradation Simulator.
      Grain: (circuit_id, era, compound, lap_in_stint). For each physical circuit ×
      regulation era × compound, captures at every lap-in-stint the observed fuel-removed
      pace distribution (p10/p50/p90 of weight_corrected_lap_time) and the corresponding
      tyre-degradation-from-fresh band (the same minus the fresh-tyre anchor ref_green_pace_s).
      A compound='_all' rollup is emitted for fallback. Clean laps only
      (correction_weight = 1, not SC/VSC, not major outlier); cells with < 3 observations dropped.
    tags: [marts]
    columns:
      - name: circuit_id
        description: Physical circuit identifier (slug of circuit_name).
        tests: [not_null]
      - name: circuit_name
        description: Canonical display name for the circuit.
        tests: [not_null]
      - name: era
        description: Regulation era 'pre2022' (2018–2021) or 'post2022' (2022–2024).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pre2022', 'post2022']
      - name: compound
        description: Tyre compound code, or '_all' for the cross-compound rollup.
        tests: [not_null]
      - name: lap_in_stint
        description: Lap number within the stint (1-based).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 50
      - name: n_observations
        description: Clean-lap count behind this cell (≥ 3).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 3
      - name: ref_green_pace_s
        description: Fuel-removed fresh-tyre anchor (median weight_corrected_lap_time, age ≤ 2 laps).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 50
                max_value: 130
      - name: obs_fuel_removed_pace_p10_s
        description: 10th percentile of fuel-removed lap time at this lap-in-stint.
        tests: [not_null]
      - name: obs_fuel_removed_pace_p50_s
        description: Median fuel-removed lap time at this lap-in-stint.
        tests: [not_null]
      - name: obs_fuel_removed_pace_p90_s
        description: 90th percentile of fuel-removed lap time at this lap-in-stint.
        tests: [not_null]
      - name: obs_deg_from_fresh_p10_s
        description: p10 tyre-degradation-from-fresh (obs_fuel_removed_pace_p10_s − ref_green_pace_s).
        tests: [not_null]
      - name: obs_deg_from_fresh_p50_s
        description: p50 tyre-degradation-from-fresh.
        tests: [not_null]
      - name: obs_deg_from_fresh_p90_s
        description: p90 tyre-degradation-from-fresh.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [circuit_id, era, compound, lap_in_stint]
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 1
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: obs_fuel_removed_pace_p90_s
            column_B: obs_fuel_removed_pace_p10_s
            or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: obs_fuel_removed_pace_p50_s
            column_B: obs_fuel_removed_pace_p10_s
            or_equal: true
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: obs_fuel_removed_pace_p90_s
            column_B: obs_fuel_removed_pace_p50_s
            or_equal: true

  - name: dim_events
    description: >
      Race-level event dimension. One row per event (damage, retirement, penalty).
      Currently populated from the raw_dim_events seed (manual entries for 2021).
      Joined onto fct_lap_residuals to flag performance-impact and reliability-impact events.
    tags: [marts]
    columns:
      - name: event_id
        description: Surrogate PK for the event.
        tests:
          - not_null
          - unique
      - name: race_id
        description: Race identifier the event belongs to.
        tests:
          - not_null

  - name: fct_lap_residuals
    description: >
      Lap-grain analytics table. One row per valid race lap. Exposes the full
      residual decomposition from int_lap_residual_decomposed plus anomaly flags
      from int_lap_anomaly_flags. Use ml_eligible = TRUE to filter to training-quality
      laps. For ML model inputs, prefer the split marts:
        - fct_driver_skill_features   race-grain skill aggregates
        - fct_cliff_prediction_features   lap-grain with next_lap_degradation_jump_s target
    tags: [marts]
    columns:
      - name: lap_id
        description: Surrogate PK, FK to stg_laps.
        tests:
          - not_null
          - unique
      - name: race_year
        description: Season year.
        tests:
          - not_null
      - name: race_id
        description: Race identifier.
        tests:
          - not_null
      - name: driver_id
        description: Driver identifier.
        tests:
          - not_null
      - name: constructor_id
        description: Constructor identifier.
        tests:
          - not_null
      - name: lap_number
        description: Lap number within the race.
        tests:
          - not_null
      - name: lap_time_s
        description: Raw lap time in seconds.
        tests:
          - not_null
      - name: compound
        description: Tyre compound on this lap.
        tests:
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
              config:
                where: "compound IS NOT NULL"
      - name: fuel_component_s
        description: Fuel-burnoff weight penalty component.
        tests:
          - not_null
      - name: compound_component_s
        description: Tyre-compound degradation component.
        tests:
          - not_null
      - name: rubber_component_s
        description: Track-rubber evolution component.
        tests:
          - not_null
      - name: ambient_component_s
        description: Ambient/weather component.
        tests:
          - not_null
      - name: constructor_component_s
        description: Constructor structural pace component.
        tests:
          - not_null
      - name: dirty_air_tax_s
        description: Per-lap dirty-air slowdown component.
        tests:
          - not_null
      - name: driver_skill_residual_s
        description: Residual after all physics/car/strategy components (driver skill).
        tests:
          - not_null
      - name: ml_eligible
        description: TRUE when the lap is training-quality for ML inputs.
        tests:
          - not_null
      - name: correction_weight
        description: IPW/cleanliness weight for the lap.
        tests:
          - not_null

  - name: fct_telemetry_deltas
    description: >
      Driver-vs-teammate corner-metric deltas. Grain: one row per
      (race_id, driver_a, driver_b, corner_name, lap_number) — for each teammate
      pair (driver_a < driver_b) within a race, the per-corner difference in braking
      point, minimum corner speed, and throttle-application point. Built by joining
      int_corner_metrics to itself across same-car teammates. Powers the Telemetry
      Style Fingerprint feature (#19).
    tags: [marts]
    columns:
      - name: race_id
        description: Race identifier.
        tests:
          - not_null
      - name: driver_a
        description: First driver of the teammate pair (lexicographically smaller id).
        tests:
          - not_null
      - name: driver_b
        description: Second driver of the teammate pair.
        tests:
          - not_null
      - name: corner_name
        description: Named track corner the delta is measured at.
        tests:
          - not_null
      - name: track_id
        description: Track identifier for the corner.
        tests:
          - not_null
      - name: lap_number
        description: Lap number within the race.
        tests:
          - not_null
      - name: braking_point_delta_m
        description: driver_a − driver_b braking point (metres). Positive = driver_a brakes later.
        tests:
          - not_null
      - name: v_min_delta_kph
        description: driver_a − driver_b minimum corner speed (kph). Positive = driver_a carries more speed.
        tests:
          - not_null
      - name: throttle_point_delta_m
        description: driver_a − driver_b throttle-application point (metres). Positive = driver_a gets on power later.
        tests:
          - not_null
