version: 2

models:
  - name: stg_laps
    description: >
      Cleaned lap-level data from FastF1 race sessions. One row per driver × lap.
      Renames Bronze columns to snake_case, casts nanosecond timings to seconds,
      and derives the validity / track-status flags consumed across the warehouse.
      is_valid_lap = TRUE excludes pit laps, deleted laps, SC/VSC laps, and lap 1.

      Known bronze defect, not corrected here (F18, one race): 2020_1 (Austrian GP) is numbered
      1-68 in bronze laps while the race ran 71. Race control puts the CHEQUERED flag on lap 71
      and race_scheduled_laps says 71; on the 2026-09-25 dev build it is the only race with a
      chequered flag on record whose laps end short of it. The audit also found Jolpica's pit
      laps for that race running 4 to 5 laps ahead of stg_pits (not re-run since). The two
      other feeds are ingested separately from the lap feed and neither passes through stg_laps,
      so the fault is in bronze ingestion, outside this layer. Effect, that race only:
      lap_number runs behind the true lap (3 laps at the flag, 4-5 by the pit-lap comparison), so
      the lap_number feature reads early and fuel_mass_kg, which counts down from lap_number
      at the scheduled 71-lap rate (about 1.55 kg per lap), reads about 1.5 kg per lap of offset
      too heavy (4.6 kg at 3 laps). The fix is a re-pull of 2020_1.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Surrogate key   {season}_{race_id}_{driver}_{lap_number}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: circuit_key
        description: Event/grand-prix key (equals race_id); used to group laps by circuit.
        data_type: varchar
      - name: race_id
        description: Numeric FastF1 event id cast to string (e.g. '4'); the join key used across staging, not the human-readable slug.
        data_type: varchar
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number the driver carried in this session.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1 (e.g. 'Mercedes').
        data_type: varchar
      - name: lap_number
        description: Lap index within the race (1-based).
        data_type: integer
        tests: [not_null]
      - name: stint_number
        description: Stint index within the race (1-based); increments after each pit stop.
        data_type: integer
      - name: tyre_life
        description: Laps already completed on the current tyre set at the start of this lap.
        data_type: integer
      - name: is_fresh_tyre
        description: TRUE when the lap began on a freshly fitted tyre set.
        data_type: boolean
      - name: is_personal_best
        description: FastF1 flag   the lap was the driver's personal best at the time it was set.
        data_type: boolean
      - name: position
        description: Track position (classification order) at the end of the lap.
        data_type: integer
      - name: lap_time_s
        description: Lap time in seconds (Bronze nanoseconds ÷ 1e9); NULL when not timed.
        data_type: double
      - name: lap_start_time_s
        description: Session clock (s) at the start of the lap; used to join weather and air state.
        data_type: double
      - name: sector1_time_s
        description: Sector 1 time in seconds; NULL when missing.
        data_type: double
      - name: sector2_time_s
        description: Sector 2 time in seconds; NULL when missing.
        data_type: double
      - name: sector3_time_s
        description: Sector 3 time in seconds; NULL when missing.
        data_type: double
      - name: sector1_session_time_s
        description: Session clock (s) at the sector 1 split.
        data_type: double
      - name: sector2_session_time_s
        description: Session clock (s) at the sector 2 split.
        data_type: double
      - name: sector3_session_time_s
        description: Session clock (s) at the sector 3 split.
        data_type: double
      - name: speed_i1_kph
        description: Speed-trap reading at intermediate point 1 (kph).
        data_type: double
      - name: speed_i2_kph
        description: Speed-trap reading at intermediate point 2 / sector 2 exit (kph).
        data_type: double
      - name: speed_fl_kph
        description: Speed-trap reading at the finish line (kph).
        data_type: double
      - name: speed_st_kph
        description: Speed-trap reading on the longest straight (kph).
        data_type: double
      - name: track_status
        description: Raw FastF1 TrackStatus string for the lap (concatenated digit codes, e.g. '41' = SC+yellow).
        data_type: varchar
      - name: is_pit_lap
        description: TRUE when the lap has a pit-in or pit-out time (an in/out lap).
        data_type: boolean
      - name: is_deleted
        description: TRUE when stewards deleted the lap time (e.g. track-limits breach).
        data_type: boolean
      - name: is_accurate
        description: FastF1 quality flag   timing considered reliable.
        data_type: boolean
      - name: is_fastf1_generated
        description: TRUE when the row was synthesised by FastF1 rather than read from raw timing.
        data_type: boolean
      - name: compound
        description: >
          Normalised tyre compound label (UPPER). None/nan/UNKNOWN mapped to NULL.
          Pre-2019 compounds (SUPERSOFT/ULTRASOFT/HYPERSOFT) preserved as-is.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET',
                         'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
              config:
                where: "compound IS NOT NULL"
      - name: is_safety_car_lap
        description: >
          TRUE when TrackStatus contains a 4 (SCDeployed). Full safety car only   VSC is is_vsc_lap and a
          red flag is is_red_flag_lap. Decode matches stg_track_status, ground-truthed against the bronze
          Message column.
        data_type: boolean
        tests: [not_null]
      - name: is_vsc_lap
        description: >
          TRUE when TrackStatus contains a 6 (VSCDeployed) or 7 (VSCEnding). Decode matches
          stg_track_status.
        data_type: boolean
        tests: [not_null]
      - name: is_red_flag_lap
        description: >
          TRUE when TrackStatus contains a 5 (Red). A red flag is a full session stoppage   physically the
          opposite of a VSC lap (tyres go to ambient, and may legally be changed), so it is flagged
          separately rather than folded into either neutralisation flag. The three flags together are the
          neutralised set the layer excludes; consumers should test all three, not a pair.
        data_type: boolean
        tests: [not_null]
      - name: is_valid_lap
        description: >
          Clean-lap flag: timed (lap_time_s > 0), not a pit lap, not deleted, accurate, lap_number > 1,
          and no SC/VSC/red flag (TrackStatus contains no 4–7).
        data_type: boolean

  - name: stg_laps_qualifying
    description: >
      Cleaned qualifying lap data (Q1/Q2/Q3), mirroring stg_laps for qualifying sessions.
      One row per driver × lap. Same Bronze→snake_case rename, nanosecond→second casts, and
      validity flags as stg_laps, with an added session_type = 'Q' marker. Feeds the qualifying
      decomposition branch (int_*_qualifying models).
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Surrogate key   {season}_{race_id}_Q_{driver}_{lap_number}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: circuit_key
        description: Event/grand-prix key (equals race_id); groups laps by circuit.
        data_type: varchar
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: session_type
        description: Constant 'Q' marking the qualifying session.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number the driver carried in this session.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1.
        data_type: varchar
      - name: lap_number
        description: Lap index within the qualifying session (1-based).
        data_type: integer
        tests: [not_null]
      - name: stint_number
        description: Stint (run) index within qualifying.
        data_type: integer
      - name: tyre_life
        description: Laps already completed on the current tyre set at the start of this lap.
        data_type: integer
      - name: is_fresh_tyre
        description: TRUE when the lap began on a freshly fitted tyre set.
        data_type: boolean
      - name: is_personal_best
        description: FastF1 flag   the lap was the driver's personal best at the time it was set.
        data_type: boolean
      - name: position
        description: Provisional classification at the time of the lap.
        data_type: integer
      - name: lap_time_s
        description: Lap time in seconds; NULL when not timed.
        data_type: double
      - name: lap_start_time_s
        description: Session clock (s) at the start of the lap.
        data_type: double
      - name: sector1_time_s
        description: Sector 1 time in seconds.
        data_type: double
      - name: sector2_time_s
        description: Sector 2 time in seconds.
        data_type: double
      - name: sector3_time_s
        description: Sector 3 time in seconds.
        data_type: double
      - name: sector1_session_time_s
        description: Session clock (s) at the sector 1 split.
        data_type: double
      - name: sector2_session_time_s
        description: Session clock (s) at the sector 2 split.
        data_type: double
      - name: sector3_session_time_s
        description: Session clock (s) at the sector 3 split.
        data_type: double
      - name: speed_i1_kph
        description: Speed-trap reading at intermediate point 1 (kph).
        data_type: double
      - name: speed_i2_kph
        description: Speed-trap reading at intermediate point 2 (kph).
        data_type: double
      - name: speed_fl_kph
        description: Speed-trap reading at the finish line (kph).
        data_type: double
      - name: speed_st_kph
        description: Speed-trap reading on the longest straight (kph).
        data_type: double
      - name: track_status
        description: Raw FastF1 TrackStatus string for the lap.
        data_type: varchar
      - name: is_pit_lap
        description: TRUE when the lap has a pit-in or pit-out time.
        data_type: boolean
      - name: is_deleted
        description: TRUE when stewards deleted the lap time (e.g. track limits).
        data_type: boolean
      - name: is_accurate
        description: FastF1 quality flag   timing considered reliable.
        data_type: boolean
      - name: is_fastf1_generated
        description: TRUE when the row was synthesised by FastF1.
        data_type: boolean
      - name: compound
        description: Normalised tyre compound (UPPER); None/nan/UNKNOWN mapped to NULL.
        data_type: varchar
      - name: is_safety_car_lap
        description: TRUE when TrackStatus contains a 4 (SCDeployed). See stg_laps for the full decode.
        data_type: boolean
        tests: [not_null]
      - name: is_vsc_lap
        description: TRUE when TrackStatus contains a 6 or 7 (VSCDeployed/VSCEnding).
        data_type: boolean
        tests: [not_null]
      - name: is_red_flag_lap
        description: TRUE when TrackStatus contains a 5 (Red) — a full session stoppage.
        data_type: boolean
        tests: [not_null]
      - name: is_valid_lap
        description: >
          Clean-lap flag (timed, not pit/deleted, no SC/VSC/red, lap_number > 1, and -- from
          2019 only -- accurate). WI-05 (F33): IsAccurate is FastF1's lap start/end sync flag,
          not a lap-time check, and 2018 largely leaves it unset (73.6% of timed quali laps
          accurate vs >= 99.6% in 2019-2025), so it is not required for 2018.
          assert_quali_valid_share_consistent_across_seasons (T25) guards the next season.
        data_type: boolean

  - name: stg_telemetry
    description: >
      High-frequency car telemetry (~10 Hz) from FastF1, one row per sample. Renames Bronze
      channels to snake_case and projects the powertrain channels (rpm, n_gear, drs_active)
      consumed by int_lap_telemetry_aggregates. Samples are filtered to 0 < distance_m < 6500.
      DRS decode: FastF1 codes 10/12/14 = active → drs_active = TRUE.
    meta:
      family: staging
    columns:
      - name: telemetry_id
        description: Composite key   {season}_{race_id}_{driver_id}_{lap_number} (not unique; many samples per lap).
        data_type: varchar
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index the sample belongs to.
        data_type: integer
      - name: distance_m
        description: Distance along the lap from start/finish (m); samples filtered to 0–6500 m.
        data_type: double
      - name: session_time_s
        description: >
          Session clock of the sample (s), from the FastF1 SessionTime nanosecond field.
          Present so that (race, driver, lap, distance_m, session_time_s) is a total order:
          distance_m alone ties on 982,303 car-channel samples (a stationary car keeps
          sampling while distance does not advance), which made any LAG/LEAD ordered on
          distance alone pick an arbitrary neighbour. Unique across all 59.5M samples, zero
          nulls.
        data_type: double
      - name: speed_kph
        description: Instantaneous car speed (kph).
        data_type: double
      - name: throttle_pct
        description: Throttle application (0–100%).
        data_type: double
      - name: brake_applied
        description: TRUE when the brake pedal was applied at the sample.
        data_type: boolean
      - name: rpm
        description: Engine speed (revolutions per minute).
        data_type: double
      - name: n_gear
        description: Selected gear (0 = neutral).
        data_type: integer
      - name: drs_active
        description: TRUE when DRS was open/active (FastF1 codes 10/12/14).
        data_type: boolean
      - name: source_channel
        description: FastF1 sample provenance ('car' = true channel cadence; 'pos'/'interpolation' = forward-filled).
        data_type: varchar

  - name: stg_sector_times
    description: >
      Per-sector timing unpivoted from stg_laps. One row per lap × sector (1/2/3).
      Carries the speed-trap reading associated with each sector exit (S1→I1, S2→I2, S3→FL).
    meta:
      family: staging
    columns:
      - name: sector_id
        description: Surrogate key   {lap_id}_S{sector}.
        data_type: varchar
        tests: [not_null, unique]
      - name: lap_id
        description: Foreign key to stg_laps.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index within the race.
        data_type: integer
      - name: sector
        description: Sector number (1, 2 or 3).
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: sector_time_s
        description: Time spent in the sector (seconds).
        data_type: double
      - name: sector_session_time_s
        description: Session clock (s) at the sector split.
        data_type: double
      - name: speed_trap_kph
        description: Speed-trap reading associated with the sector exit (kph).
        data_type: double
      - name: is_valid_lap
        description: Inherited clean-lap flag from the parent lap.
        data_type: boolean

  - name: stg_pits
    description: >
      One row per pit stop: a lap carrying PitInTime. Bronze splits a stop across two lap
      rows (PitInTime on the in-lap, PitOutTime on the out-lap), so the exit side is resolved
      with a LEAD over the driver's own pit laps and out-lap-only rows — including pit-lane
      race starts — are not emitted as stops. 5,336 stops across 2018–2024.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Foreign key to stg_laps (the pit-in lap).
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: pit_in_lap_number
        description: Lap on which the car entered the pit lane.
        data_type: integer
        tests: [not_null]
      - name: pit_out_lap_number
        description: >
          Lap on which the car exited, always pit_in_lap_number + 1 where an out-lap exists.
          NULL for the 227 stops with no following out-lap (retired in the pit lane, or the
          race ended under the stop).
        data_type: integer
      - name: stint_number
        description: Stint index of the in-lap, i.e. the stint this stop ends.
        data_type: integer
      - name: compound_in
        description: >
          Tyre compound removed at this stop (UPPER), read off the in-lap. Bronze reports each
          lap's own rubber, so this differs from compound_out on 3,844 of 5,109 stops.
        data_type: varchar
      - name: compound_out
        description: Tyre compound fitted on exit (UPPER), read off the out-lap; NULL when there is none.
        data_type: varchar
      - name: pit_in_time_s
        description: Session clock (s) at pit entry.
        data_type: double
        tests: [not_null]
      - name: pit_out_time_s
        description: Session clock (s) at pit exit, taken from the out-lap row; NULL when there is none.
        data_type: double
      - name: pit_duration_s
        description: >
          pit_out_time_s − pit_in_time_s (seconds): pit entry to pit exit, so it spans the whole
          pit lane rather than the stationary time alone. Median 23.93 s. Red-flag stoppages and
          garage returns fall inside the car's pit window and inflate it — 388 of 5,109 exceed
          60 s — so consumers wanting a green-flag service time must filter.
        data_type: double

  - name: stg_lap_tyre_qa
    description: >
      Bronze tyre QA (WI-05: F24, F25), one row per race lap; int_stint_geometry reads
      stint_number / tyre_life / compound from here instead of raw bronze. (1) F25 repair:
      a driver's first unassigned laps (<= var('tyre_qa_max_unassigned_leading_laps'), the
      2018 lap-1 gap) join the first stint, and that stint's TyreLife is offset by the laps
      filled, since bronze counted it from the first assigned lap; laps up to a stop taken
      inside the gap are the stint before, with unknown tyres. (2) F24 cross-check: every
      race's stint numbering is compared with stg_pits. A race is quarantined when it has
      >= var('tyre_qa_race_unexplained_boundaries_min') stint changes with no in-lap in the
      var('tyre_qa_boundary_window_laps') laps before them (and no red flag) or whose in-lap
      an earlier change already claimed (one stop, one change), or when >=
      var('tyre_qa_race_unmatched_pit_share_min') of its racing stops (>= 3) have no stint
      change after them; outside those races a driver-race is quarantined on any such
      unexplained change or on laps bronze never assigned. A quarantined unit serves the
      pit record's stint ordinal and NULL compound / tyre_life, never a boundary that
      contradicts the pit record. As built on the 2018-2025 warehouse the quarantined races
      are 2018_3, 2022_7, 2022_11 and 2025_6 (see tyre_qa_status).
    meta:
      family: staging
      aggregation_scope_exemptions:
        - keys: [race_year, race_id, driver_id]
          status: accepted
          reason: >
            Two per-driver-race aggregates. (a) The F25 repair reads the driver's first
            bronze-assigned lap (ARG_MIN over the race) to fill the one or two laps before
            it; the only forward reach is those leading laps (lap 1 is never a valid lap)
            taking the stint, compound and TyreLife of lap 2-3, i.e. the same tyre set a
            lap later. The TyreLife offset on the rest of the stint depends only on how
            many EARLIER laps were unassigned. (b) The quarantine counts a driver-race's
            unexplained stint changes and unassigned laps: a whole-race data-quality
            verdict that can only NULL tyre columns (never produce a value) and so removes
            rows from training (is_training_eligible needs age_in_stint > 3). A live race
            is scored on its own feed without this check.
        - keys: [race_year, race_id]
          status: accepted
          reason: >
            The race-level quarantine gate counts the race's unexplained stint changes and
            unmatched racing stops across all its laps. Same argument as the driver-race
            verdict: it decides whether the race's bronze tyre feed agrees with the pit
            record, can only NULL tyre columns, and quarantined rows leave training.
    columns:
      - name: lap_id
        description: Foreign key to stg_laps.
        data_type: varchar
        tests: [not_null, unique]
      - name: stint_number
        description: >
          Served stint number: bronze (lap-1 gap filled) where tyre_qa_status = 'ok', else
          the pit record's ordinal (1 + stops the car exited from before the lap + bronze's
          red-flag stint changes). NULL only for the few driver-races bronze never assigned
          any stint to (two cars retired on laps 1-2 in 2018).
        data_type: integer
      - name: tyre_life
        description: >
          Served tyre age (laps on the set, bronze TyreLife): offset by the filled laps on a
          repaired first stint; NULL when quarantined.
        data_type: integer
      - name: compound
        description: Served compound (bronze); NULL when quarantined.
        data_type: varchar
      - name: stint_source
        description: Where stint_number came from.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: [bronze, bronze_lap1_repaired, pit_record]
      - name: tyre_life_offset_laps
        description: Laps added to bronze TyreLife by the F25 repair (0, 1 or 2).
        data_type: integer
      - name: tyre_qa_status
        description: The quarantine list. 'ok' serves bronze; the other two serve the pit record.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, quarantined_race, quarantined_driver]
      - name: n_unexplained_stint_changes
        description: Race-level count of bronze stint changes with no in-lap in the window before and no red flag.
        data_type: bigint
      - name: n_racing_stops
        description: Race-level count of stops the car rejoined from and ran 3+ more laps after, no red flag.
        data_type: bigint
      - name: n_unmatched_racing_stops
        description: Racing stops with no bronze stint change in the window after them.
        data_type: bigint
      - name: is_unexplained_stint_change
        description: TRUE on a lap where bronze starts a stint the pit record cannot explain.
        data_type: boolean
      - name: bronze_stint_number
        description: Bronze Stint, as ingested.
        data_type: integer
      - name: bronze_tyre_life
        description: Bronze TyreLife, as ingested.
        data_type: integer
      - name: bronze_compound
        description: Bronze compound (normalised in stg_laps), as ingested.
        data_type: varchar

  - name: stg_weather
    description: >
      Weather snapshot nearest each lap start. Bronze weather samples (≈1 Hz) are matched to
      laps with ASOF semantics: for each lap, the sample with the largest session_time_s that is
      still ≤ lap_start_time_s (conditions as the lap begins), falling back to the first sample
      for laps starting before the first reading. One row per driver × lap; covers all races
      2018–2024 with zero source nulls.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Foreign key to stg_laps.
        data_type: varchar
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index within the race.
        data_type: integer
      - name: weather_session_time_s
        description: Session clock (s) of the matched weather sample.
        data_type: double
      - name: ambient_temp_c
        description: Air temperature (°C).
        data_type: double
      - name: track_temp_c
        description: Track-surface temperature (°C).
        data_type: double
      - name: rainfall_flag
        description: >
          WET-CONDITIONS flag, the one every consumer filters on (WI-05, F26). Not bronze
          Rainfall: TRUE when at least two of three independent signals say wet -- bronze
          Rainfall, humidity_pct >= var('wet_humidity_min_pct'), and field_wet_tyre_share >=
          var('wet_field_tyre_share_min'). Bronze Rainfall alone read the dry 2018 Spanish and
          2019 Monaco GPs as 83% raining and never fired at the fully wet 2020/2021 Turkish
          GPs. Raw value in rainfall_flag_bronze.
        data_type: boolean
        tests:
          - not_null
      - name: humidity_pct
        description: Relative humidity (%).
        data_type: double
      - name: rainfall_flag_bronze
        description: Bronze Rainfall (precipitation detected at the sample), as ingested.
        data_type: boolean
      - name: field_wet_tyre_share
        description: >
          Share of the cars with a recorded compound on this race-lap that are on
          INTERMEDIATE or WET tyres (bronze compound). NULL when no car has one.
        data_type: double
      - name: wet_signal_votes
        description: How many of the three wet signals fired on this lap (0-3); rainfall_flag is votes >= 2.
        data_type: integer
      - name: rain_signal_disagreement
        description: >
          TRUE where bronze Rainfall and the two-of-three verdict differ -- the laps the
          F26 correction changed, kept so it stays auditable.
        data_type: boolean
      - name: wind_speed_ms
        description: Wind speed (m/s).
        data_type: double
      - name: wind_direction
        description: Wind direction (degrees, 0–359).
        data_type: integer
      - name: pressure_hpa
        description: >
          Station air pressure (hPa). 100% non-null in bronze across 2018–2024; range
          778–1024 hPa (the low end is Mexico City's altitude, not a defect). Staged for
          contract completeness — air density derived from it was measured as a degradation
          feature and rejected as inside harness noise.
        data_type: double

  - name: stg_events
    description: >
      Race-level events (damage, retirements, penalties) sourced from the raw_dim_events seed.
      Currently manual entries for 2021 only   expand as automated detection is built.
    meta:
      family: staging
    columns:
      - name: stg_event_id
        description: Surrogate key   {race_id}_{event_id}.
        data_type: varchar
        tests: [not_null, unique]
      - name: event_id
        description: Seed-level event identifier.
        data_type: varchar
      - name: race_id
        description: Race identifier from the seed (numeric).
        data_type: integer
      - name: driver_id
        description: Driver the event affects (FastF1 three-letter code).
        data_type: varchar
      - name: event_type
        description: Event category label (e.g. damage, retirement, penalty).
        data_type: varchar
      - name: event_severity
        description: Magnitude estimate of the event's impact.
        data_type: double
      - name: source
        description: Provenance of the event row (constant 'manual' for the seed).
        data_type: varchar
      - name: is_performance_impact
        description: TRUE when the event degrades on-track performance.
        data_type: boolean
      - name: is_reliability_impact
        description: TRUE when the event is a reliability/mechanical issue.
        data_type: boolean

  - name: stg_results
    description: >
      Official classified race results from FastF1 session.results. One row per driver × race.
      Source of truth for finishing position, grid, points, and the explicit DNF / classification
      split used by fct_ghost_race_finish instead of deriving the finish from MAX(position).
    meta:
      family: staging
    columns:
      - name: result_id
        description: Surrogate key   {race_id}_{driver abbreviation}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string (e.g. '4'); matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name (e.g. azerbaijan_grand_prix).
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number carried by the driver.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1.
        data_type: varchar
      - name: finish_position
        description: Numeric finishing position from FastF1.
        data_type: integer
      - name: classified_position
        description: Raw ClassifiedPosition string ('1'..'20' for ranked finishers; 'R'/'D'/'W'/'E'/'F'/'N' otherwise).
        data_type: varchar
      - name: grid_position
        description: Starting grid position.
        data_type: integer
      - name: points
        description: Championship points scored in the race.
        data_type: double
      - name: time_or_gap_s
        description: Total race time for the winner / gap to winner for others (seconds); NULL when unavailable.
        data_type: double
      - name: status
        description: Raw FastF1 status string ('Finished', '+1 Lap', 'Engine', 'Collision', ...).
        data_type: varchar
      - name: is_classified
        description: >
          TRUE when ClassifiedPosition parses to an integer (a ranked finisher) and the driver was not
          disqualified. A disqualified driver is never classified: bronze leaves a numeric
          ClassifiedPosition on some of them (HAM and LEC 2023_18, RUS 2024_14), so status is decided first.
        data_type: boolean
        tests: [not_null]
      - name: is_dnf
        description: >
          TRUE for retirements (not classified and not a lapped finish). A disqualified driver is
          included, since disqualification removes the classification.
        data_type: boolean
        tests: [not_null]
      - name: dnf_cause
        description: Coarse cause for DNFs only   'racing' / 'mechanical' / 'non_classified'; NULL for finishers.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['racing', 'mechanical', 'non_classified']
              config:
                where: "dnf_cause IS NOT NULL"

  - name: stg_telemetry_position
    description: >
      Phase 10c, the channel split. The POSITION channel of raw_telemetry -- 58.8M
      of its 118.7M rows -- projected to the positional columns. Until Phase 10 these
      rows had no consumer at all: stg_telemetry projects all three FastF1 sample
      provenances un-filtered and int_lap_telemetry_aggregates then filters to 'car'.
      This model is the only reader of source_channel = 'pos', and int_lap_proximity
      is its only consumer.

      Deliberately NOT a copy of stg_telemetry with a different WHERE clause: it
      carries relative_distance / pos_x / pos_y, which the car-channel path never
      references, and it omits the car-channel's `distance_m BETWEEN 0 AND 6500`
      guard because its position column is a 0..1 lap fraction that carries its own
      bound.
    meta:
      family: staging
    columns:
      - name: session_time_s
        description: >
          Session clock of the sample (s). The one column that makes a cross-driver
          comparison possible: a gap between two cars is a difference of two readings
          of THIS column at the same point on track, never a difference of two
          distances.
        data_type: double
      - name: relative_distance
        description: >
          Lap fraction in [0, 1). Clamped rather than filtered - FastF1 emits a
          handful of samples at -3e-6 and 1.0000004 from float error at the lap
          boundary, and dropping them would punch a hole in exactly the bin (the
          start/finish line) where the gap matters most.
        data_type: double
      - name: pos_x
        description: Track-frame X coordinate (1/10 m). Carried for Phase 10b (racing-line deviation); no current consumer.
        data_type: double
      - name: pos_y
        description: Track-frame Y coordinate (1/10 m). Carried for Phase 10b (racing-line deviation); no current consumer.
        data_type: double
      - name: driver_ahead_number
        description: >
          FastF1's own answer to "who is ahead". A car NUMBER, not the three-letter
          code driver_id uses; int_lap_proximity resolves it through stg_results.
          Kept so the incumbent measure can be scored against the new one rather
          than replaced by assertion.
        data_type: varchar
      - name: distance_to_ahead_m
        description: >
          FastF1's DistanceToDriverAhead (m). The single number every incumbent
          traffic feature in this warehouse descends from. Diagnostic here.
        data_type: double

  - name: stg_race_control
    description: >
      The FIA race-control message feed. One row per message; 12,814 rows across 149
      races, of which 4,909 are waved blue flags. Ingested since the beginning of the
      project and consumed by nothing until Phase 10a (plan open item 13, now closed).

      Staged for one reason: the blue flags are a traffic label produced by race
      control rather than by the position channel, which makes them the only
      supervised check available for the proximity features that is not derived from
      the same sensor. The car number is resolved to driver_id here so consumers join
      on the key the rest of the warehouse uses.
    meta:
      family: staging
    columns:
      - name: race_id
        description: Numeric FastF1 event id; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: message_time_s
        description: >
          Session clock of the message. NOT on the same origin as the telemetry
          SessionTime column (it runs to ~55,000 s on a two-hour race, i.e. it is a
          wall-clock derivative). Join on lap_number, not on this.
        data_type: double
      - name: flag
        description: Flag colour, upper-cased, NULL for non-flag messages (BLUE / YELLOW / DOUBLE YELLOW / GREEN / CLEAR / RED / CHEQUERED / BLACK AND WHITE).
        data_type: varchar
      - name: driver_id
        description: >
          Three-letter code resolved from RacingNumber via stg_results. NULL where the
          message is not driver-scoped, or where the number did not resolve.
        data_type: varchar
      - name: is_blue_flag_event
        description: >
          TRUE when this row is a blue flag whose driver identity and lap both
          resolved - "this driver was being lapped on this lap". All 4,909 blue flags
          resolve (verified 2026-09-05). A flag whose number failed to resolve would
          be a data gap, not a negative, which is why this is a flag and not a filter.
        data_type: boolean
        tests: [not_null]

  - name: stg_track_status
    description: >
      SC/VSC/yellow/red timeline from FastF1 session.track_status. One row per status-change
      event, ordered within each race by session_time_s, with a named decode and a per-event
      duration. Decode is ground-truthed against the Message column: 4 = SC, 5 = Red, 6 = VSC,
      7 = VSC-ending (this corrects the stale mapping in stg_laps). Feeds int_pit_loss_circuit
      and int_sc_hazard_history.
    meta:
      family: staging
    columns:
      - name: track_status_id
        description: Surrogate key   {race_id}_{session_time_s}_{status_code}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_time_s
        description: Session clock (s) at which the status changed.
        data_type: double
        tests: [not_null]
      - name: status_code
        description: Raw FastF1 numeric status code as a string.
        data_type: varchar
      - name: status_message
        description: Raw FastF1 status message (e.g. 'SCDeployed', 'VSCDeployed').
        data_type: varchar
      - name: status_label
        description: Named decode of the status code.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['all_clear', 'yellow', 'safety_car', 'vsc', 'vsc_ending', 'red_flag', 'unknown']
      - name: is_safety_car
        description: TRUE when status_code = 4 (full Safety Car).
        data_type: boolean
      - name: is_vsc
        description: TRUE when status_code is 6 or 7 (Virtual Safety Car deployed/ending).
        data_type: boolean
      - name: is_red_flag
        description: TRUE when status_code = 5 (red flag).
        data_type: boolean
      - name: status_duration_s
        description: Seconds this status was in effect (until the next change in the race); NULL for the final open-ended event.
        data_type: double

  - name: stg_session_status
    description: >
      Session lifecycle events from FastF1 session.session_status
      (Inactive / Started / Aborted / Finished / Finalised). 'Aborted' marks red-flag
      stoppages, surfaced as is_red_flag_stop. One row per lifecycle event.
    meta:
      family: staging
    columns:
      - name: session_status_id
        description: Surrogate key   {race_id}_{session_time_s}.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_time_s
        description: Session clock (s) at the lifecycle event.
        data_type: double
        tests: [not_null]
      - name: status
        description: Raw FastF1 session status ('Started', 'Aborted', 'Finished', ...).
        data_type: varchar
      - name: is_red_flag_stop
        description: TRUE when status is 'Aborted' (a red-flag stoppage).
        data_type: boolean

  - name: stg_session_status_qualifying
    description: >
      Session lifecycle events for the qualifying session, mirroring stg_session_status. This is
      the only record of where Q1, Q2 and Q3 begin and end   FastF1 reports one flat lap set per
      Q session with no segment column   so int_qualifying_segments splits the session on the
      Started / Finished pairs here. 'Aborted' marks a red-flag stoppage inside a segment.
    meta:
      family: staging
    columns:
      - name: session_status_id
        description: Surrogate key   {race_id}_Q_{session_time_s}.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps_qualifying.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_type
        description: Constant 'Q' marking the qualifying session.
        data_type: varchar
      - name: session_time_s
        description: Session clock (s) at the lifecycle event.
        data_type: double
        tests: [not_null]
      - name: status
        description: Raw FastF1 session status ('Started', 'Aborted', 'Finished', ...).
        data_type: varchar
      - name: is_red_flag_stop
        description: TRUE when status is 'Aborted' (a red-flag stoppage).
        data_type: boolean
      - name: is_green_light
        description: >
          TRUE when status is 'Started'. Raw event, NOT one per segment: a red flag inside a
          segment is written 'Aborted' and the resumption is another 'Started'.
        data_type: boolean
      - name: is_chequered_flag
        description: >
          TRUE when status is 'Finished'. Usually three per session, but a segment red-flagged at
          its end never gets one   the session goes straight to 'Finalised'.
        data_type: boolean

  - name: stg_results_qualifying
    description: >
      Official classified results for the qualifying session. One row per driver × session. The
      Q1/Q2/Q3 columns are each driver's official best lap in each segment and are populated only
      on the qualifying session's own results (they are always null on the race session's, which is
      what stg_results reads). Those times are the anchors int_qualifying_segments matches back to
      the laps that set them.
    meta:
      family: staging
    columns:
      - name: quali_result_id
        description: Surrogate key   {race_id}_Q_{driver_id}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps_qualifying.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_type
        description: Constant 'Q' marking the qualifying session.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number the driver carried in this session.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1.
        data_type: varchar
      - name: quali_position
        description: >
          Official qualifying classification (1..20). Not the race grid   penalties are applied
          afterwards and show up in stg_results.grid_position.
        data_type: integer
      - name: q1_time_s
        description: Official best Q1 lap in seconds; NULL if the driver set no Q1 time.
        data_type: double
      - name: q2_time_s
        description: Official best Q2 lap in seconds; NULL if eliminated in Q1.
        data_type: double
      - name: q3_time_s
        description: Official best Q3 lap in seconds; NULL if eliminated in Q1 or Q2.
        data_type: double
      - name: final_segment_reached
        description: >
          Furthest segment the driver reached   'Q1', 'Q2', 'Q3', or 'none' when they set no time
          at all.
        data_type: varchar
        tests: [not_null]

  - name: stg_circuit_info
    description: >
      Corner geometry from FastF1 circuit_info.corners. One row per corner per race, ordered by
      distance along the lap. race_year is part of the key   geometry can vary slightly year to
      year. Not yet read by any downstream dbt model or app feature.
    meta:
      family: staging
    columns:
      - name: corner_id
        description: Surrogate key   {race_id}_{corner_number}{corner_letter}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: corner_number
        description: Corner number along the lap.
        data_type: integer
      - name: corner_letter
        description: Optional suffix distinguishing corners that share a number (e.g. 7a/7b); NULL when absent.
        data_type: varchar
      - name: corner_x
        description: Corner x-coordinate in the FastF1 track frame.
        data_type: double
      - name: corner_y
        description: Corner y-coordinate in the FastF1 track frame.
        data_type: double
      - name: corner_angle_deg
        description: Corner orientation angle (degrees) in the track frame.
        data_type: double
      - name: corner_distance_m
        description: Distance of the corner along the lap from start/finish (m).
        data_type: double
        tests: [not_null]

  - name: stg_tyre_allocations
    description: >
      Pirelli weekend compound nominations for 2019-2024: which C-code each of hard/medium/soft
      actually was, per race. compound_label has been RELATIVE since 2019 (Pirelli picks 3 of 5
      physical compounds per weekend), so "SOFT" at one circuit is not the same rubber as "SOFT"
      at another; this model supplies the absolute scale that makes them comparable.
      One row per (race, label): 128 races x 3 = 384 rows.

      PROVENANCE - READ BEFORE QUOTING ANYTHING FROM THIS TABLE. The seed is USER-SUPPLIED AND
      SELF-VERIFIED, not machine-sourced. source_url names the Pirelli per-race preview each row
      is attributed to, but only 47 of the 128 URLs resolve; the rest 404 against the live press
      site, which no longer serves its pre-2025 archive. Values were accepted on the user's
      authority to unblock downstream work (08d) and are expected to be replaced once an archival
      source is available. Spot-checks that DID verify at source: 2022 Australia C2/C3/C5
      (the deliberate C4 skip), 2022 Emilia-Romagna C2/C3/C4, and the 2024 Americas trio
      (Austin C2/C3/C4, Mexico City C3/C4/C5, Sao Paulo C3/C4/C5).
      See _improvements/work/08-foundations-repair.md section 08d.
    meta:
      family: staging
    columns:
      - name: race_year
        description: Season year, 2019-2024.
        data_type: integer
        tests:
          - not_null
      - name: circuit_key
        description: >
          Event/grand-prix key, matching dim_circuits.circuit_key. Event-level, not venue-level:
          2020 Silverstone is british_grand_prix AND 70th_anniversary_grand_prix, and the
          Red Bull Ring / Bahrain double-headers split the same way.
        data_type: varchar
        tests:
          - not_null
      - name: compound_code
        description: Pirelli compound code. C1 hardest, C5 softest.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: compound_label
        description: The relative label this code was badged as for that weekend.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['hard', 'medium', 'soft']
      - name: allocated_sets_per_driver
        description: >
          NULL by construction. FIA technical allocation data, not carried by Pirelli's
          compound announcements - left unpopulated rather than invented.
        data_type: integer
      - name: source_url
        description: >
          Pirelli press URL this row is attributed to. See the model description: most of these
          do not currently resolve. Presence of a URL is not evidence the row is sourced.
        data_type: varchar
        tests:
          - not_null
