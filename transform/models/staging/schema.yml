version: 2

models:
  - name: stg_laps
    description: >
      Cleaned lap-level data from FastF1 race sessions. One row per driver × lap.
      Renames Bronze columns to snake_case, casts nanosecond timings to seconds,
      and derives the validity / track-status flags consumed across the warehouse.
      is_valid_lap = TRUE excludes pit laps, deleted laps, SC/VSC laps, and lap 1.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Surrogate key   {season}_{race_id}_{driver}_{lap_number}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: circuit_key
        description: Event/grand-prix key (equals race_id); used to group laps by circuit.
        data_type: varchar
      - name: race_id
        description: Numeric FastF1 event id cast to string (e.g. '4'); the join key used across staging, not the human-readable slug.
        data_type: varchar
        tests: [not_null]
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number the driver carried in this session.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1 (e.g. 'Mercedes').
        data_type: varchar
      - name: lap_number
        description: Lap index within the race (1-based).
        data_type: integer
        tests: [not_null]
      - name: stint_number
        description: Stint index within the race (1-based); increments after each pit stop.
        data_type: integer
      - name: tyre_life
        description: Laps already completed on the current tyre set at the start of this lap.
        data_type: integer
      - name: is_fresh_tyre
        description: TRUE when the lap began on a freshly fitted tyre set.
        data_type: boolean
      - name: is_personal_best
        description: FastF1 flag   the lap was the driver's personal best at the time it was set.
        data_type: boolean
      - name: position
        description: Track position (classification order) at the end of the lap.
        data_type: integer
      - name: lap_time_s
        description: Lap time in seconds (Bronze nanoseconds ÷ 1e9); NULL when not timed.
        data_type: double
      - name: lap_start_time_s
        description: Session clock (s) at the start of the lap; used to join weather and air state.
        data_type: double
      - name: sector1_time_s
        description: Sector 1 time in seconds; NULL when missing.
        data_type: double
      - name: sector2_time_s
        description: Sector 2 time in seconds; NULL when missing.
        data_type: double
      - name: sector3_time_s
        description: Sector 3 time in seconds; NULL when missing.
        data_type: double
      - name: sector1_session_time_s
        description: Session clock (s) at the sector 1 split.
        data_type: double
      - name: sector2_session_time_s
        description: Session clock (s) at the sector 2 split.
        data_type: double
      - name: sector3_session_time_s
        description: Session clock (s) at the sector 3 split.
        data_type: double
      - name: speed_i1_kph
        description: Speed-trap reading at intermediate point 1 (kph).
        data_type: double
      - name: speed_i2_kph
        description: Speed-trap reading at intermediate point 2 / sector 2 exit (kph).
        data_type: double
      - name: speed_fl_kph
        description: Speed-trap reading at the finish line (kph).
        data_type: double
      - name: speed_st_kph
        description: Speed-trap reading on the longest straight (kph).
        data_type: double
      - name: track_status
        description: Raw FastF1 TrackStatus string for the lap (concatenated digit codes, e.g. '41' = SC+yellow).
        data_type: varchar
      - name: is_pit_lap
        description: TRUE when the lap has a pit-in or pit-out time (an in/out lap).
        data_type: boolean
      - name: is_deleted
        description: TRUE when stewards deleted the lap time (e.g. track-limits breach).
        data_type: boolean
      - name: is_accurate
        description: FastF1 quality flag   timing considered reliable.
        data_type: boolean
      - name: is_fastf1_generated
        description: TRUE when the row was synthesised by FastF1 rather than read from raw timing.
        data_type: boolean
      - name: compound
        description: >
          Normalised tyre compound label (UPPER). None/nan/UNKNOWN mapped to NULL.
          Pre-2019 compounds (SUPERSOFT/ULTRASOFT/HYPERSOFT) preserved as-is.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET',
                         'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
              config:
                where: "compound IS NOT NULL"
      - name: is_safety_car_lap
        description: >
          TRUE when TrackStatus contains a 4, 6 or 7. Per the corrected FastF1 decode (see stg_track_status),
          4 = SC and 6/7 = VSC, so this flag fires for both SC and VSC laps. Use stg_track_status for a
          precise SC-vs-VSC split.
        data_type: boolean
      - name: is_vsc_lap
        description: >
          TRUE when TrackStatus contains a 5. NOTE: 5 is the red-flag code in the corrected FastF1 decode
          (stg_track_status), so this column is a known mislabel kept for backwards compatibility   prefer
          stg_track_status for accurate VSC classification. (is_valid_lap excludes 4–7 regardless.)
        data_type: boolean
      - name: is_valid_lap
        description: >
          Clean-lap flag: timed (lap_time_s > 0), not a pit lap, not deleted, accurate, lap_number > 1,
          and no SC/VSC/red flag (TrackStatus contains no 4–7).
        data_type: boolean

  - name: stg_laps_qualifying
    description: >
      Cleaned qualifying lap data (Q1/Q2/Q3), mirroring stg_laps for qualifying sessions.
      One row per driver × lap. Same Bronze→snake_case rename, nanosecond→second casts, and
      validity flags as stg_laps, with an added session_type = 'Q' marker. Feeds the qualifying
      decomposition branch (int_*_qualifying models).
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Surrogate key   {season}_{race_id}_Q_{driver}_{lap_number}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: circuit_key
        description: Event/grand-prix key (equals race_id); groups laps by circuit.
        data_type: varchar
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: session_type
        description: Constant 'Q' marking the qualifying session.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code (e.g. VER, HAM).
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number the driver carried in this session.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1.
        data_type: varchar
      - name: lap_number
        description: Lap index within the qualifying session (1-based).
        data_type: integer
        tests: [not_null]
      - name: stint_number
        description: Stint (run) index within qualifying.
        data_type: integer
      - name: tyre_life
        description: Laps already completed on the current tyre set at the start of this lap.
        data_type: integer
      - name: is_fresh_tyre
        description: TRUE when the lap began on a freshly fitted tyre set.
        data_type: boolean
      - name: is_personal_best
        description: FastF1 flag   the lap was the driver's personal best at the time it was set.
        data_type: boolean
      - name: position
        description: Provisional classification at the time of the lap.
        data_type: integer
      - name: lap_time_s
        description: Lap time in seconds; NULL when not timed.
        data_type: double
      - name: lap_start_time_s
        description: Session clock (s) at the start of the lap.
        data_type: double
      - name: sector1_time_s
        description: Sector 1 time in seconds.
        data_type: double
      - name: sector2_time_s
        description: Sector 2 time in seconds.
        data_type: double
      - name: sector3_time_s
        description: Sector 3 time in seconds.
        data_type: double
      - name: sector1_session_time_s
        description: Session clock (s) at the sector 1 split.
        data_type: double
      - name: sector2_session_time_s
        description: Session clock (s) at the sector 2 split.
        data_type: double
      - name: sector3_session_time_s
        description: Session clock (s) at the sector 3 split.
        data_type: double
      - name: speed_i1_kph
        description: Speed-trap reading at intermediate point 1 (kph).
        data_type: double
      - name: speed_i2_kph
        description: Speed-trap reading at intermediate point 2 (kph).
        data_type: double
      - name: speed_fl_kph
        description: Speed-trap reading at the finish line (kph).
        data_type: double
      - name: speed_st_kph
        description: Speed-trap reading on the longest straight (kph).
        data_type: double
      - name: track_status
        description: Raw FastF1 TrackStatus string for the lap.
        data_type: varchar
      - name: is_pit_lap
        description: TRUE when the lap has a pit-in or pit-out time.
        data_type: boolean
      - name: is_deleted
        description: TRUE when stewards deleted the lap time (e.g. track limits).
        data_type: boolean
      - name: is_accurate
        description: FastF1 quality flag   timing considered reliable.
        data_type: boolean
      - name: is_fastf1_generated
        description: TRUE when the row was synthesised by FastF1.
        data_type: boolean
      - name: compound
        description: Normalised tyre compound (UPPER); None/nan/UNKNOWN mapped to NULL.
        data_type: varchar
      - name: is_safety_car_lap
        description: TRUE when TrackStatus contains a 4, 6 or 7 (see stg_laps for the decode caveat).
        data_type: boolean
      - name: is_vsc_lap
        description: TRUE when TrackStatus contains a 5 (known mislabel; see stg_laps).
        data_type: boolean
      - name: is_valid_lap
        description: Clean-lap flag (timed, not pit/deleted, accurate, no SC/VSC, lap_number > 1).
        data_type: boolean

  - name: stg_telemetry
    description: >
      High-frequency car telemetry (~10 Hz) from FastF1, one row per sample. Renames Bronze
      channels to snake_case and projects the powertrain channels (rpm, n_gear, drs_active)
      consumed by int_lap_telemetry_aggregates. Samples are filtered to 0 < distance_m < 6500.
      DRS decode: FastF1 codes 10/12/14 = active → drs_active = TRUE.
    meta:
      family: staging
    columns:
      - name: telemetry_id
        description: Composite key   {season}_{race_id}_{driver_id}_{lap_number} (not unique; many samples per lap).
        data_type: varchar
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index the sample belongs to.
        data_type: integer
      - name: distance_m
        description: Distance along the lap from start/finish (m); samples filtered to 0–6500 m.
        data_type: double
      - name: speed_kph
        description: Instantaneous car speed (kph).
        data_type: double
      - name: throttle_pct
        description: Throttle application (0–100%).
        data_type: double
      - name: brake_applied
        description: TRUE when the brake pedal was applied at the sample.
        data_type: boolean
      - name: rpm
        description: Engine speed (revolutions per minute).
        data_type: double
      - name: n_gear
        description: Selected gear (0 = neutral).
        data_type: integer
      - name: drs_active
        description: TRUE when DRS was open/active (FastF1 codes 10/12/14).
        data_type: boolean
      - name: source_channel
        description: FastF1 sample provenance ('car' = true channel cadence; 'pos'/'interpolation' = forward-filled).
        data_type: varchar

  - name: stg_sector_times
    description: >
      Per-sector timing unpivoted from stg_laps. One row per lap × sector (1/2/3).
      Carries the speed-trap reading associated with each sector exit (S1→I1, S2→I2, S3→FL).
    meta:
      family: staging
    columns:
      - name: sector_id
        description: Surrogate key   {lap_id}_S{sector}.
        data_type: varchar
        tests: [not_null, unique]
      - name: lap_id
        description: Foreign key to stg_laps.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index within the race.
        data_type: integer
      - name: sector
        description: Sector number (1, 2 or 3).
        data_type: integer
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3]
      - name: sector_time_s
        description: Time spent in the sector (seconds).
        data_type: double
      - name: sector_session_time_s
        description: Session clock (s) at the sector split.
        data_type: double
      - name: speed_trap_kph
        description: Speed-trap reading associated with the sector exit (kph).
        data_type: double
      - name: is_valid_lap
        description: Inherited clean-lap flag from the parent lap.
        data_type: boolean

  - name: stg_pits
    description: >
      One row per pit-stop event, derived from laps with a non-null PitInTime or PitOutTime.
      pit_in_lap_number is the lap on which the car entered the pit lane; pit_out_lap_number is
      the (usually next) lap on which it exited. pit_duration_s is NULL when only one of the
      in/out times is recorded.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Foreign key to stg_laps (the pit-in lap).
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: pit_in_lap_number
        description: Lap on which the car entered the pit lane.
        data_type: integer
      - name: pit_out_lap_number
        description: Lap on which the car exited the pit lane (pit_in_lap_number + 1).
        data_type: integer
      - name: stint_number
        description: Stint index at the moment of the stop.
        data_type: integer
      - name: compound_out
        description: Tyre compound fitted on exit (UPPER).
        data_type: varchar
      - name: pit_in_time_s
        description: Session clock (s) at pit entry; NULL when not recorded.
        data_type: double
      - name: pit_out_time_s
        description: Session clock (s) at pit exit; NULL when not recorded.
        data_type: double
      - name: pit_duration_s
        description: pit_out_time_s − pit_in_time_s (seconds); NULL when either bound is missing.
        data_type: double

  - name: stg_weather
    description: >
      Weather snapshot nearest each lap start. Bronze weather samples (≈1 Hz) are matched to
      laps with ASOF semantics: for each lap, the sample with the largest session_time_s that is
      still ≤ lap_start_time_s (conditions as the lap begins), falling back to the first sample
      for laps starting before the first reading. One row per driver × lap; covers all races
      2018–2024 with zero source nulls.
    meta:
      family: staging
    columns:
      - name: lap_id
        description: Foreign key to stg_laps.
        data_type: varchar
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string.
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
      - name: lap_number
        description: Lap index within the race.
        data_type: integer
      - name: weather_session_time_s
        description: Session clock (s) of the matched weather sample.
        data_type: double
      - name: ambient_temp_c
        description: Air temperature (°C).
        data_type: double
      - name: track_temp_c
        description: Track-surface temperature (°C).
        data_type: double
      - name: rainfall_flag
        description: TRUE when rainfall was detected at the sample.
        data_type: boolean
      - name: humidity_pct
        description: Relative humidity (%).
        data_type: double
      - name: wind_speed_ms
        description: Wind speed (m/s).
        data_type: double
      - name: wind_direction
        description: Wind direction (degrees, 0–359).
        data_type: integer

  - name: stg_events
    description: >
      Race-level events (damage, retirements, penalties) sourced from the raw_dim_events seed.
      Currently manual entries for 2021 only   expand as automated detection is built.
    meta:
      family: staging
    columns:
      - name: stg_event_id
        description: Surrogate key   {race_id}_{event_id}.
        data_type: varchar
        tests: [not_null, unique]
      - name: event_id
        description: Seed-level event identifier.
        data_type: varchar
      - name: race_id
        description: Race identifier from the seed (numeric).
        data_type: integer
      - name: driver_id
        description: Driver the event affects (FastF1 three-letter code).
        data_type: varchar
      - name: event_type
        description: Event category label (e.g. damage, retirement, penalty).
        data_type: varchar
      - name: event_severity
        description: Magnitude estimate of the event's impact.
        data_type: double
      - name: source
        description: Provenance of the event row (constant 'manual' for the seed).
        data_type: varchar
      - name: is_performance_impact
        description: TRUE when the event degrades on-track performance.
        data_type: boolean
      - name: is_reliability_impact
        description: TRUE when the event is a reliability/mechanical issue.
        data_type: boolean

  - name: stg_results
    description: >
      Official classified race results from FastF1 session.results. One row per driver × race.
      Source of truth for finishing position, grid, points, and the explicit DNF / classification
      split used by fct_ghost_race_finish instead of deriving the finish from MAX(position).
    meta:
      family: staging
    columns:
      - name: result_id
        description: Surrogate key   {race_id}_{driver abbreviation}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string (e.g. '4'); matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name (e.g. azerbaijan_grand_prix).
        data_type: varchar
      - name: driver_id
        description: FastF1 three-letter driver code.
        data_type: varchar
        tests: [not_null]
      - name: driver_number
        description: Car number carried by the driver.
        data_type: varchar
      - name: constructor_id
        description: Team name as reported by FastF1.
        data_type: varchar
      - name: finish_position
        description: Numeric finishing position from FastF1.
        data_type: integer
      - name: classified_position
        description: Raw ClassifiedPosition string ('1'..'20' for ranked finishers; 'R'/'D'/'W'/'E'/'F'/'N' otherwise).
        data_type: varchar
      - name: grid_position
        description: Starting grid position.
        data_type: integer
      - name: points
        description: Championship points scored in the race.
        data_type: double
      - name: time_or_gap_s
        description: Total race time for the winner / gap to winner for others (seconds); NULL when unavailable.
        data_type: double
      - name: status
        description: Raw FastF1 status string ('Finished', '+1 Lap', 'Engine', 'Collision', ...).
        data_type: varchar
      - name: is_classified
        description: TRUE when ClassifiedPosition parses to an integer (a ranked finisher).
        data_type: boolean
        tests: [not_null]
      - name: is_dnf
        description: TRUE for retirements (not classified and not a lapped finish).
        data_type: boolean
        tests: [not_null]
      - name: dnf_cause
        description: Coarse cause for DNFs only   'racing' / 'mechanical' / 'non_classified'; NULL for finishers.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['racing', 'mechanical', 'non_classified']
              config:
                where: "dnf_cause IS NOT NULL"

  - name: stg_track_status
    description: >
      SC/VSC/yellow/red timeline from FastF1 session.track_status. One row per status-change
      event, ordered within each race by session_time_s, with a named decode and a per-event
      duration. Decode is ground-truthed against the Message column: 4 = SC, 5 = Red, 6 = VSC,
      7 = VSC-ending (this corrects the stale mapping in stg_laps). Feeds int_pit_loss_circuit
      and int_sc_hazard_history.
    meta:
      family: staging
    columns:
      - name: track_status_id
        description: Surrogate key   {race_id}_{session_time_s}.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_time_s
        description: Session clock (s) at which the status changed.
        data_type: double
        tests: [not_null]
      - name: status_code
        description: Raw FastF1 numeric status code as a string.
        data_type: varchar
      - name: status_message
        description: Raw FastF1 status message (e.g. 'SCDeployed', 'VSCDeployed').
        data_type: varchar
      - name: status_label
        description: Named decode of the status code.
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['all_clear', 'yellow', 'safety_car', 'vsc', 'vsc_ending', 'red_flag', 'unknown']
      - name: is_safety_car
        description: TRUE when status_code = 4 (full Safety Car).
        data_type: boolean
      - name: is_vsc
        description: TRUE when status_code is 6 or 7 (Virtual Safety Car deployed/ending).
        data_type: boolean
      - name: is_red_flag
        description: TRUE when status_code = 5 (red flag).
        data_type: boolean
      - name: status_duration_s
        description: Seconds this status was in effect (until the next change in the race); NULL for the final open-ended event.
        data_type: double

  - name: stg_session_status
    description: >
      Session lifecycle events from FastF1 session.session_status
      (Inactive / Started / Aborted / Finished / Finalised). 'Aborted' marks red-flag
      stoppages, surfaced as is_red_flag_stop. One row per lifecycle event.
    meta:
      family: staging
    columns:
      - name: session_status_id
        description: Surrogate key   {race_id}_{session_time_s}.
        data_type: varchar
        tests: [not_null]
      - name: race_year
        description: Season year.
        data_type: integer
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: session_time_s
        description: Session clock (s) at the lifecycle event.
        data_type: double
        tests: [not_null]
      - name: status
        description: Raw FastF1 session status ('Started', 'Aborted', 'Finished', ...).
        data_type: varchar
      - name: is_red_flag_stop
        description: TRUE when status is 'Aborted' (a red-flag stoppage).
        data_type: boolean

  - name: stg_circuit_info
    description: >
      Corner geometry from FastF1 circuit_info.corners. One row per corner per race, ordered by
      distance along the lap. race_year is part of the key   geometry can vary slightly year to
      year. Not yet read by any downstream dbt model or app feature.
    meta:
      family: staging
    columns:
      - name: corner_id
        description: Surrogate key   {race_id}_{corner_number}{corner_letter}.
        data_type: varchar
        tests: [not_null, unique]
      - name: race_year
        description: Season year.
        data_type: integer
        tests: [not_null]
      - name: race_id
        description: Numeric FastF1 event id cast to string; matches stg_laps.race_id.
        data_type: varchar
        tests: [not_null]
      - name: race_slug
        description: Human-readable event name.
        data_type: varchar
      - name: corner_number
        description: Corner number along the lap.
        data_type: integer
      - name: corner_letter
        description: Optional suffix distinguishing corners that share a number (e.g. 7a/7b); NULL when absent.
        data_type: varchar
      - name: corner_x
        description: Corner x-coordinate in the FastF1 track frame.
        data_type: double
      - name: corner_y
        description: Corner y-coordinate in the FastF1 track frame.
        data_type: double
      - name: corner_angle_deg
        description: Corner orientation angle (degrees) in the track frame.
        data_type: double
      - name: corner_distance_m
        description: Distance of the corner along the lap from start/finish (m).
        data_type: double
        tests: [not_null]

  - name: stg_tyre_allocations
    description: >
      STUB   source not yet ingested. Returns an empty result set with the correct schema so
      downstream models (dim_compounds_season) can reference it without build errors. FastF1
      already exposes HARD/MEDIUM/SOFT labels directly in the Compound column, so this model is
      low priority for 2018+ seasons. Activate when Pirelli allocation sheets are scraped to map
      compound codes (C1–C5) to hard/medium/soft per circuit.
    meta:
      family: staging
    columns:
      - name: race_year
        description: Season year (always NULL in the stub).
        data_type: integer
      - name: circuit_key
        description: Event/grand-prix key (always NULL in the stub).
        data_type: varchar
      - name: compound_code
        description: Pirelli compound code C1–C5 (always NULL in the stub).
        data_type: varchar
      - name: compound_label
        description: hard/medium/soft label the code maps to (always NULL in the stub).
        data_type: varchar
      - name: allocated_sets_per_driver
        description: Number of sets of this compound each driver is allocated (always NULL in the stub).
        data_type: integer
