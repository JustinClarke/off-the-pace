version: 2

sources:
  - name: bronze_f1
    database: read_only
    tables:
      - name: raw_laps
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/laps/*/*/*.parquet"
        description: >
          Hive-partitioned FastF1 lap data. One row per driver × lap.
          Columns follow FastF1 naming conventions (PascalCase).
          Sector times, speed traps, and pit markers are embedded per row.
          Partitioned by season and race. This source is the race session only, and it is told
          apart from qualifying by directory depth alone: race files sit at
          laps/season=YYYY/race=SLUG/*.parquet, qualifying files one level deeper under
          session=Q/ (read as raw_laps_qualifying). Race files carry no session_type column, and
          nothing in stg_laps reads, filters or defaults one. The glob is therefore the only
          thing keeping another session (FP1-3, sprint) out of the race lap set: any file written
          at race depth is read as race laps. assert_raw_laps_race_depth_is_race_only fails if a
          race-depth file declares a session_type other than 'R'.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, Driver, LapNumber]
        columns:
          - name: Driver
            description: Three-letter driver code (e.g. VER, HAM)
            tests:
              - not_null
          - name: DriverNumber
            description: Official race number
            tests:
              - not_null
          - name: LapNumber
            description: Lap number within the race session
            tests:
              - not_null
          - name: Stint
            description: Stint number assigned by FastF1 (1-indexed)
          - name: LapTime
            description: Lap time in nanoseconds
          - name: Sector1Time
            description: Sector 1 time in nanoseconds
          - name: Sector2Time
            description: Sector 2 time in nanoseconds
          - name: Sector3Time
            description: Sector 3 time in nanoseconds
          - name: Sector1SessionTime
            description: Session elapsed time at S1 exit (nanoseconds)
          - name: Sector2SessionTime
            description: Session elapsed time at S2 exit (nanoseconds)
          - name: Sector3SessionTime
            description: Session elapsed time at S3 exit (nanoseconds)
          - name: SpeedI1
            description: Speed at intermediate 1 trap (kph)
          - name: SpeedI2
            description: Speed at intermediate 2 trap (kph)
          - name: SpeedFL
            description: Speed at finish line trap (kph)
          - name: SpeedST
            description: Speed at speed trap on main straight (kph)
          - name: Compound
            description: Tyre compound label (SOFT/MEDIUM/HARD/INTERMEDIATE/WET)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT', 'nan', 'None', 'UNKNOWN']
          - name: TyreLife
            description: Laps completed on the current tyre set
          - name: FreshTyre
            description: Whether the set was new when fitted
            tests:
              - not_null
          - name: PitInTime
            description: Session time at pit lane entry (nanoseconds); null if no pit-in this lap
          - name: PitOutTime
            description: Session time at pit lane exit (nanoseconds); null if no pit-out this lap
          - name: TrackStatus
            description: >
              Encoded track condition. 1=clear, 2=yellow, 4=SC, 5=VSC, 6=SC ending, 7=red flag.
            tests:
              - not_null
          - name: IsPersonalBest
            description: Whether this lap is the driver's personal best for the session
          - name: Deleted
            description: Whether the lap time was deleted (track limits etc.)
            tests:
              - not_null
          - name: IsAccurate
            description: FastF1 accuracy flag   false for interpolated/estimated times
            tests:
              - not_null
          - name: Position
            description: Race position at end of lap
          - name: race_id
            description: Hive partition value   numeric FastF1 event id (e.g. 2018_1), not the slug
            tests:
              - not_null
          - name: season
            description: Hive partition value   calendar year
            tests:
              - not_null
          - name: Team
            description: Raw source column Team (read by staging)
            tests:
              - not_null
          - name: LapStartTime
            description: Raw source column LapStartTime (read by staging)
            tests:
              - not_null

      - name: raw_laps_qualifying
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/laps/*/*/session=Q/*.parquet"
        description: >
          Qualifying session lap data. Sourced separately due to different Hive partition structure
          (includes session=Q subdirectory). Unioned with raw_laps in stg_laps.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, Driver, LapNumber]
        columns:
          - name: session_type
            description: Always 'Q' for qualifying sessions
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Q']
          - name: Driver
            description: Three-letter driver code (e.g. VER, HAM)
            tests:
              - not_null
          - name: DriverNumber
            description: Official race number
            tests:
              - not_null
          - name: LapNumber
            description: Lap number within the qualifying session
            tests:
              - not_null
          - name: season
            description: Raw source column season (read by staging)
            tests:
              - not_null
          - name: race_id
            description: Raw source column race_id (read by staging)
            tests:
              - not_null
          - name: Team
            description: Raw source column Team (read by staging)
            tests:
              - not_null

      - name: raw_weather
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/weather/*/*/*.parquet"
        description: >
          FastF1 session.weather_data sampled at ~1Hz during the race session.
          One row per weather sample; joined to laps on nearest session_time_s.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, session_time_s]
        columns:
          - name: race_id
            description: Hive partition   race identifier (YYYY_RoundNumber)
            tests:
              - not_null
          - name: season
            description: Hive partition   calendar year
            tests:
              - not_null
          - name: session_time_s
            description: Session elapsed time of the weather sample (seconds)
            tests:
              - not_null
          - name: ambient_temp_c
            description: Ambient air temperature (°C)
            tests:
              - not_null
          - name: track_temp_c
            description: Track surface temperature (°C)
            tests:
              - not_null
          - name: rainfall_flag
            description: Boolean   true if rainfall detected
            tests:
              - not_null
          - name: humidity_pct
            description: Relative humidity (%)
            tests:
              - not_null
          - name: wind_speed_ms
            description: Wind speed (m/s)
            tests:
              - not_null
          - name: wind_direction
            description: Wind direction (degrees, 0–360)
            tests:
              - not_null

      - name: raw_results
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/results/*/*/*.parquet"
        description: >
          FastF1 session.results official classified results. One row per driver
          per race. Carries finishing position, grid position, classified position,
          status (Finished / +N Lap(s) / DNF reason), points, and total race
          time / gap (nanoseconds). Partitioned by season and race (slug).
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, Abbreviation]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps.race_id (the downstream join key)
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug (e.g. azerbaijan_grand_prix); exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: Abbreviation
            description: Three-letter driver code (e.g. VER, HAM)
            tests:
              - not_null
          - name: TeamName
            description: Constructor display name
            tests:
              - not_null
          - name: Position
            description: Finishing position (double; NULL if not classified)
          - name: ClassifiedPosition
            description: Official classified position string ('1'..'20', 'R'=retired, 'D'=disqualified, etc.)
            tests:
              - not_null
          - name: GridPosition
            description: Starting grid position (double)
          - name: Time
            description: Total race time for winner / gap to winner for others (nanoseconds)
          - name: Status
            description: Finish status 'Finished', '+1 Lap', or DNF reason (e.g. 'Engine', 'Collision')
            tests:
              - not_null
          - name: Points
            description: Championship points scored
            tests:
              - not_null

      - name: raw_track_status
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/track_status/*/*/*.parquet"
        description: >
          FastF1 session.track_status SC/VSC/yellow/red timeline. One row per
          track-status change event, ordered by session_time_s. Status codes
          (ground-truthed against the Message column): 1=AllClear, 2=Yellow,
          4=SCDeployed, 5=Red, 6=VSCDeployed, 7=VSCEnding.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, index]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps.race_id (the downstream join key)
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: Status
            description: Track status code (1/2/4/5/6/7)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['1', '2', '4', '5', '6', '7']
          - name: Message
            description: Human-readable label (AllClear / Yellow / SCDeployed / VSCDeployed / Red)
            tests:
              - not_null
          - name: session_time_s
            description: Session elapsed time of the status change (seconds)
            tests:
              - not_null

      - name: raw_race_control
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/race_control/*/*/*.parquet"
        description: >
          FastF1 session.race_control_messages: the FIA's own message feed for
          the session. One row per message. 14,992 rows across 173 races
          (2018-2025), of which 5,388 are waved blue flags. Ingested since the beginning and
          staged by nothing until the proximity features, which need the blue flags as a
          traffic label that is NOT derived from the telemetry the proximity
          features are built from.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, index]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps.race_id (the downstream join key)
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: Flag
            description: Flag colour where the message is a flag (BLUE / YELLOW / DOUBLE YELLOW / GREEN / CLEAR / RED / CHEQUERED / BLACK AND WHITE); NULL for non-flag messages
          - name: category
            description: Message category (Flag / Drs / SafetyCar / CarEvent / Other)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Flag', 'Drs', 'SafetyCar', 'CarEvent', 'Other']
          - name: message
            description: Raw FIA message text
            tests:
              - not_null
          - name: Scope
            description: Whom the message applies to (Track / Driver / Sector)
          - name: Sector
            description: Marshal sector, when Scope = 'Sector'
          - name: RacingNumber
            description: Car number the message applies to, when Scope = 'Driver'. A car NUMBER, not the three-letter code driver_id uses
          - name: Lap
            description: Lap number the message was issued on
          - name: session_time_s
            description: Session clock of the message. NOT on the same origin as the telemetry SessionTime column - do not join the two on it; join on Lap
            tests:
              - not_null

      - name: raw_session_status
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/session_status/*/*/*.parquet"
        description: >
          FastF1 session.session_status session lifecycle events. One row per
          change (Inactive / Started / Aborted / Finished / Finalised). Aborted
          marks red-flag stoppages.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, session_time_s, Status]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps.race_id (the downstream join key)
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: Status
            description: Session status (Inactive / Started / Aborted / Finished / Finalised)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Inactive', 'Started', 'Aborted', 'Finished', 'Finalised', 'Ends']
          - name: session_time_s
            description: Session elapsed time of the status change (seconds)
            tests:
              - not_null

      - name: raw_results_qualifying
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/results/*/*/session=Q/*.parquet"
        description: >
          FastF1 session.results for the qualifying session, sourced separately
          from raw_results because of the extra session=Q Hive partition. Carries
          the official Q1/Q2/Q3 best lap per driver   populated only on the
          qualifying session's own results, null on the race session's   plus
          the qualifying classification. A null segment time means the driver
          was eliminated before that segment or set no time in it.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, Abbreviation]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps_qualifying.race_id
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: session_type
            description: Always 'Q' for qualifying sessions
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Q']
          - name: Abbreviation
            description: Three-letter driver code (e.g. VER, HAM)
            tests:
              - not_null
          - name: Position
            description: Official qualifying classification (1..20)
          - name: Q1
            description: Best Q1 lap in nanoseconds; null if the driver set no Q1 time
          - name: Q2
            description: Best Q2 lap in nanoseconds; null if eliminated in Q1
          - name: Q3
            description: Best Q3 lap in nanoseconds; null if eliminated in Q1 or Q2
          - name: Status
            description: Raw source column Status (read by staging)
            tests:
              - not_null

      - name: raw_session_status_qualifying
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/session_status/*/*/session=Q/*.parquet"
        description: >
          FastF1 session.session_status for qualifying sessions. Sourced
          separately from raw_session_status because of the extra session=Q
          Hive partition (same split as raw_laps_qualifying). One row per
          lifecycle change (Inactive / Started / Aborted / Finished /
          Finalised / Ends). The three 'Finished' events are the ends of Q1, Q2
          and Q3 respectively   the only place the segment structure is
          recorded, since the qualifying lap table has no segment column.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, session_time_s, Status]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps_qualifying.race_id
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: session_type
            description: Always 'Q' for qualifying sessions
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Q']
          - name: Status
            description: Session status (Inactive / Started / Aborted / Finished / Finalised / Ends)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Inactive', 'Started', 'Aborted', 'Finished', 'Finalised', 'Ends']
          - name: session_time_s
            description: Session elapsed time of the status change (seconds)
            tests:
              - not_null

      - name: raw_circuit_info
        meta:
          # union_by_name tolerates degenerate files: a few circuit_info parquets
          # were written with no corner columns (FastF1 circuit.corners KeyError;
          # see ingestion STATUS) and contribute zero rows.
          external_location: "read_parquet('{{ var('bronze_base', '../data/bronze') }}/circuit_info/*/*/*.parquet', union_by_name=true)"
        description: >
          FastF1 circuit_info.corners corner geometry for the circuit map. One
          row per corner, ordered by Distance along the racing line. Partitioned
          by season and race (slug); geometry can vary slightly year to year.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [season, race_id, Number, Letter]
        columns:
          - name: race_id
            description: Numeric FastF1 event id (e.g. 2018_4); matches stg_laps.race_id (the downstream join key)
            tests:
              - not_null
          - name: race
            description: Hive partition race name slug; exposed as race_slug
          - name: season
            description: Calendar year
            tests:
              - not_null
          - name: Number
            description: Corner number (FIA designation)
            tests:
              - not_null
          - name: Letter
            description: Corner letter suffix for multi-apex corners (e.g. 'A', 'B'); blank otherwise
            tests:
              - not_null
          - name: X
            description: Corner apex X coordinate (FastF1 track frame, 1/10 m)
            tests:
              - not_null
          - name: Y
            description: Corner apex Y coordinate (FastF1 track frame, 1/10 m)
            tests:
              - not_null
          - name: Angle
            description: Corner orientation angle (degrees)
            tests:
              - not_null
          - name: Distance
            description: Distance of the corner along the racing line from start/finish (m)
            tests:
              - not_null

      - name: raw_telemetry
        meta:
          external_location: "{{ var('bronze_base', '../data/bronze') }}/telemetry/*/*/*.parquet"
        description: >
          High-frequency telemetry from FastF1. One row per ~10ms sample per driver per lap.
          Distance-indexed (0 to circuit length).
        columns:
          - name: driver_id
            description: Three-letter driver code (e.g. VER, HAM)
            tests:
              - not_null
          - name: lap_number
            description: Lap number within the race session
            tests:
              - not_null
          - name: distance_m
            description: Distance from start line in meters
            tests:
              - not_null
          - name: speed_kph
            description: Speed in km/h
          - name: throttle_pct
            description: Throttle pedal position (0–100%)
          - name: brake
            description: Brake pedal binary (true if pressed)
          - name: RPM
            description: Engine RPM
          - name: nGear
            description: Selected gear (1–8)
          - name: DRS
            description: DRS state code (0/1 off, 8 eligible, 10/12/14 active)
          - name: race_id
            description: Hive partition   race identifier (YYYY_RoundNumber)
            tests:
              - not_null
          - name: season
            description: Hive partition   calendar year
            tests:
              - not_null
