version: 2

seeds:
  - name: compound_cliff_params
    description: >
      Fitted tyre cliff parameters per (circuit_key, compound_code, season).
      Values are produced by the survival-analysis fitter in
      tasks/coefficients/fit_compound_cliff.py and promoted via seed_writer.py.
      Placeholder rows have notes containing "placeholder".
    columns:
      - name: circuit_key
        description: FK to dim_circuits.circuit_key.
        tests:
          - not_null
      - name: compound_code
        description: >
          Tyre compound identifier (SOFT, MEDIUM, HARD, INTERMEDIATE, WET), plus the
          pre-2019 legacy names SUPERSOFT/ULTRASOFT/HYPERSOFT, fitted 2018-only (see
          work item 08a).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: season
        description: F1 season year this fit applies to.
        tests:
          - not_null
      - name: compound_cliff_onset_laps
        description: Estimated lap-in-stint at which the tyre cliff begins (KM survival median).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 5
                max_value: 100
      - name: compound_cliff_severity
        description: Average lap-time increase (seconds) in the 5 laps following cliff onset.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.1
                max_value: 8.0
      - name: compound_wear_gradient
        description: Steady-state degradation rate (seconds per lap) before cliff onset.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.005
                max_value: 0.300
      - name: fit_date
        description: ISO date when these coefficients were last fitted.
        tests:
          - not_null
          # Warn (not error) if fit_date is more than 365 days old.
          # A stale fit is a maintenance concern, not a build blocker.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date != '2024-01-15'"  # exclude the original placeholder date
              config:
                severity: warn

  - name: tyre_allocations
    description: >
      Pirelli weekend compound nominations, 2019-2024, one row per race (128 rows covering
      every ingested race in that span). Maps the relative hard/medium/soft badging back to the
      absolute C1-C5 scale, which compound_label alone cannot express since Pirelli picks 3 of 5
      physical compounds per weekend.

      PROVENANCE - USER-SUPPLIED AND SELF-VERIFIED, not machine-sourced. source_url attributes
      each row to a Pirelli per-race preview, but only 47 of the 128 URLs resolve; the live press
      site no longer serves its pre-2025 archive. Accepted on the user's authority to unblock
      08d's consumers, and expected to be re-sourced later. A URL here is an attribution, not
      evidence. See _improvements/work/08-foundations-repair.md section 08d.
    columns:
      - name: race_year
        description: Season year, 2019-2024.
        tests:
          - not_null
      - name: circuit_key
        description: >
          FK to dim_circuits.circuit_key. Event-level, not venue-level, so double-headers at one
          venue are separate keys (british_grand_prix vs 70th_anniversary_grand_prix).
        tests:
          - not_null
      - name: hard_code
        description: C-code badged as P Zero White hard for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: medium_code
        description: C-code badged as P Zero Yellow medium for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: soft_code
        description: >
          C-code badged as P Zero Red soft for this race. Usually one step softer than
          medium_code, but not always: 2022 Australia is C2/C3/C5, a deliberate C4 skip
          verified at source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: source_url
        description: Pirelli press URL this row is attributed to. Mostly non-resolving; see description.
        tests:
          - not_null

  - name: circuit_reference
    description: >
      Per-circuit physical parameters including weight_penalty_factor.
      The weight_penalty_factor is calibrated by fit_weight_penalty.py from
      first-stint regression against actual lap times; the prior was a formula
      based on corner_count and avg_lateral_g.
    columns:
      - name: circuit_key
        description: Primary key   unique circuit identifier matching stg_laps.circuit_key.
        tests:
          - not_null
          - unique
      - name: weight_penalty_factor
        description: >
          Lap-time improvement per kg of fuel burned (s/kg).
          Typical range: 0.020–0.040 s/kg. Low-energy circuits (Monaco, Singapore)
          sit at the lower end; high-energy circuits (Suzuka, Spa) at the higher end.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.010
                max_value: 0.060
      - name: fit_date
        description: ISO date when the weight_penalty_factor was last calibrated.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date is not null"
              config:
                severity: warn
