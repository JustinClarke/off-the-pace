version: 2

seeds:
  - name: compound_cliff_params
    description: >
      Fitted tyre cliff parameters per (circuit_key, compound_code, season).
      Values are produced by the survival-analysis fitter in
      tasks/coefficients/fit_compound_cliff.py and promoted via seed_writer.py.
      Placeholder rows have notes containing "placeholder".
    columns:
      - name: circuit_key
        description: FK to dim_circuits.circuit_key.
        tests:
          - not_null
      - name: compound_code
        description: >
          Tyre compound identifier (SOFT, MEDIUM, HARD, INTERMEDIATE, WET), plus the
          pre-2019 legacy names SUPERSOFT/ULTRASOFT/HYPERSOFT, fitted 2018-only (see
          work item 08a).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: season
        description: F1 season year this fit applies to.
        tests:
          - not_null
      - name: compound_cliff_onset_laps
        description: Estimated lap-in-stint at which the tyre cliff begins (KM survival median).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 5
                max_value: 100
      - name: compound_cliff_severity
        description: Average lap-time increase (seconds) in the 5 laps following cliff onset.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.1
                max_value: 8.0
      - name: compound_wear_gradient
        description: Steady-state degradation rate (seconds per lap) before cliff onset.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.005
                max_value: 0.300
      - name: fit_source
        description: >
          The tier the cell's fit was attempted at: cox_km_survival (this season's stints),
          cross_season_fallback (the venue's stints pooled across seasons), compound_class_default
          (too few stints for either), or carried_forward_<season> (no fit for this season; that
          earlier season's cell copied unchanged). Cell-level only -- see the three *_source
          columns for where each parameter actually came from.
        tests:
          - not_null
      - name: onset_source
        description: >
          Where compound_cliff_onset_laps came from: fitted (this cell's own season),
          cross_season_fallback (venue pooled across seasons), class_default (COMPOUND_DEFAULTS, or
          a compound-class value explained in notes), carried_forward (copied from an earlier
          season's fitted or cross-season value). A class default stays class_default when it is
          carried forward. Recorded at fit time by fit_compound_cliff.py. Rows fitted before that
          (fit_date up to 2026-09-22) were labelled from their values: a parameter exactly equal to
          its class default is class_default. A fired default always lands exactly on the default,
          so that labelling can only over-report defaults (a genuine estimate that happens to equal
          one), never hide one.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: gradient_source
        description: Where compound_wear_gradient came from; same vocabulary and history as onset_source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: severity_source
        description: Where compound_cliff_severity came from; same vocabulary and history as onset_source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: fit_date
        description: ISO date when these coefficients were last fitted.
        tests:
          - not_null
          # Warn (not error) if fit_date is more than 365 days old.
          # A stale fit is a maintenance concern, not a build blocker.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date != '2024-01-15'"  # exclude the original placeholder date
              config:
                severity: warn

  - name: tyre_allocations
    description: >
      Pirelli weekend compound nominations, 2019-2024, one row per race (128 rows covering
      every ingested race in that span). Maps the relative hard/medium/soft badging back to the
      absolute C1-C5 scale, which compound_label alone cannot express since Pirelli picks 3 of 5
      physical compounds per weekend.

      PROVENANCE - USER-SUPPLIED AND SELF-VERIFIED, not machine-sourced. source_url attributes
      each row to a Pirelli per-race preview, but only 47 of the 128 URLs resolve; the live press
      site no longer serves its pre-2025 archive. Accepted on the user's authority to unblock
      08d's consumers, and expected to be re-sourced later. A URL here is an attribution, not
      evidence. See _improvements/work/08-foundations-repair.md section 08d.
    columns:
      - name: race_year
        description: Season year, 2019-2024.
        tests:
          - not_null
      - name: circuit_key
        description: >
          FK to dim_circuits.circuit_key. Event-level, not venue-level, so double-headers at one
          venue are separate keys (british_grand_prix vs 70th_anniversary_grand_prix).
        tests:
          - not_null
      - name: hard_code
        description: C-code badged as P Zero White hard for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: medium_code
        description: C-code badged as P Zero Yellow medium for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: soft_code
        description: >
          C-code badged as P Zero Red soft for this race. Usually one step softer than
          medium_code, but not always: 2022 Australia is C2/C3/C5, a deliberate C4 skip
          verified at source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: source_url
        description: Pirelli press URL this row is attributed to. Mostly non-resolving; see description.
        tests:
          - not_null

  - name: race_scheduled_laps
    description: >
      The scheduled race distance in laps, one row per race (WI-05: F6, F32, F52). The fuel
      model's lap count and burn rate both derive from scheduled_laps, a PRE-RACE quantity,
      instead of MAX(lap_number) over the race's own (valid) laps, which read how the race
      ended. Source: the F1 live-timing LapCount stream's TotalLaps ("intended number of
      total laps", fetched through fastf1.api.lap_count) -- the bronze event schedule has no
      lap count. scheduled_laps is the FIRST value, announced before the start;
      total_laps_final is the last, which differs only where race control changed the
      distance (e.g. 2024 São Paulo 71 -> 69 after an aborted start). Generated by
      ingestion/scripts/fetch_scheduled_laps.py; a new season is appended with
      `--write --season YYYY`. assert_fuel_load_matches_scheduled_distance fails the build
      on any race without a row, and checks scheduled_laps x lap length is a 250-320 km
      race distance.
    columns:
      - name: race_id
        description: Primary key, the FastF1 event id 'YYYY_R' (typed VARCHAR in dbt_project.yml).
        tests:
          - not_null
          - unique
      - name: race_year
        description: Season.
        tests:
          - not_null
      - name: scheduled_laps
        description: Laps scheduled before the start (first TotalLaps in the LapCount stream).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 40
                max_value: 100
      - name: total_laps_final
        description: Last TotalLaps value (the distance after any race-control change).
      - name: max_current_lap
        description: Last CurrentLap the feed reported (laps actually run); audit only.
      - name: source
        description: Where scheduled_laps came from.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['f1_livetiming_lapcount']

  - name: circuit_reference
    description: >
      Per-circuit physical parameters including weight_penalty_factor.
      The weight_penalty_factor is calibrated by fit_weight_penalty.py from
      first-stint regression against actual lap times; the prior was a formula
      based on corner_count and avg_lateral_g.
    columns:
      - name: circuit_key
        description: Primary key   unique circuit identifier matching stg_laps.circuit_key.
        tests:
          - not_null
          - unique
      - name: weight_penalty_factor
        description: >
          Lap-time improvement per kg of fuel burned (s/kg).
          Typical range: 0.020–0.040 s/kg. Low-energy circuits (Monaco, Singapore)
          sit at the lower end; high-energy circuits (Suzuka, Spa) at the higher end.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.010
                max_value: 0.060
      - name: fuel_consumption_rate_kg_per_lap
        description: >
          LEGACY -- a hand-set burn estimate (kg/lap) that neither the fuel model (since WI-05)
          nor fit_weight_penalty.py (since WI-13, F55) reads: both use
          int_lap_fuel_state.fuel_consumption_rate_kg_per_lap, the FIA limit over the scheduled
          laps. Kept for the app's Degradation Simulator, which reads it through dim_circuits.
      - name: fit_date
        description: ISO date when the weight_penalty_factor was last calibrated.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date is not null"
              config:
                severity: warn

  - name: driver_isolation_method_scores
    description: >
      Method score per driver-isolation rating (WI-16), written by WI-16b's
      scripts/validate_driver_isolation.py --write-seed from the V1-V6 validation
      (pre-registered in _roadmap/_fixes/wi/WI-16-cumulative-driver-isolation.md). Committed
      by WI-16a with three unvalidated rows and NULL scores, so every confidence_pct is NULL
      and every trust_label 'unvalidated' until the method is graded.
    columns:
      - name: rating
        description: pure, tactical or relative.
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['pure', 'tactical', 'relative']
      - name: method_score
        description: >
          Weighted mean of the rating's V-test scores (PASS 1, MARGINAL 0.5, FAIL 0), or 0
          on a critical fail; in [0, 1]. NULL until validated.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: grade
        description: A (>= 0.9), B (>= 0.75), C (>= 0.5), F (< 0.5 or a critical fail; suppresses the rating), or unvalidated.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'F', 'unvalidated']
      - name: tests_applicable
        description: V-tests applicable to the rating.
      - name: tests_passed
        description: Of those, how many PASSed.
      - name: critical_failed
        description: The critical tests that FAILed, if any (a critical fail sets the score to 0).
      - name: validated_at
        description: UTC timestamp of the validation run.
      - name: substrate
        description: What was validated (git SHA and warehouse mtime).
      - name: report_path
        description: Path of the validation report the score came from.

  - name: label_stability_baseline
    description: >
      WI-01 (T9, F5) frozen per-season label snapshot, taken the day the label spine
      version bumped (2026-09-27). assert_prior_season_labels_frozen.sql warns if a
      COMPLETE season's next_5_lap_cumulative_jump_s stats drift from this on a later
      build -- a sign a pooled parameter (theta_air, a compound refit, ...) silently
      relabelled already-published history. Refresh deliberately (with a note here and
      in the label-version doc) the next time the label version bumps.
      Re-taken 2026-09-27 after W40 moved theta_air_label_value from 0.5033 (WI-01's
      interim pooled value) to 0.331: the second half of the same bump (WI-01 + WI-12).
      Row counts unchanged; five of seven season means moved by more than 0.001 s.
    columns:
      - name: race_year
        description: Season year. Excludes the latest ingested season (still receiving rows).
        tests:
          - not_null
          - unique
      - name: row_count
        description: Count of fct_cliff_prediction_features rows with a non-null next_5_lap_cumulative_jump_s, for this season, at freeze time.
        tests:
          - not_null
      - name: mean_next_5_lap_jump_s
        description: AVG(next_5_lap_cumulative_jump_s) for this season, at freeze time, rounded to 4 places.
        tests:
          - not_null
