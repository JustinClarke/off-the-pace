version: 2

seeds:
  - name: compound_cliff_params
    description: >
      Fitted tyre cliff parameters per (circuit_key, compound_code, season).
      Values are produced by the survival-analysis fitter in
      tasks/coefficients/fit_compound_cliff.py and promoted via seed_writer.py.
      Placeholder rows have notes containing "placeholder".
    columns:
      - name: circuit_key
        description: FK to dim_circuits.circuit_key.
        tests:
          - not_null
      - name: compound_code
        description: >
          Tyre compound identifier (SOFT, MEDIUM, HARD, INTERMEDIATE, WET), plus the
          pre-2019 legacy names SUPERSOFT/ULTRASOFT/HYPERSOFT, fitted 2018-only (see
          work item 08a).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: season
        description: F1 season year this fit applies to.
        tests:
          - not_null
      - name: compound_cliff_onset_laps
        description: Estimated lap-in-stint at which the tyre cliff begins (KM survival median).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 5
                max_value: 100
      - name: compound_cliff_severity
        description: >
          The cliff STEP in seconds, ordinary linear wear already excluded: the cell's trimmed
          mean, over its stints, of the vertical gap at tyre age onset + cliff_ramp_span_laps
          (2.5) between a line fitted through the pre-cliff laps and one through the post-cliff
          laps (survival.py::estimate_cliff_severity). The wear curve adds it on top of
          wear_gradient * age, ramped in over the same 2.5 laps (macros/compound_cliff_wear.sql).
          A small fitted value is kept as measured (CO-02 / T2: "little or no cliff"). A NEGATIVE
          estimate (the post-cliff line below the pre-cliff line) is stored as 0.0: a cliff that
          makes the car faster is not a cliff, and the curve floors the plateau at zero anyway.
          So 0.0 is a real, clipped value, which is why the lower bound is 0.0, not 0.1.
          Above the 1.5 s winsorisation cap, or with no estimate, the class default is used
          (severity_source = class_default).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.0
                max_value: 8.0
      - name: compound_wear_gradient
        description: Steady-state degradation rate (seconds per lap) before cliff onset.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.005
                max_value: 0.300
      - name: fit_source
        description: >
          The tier the cell's fit was attempted at: cox_km_survival (this season's stints),
          cross_season_fallback (the venue's stints pooled across seasons), compound_class_default
          (too few stints for either), or carried_forward_<season> (no fit for this season; that
          earlier season's cell copied unchanged). Cell-level only -- see the three *_source
          columns for where each parameter actually came from.
        tests:
          - not_null
      - name: onset_source
        description: >
          Where compound_cliff_onset_laps came from: fitted (this cell's own season),
          cross_season_fallback (venue pooled across seasons), class_default (COMPOUND_DEFAULTS, or
          a compound-class value explained in notes), carried_forward (copied from an earlier
          season's fitted or cross-season value). A class default stays class_default when it is
          carried forward. Recorded at fit time by fit_compound_cliff.py. Rows fitted before that
          (fit_date up to 2026-09-22) were labelled from their values: a parameter exactly equal to
          its class default is class_default. A fired default always lands exactly on the default,
          so that labelling can only over-report defaults (a genuine estimate that happens to equal
          one), never hide one.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: gradient_source
        description: Where compound_wear_gradient came from; same vocabulary and history as onset_source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: severity_source
        description: Where compound_cliff_severity came from; same vocabulary and history as onset_source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fitted', 'cross_season_fallback', 'class_default', 'carried_forward']
      - name: fit_date
        description: ISO date when these coefficients were last fitted.
        tests:
          - not_null
          # Warn (not error) if fit_date is more than 365 days old.
          # A stale fit is a maintenance concern, not a build blocker.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date != '2024-01-15'"  # exclude the original placeholder date
              config:
                severity: warn

  - name: tyre_allocations
    description: >
      Pirelli weekend compound nominations, 2019-2025, one row per race (151 rows: 128 for
      2019-2024, covering every ingested race in that span, plus 23 for 2025, which covers 23 of the
      24 ingested 2025 races; Miami is absent, so 2025_6 has no compound_code). Maps the relative hard/medium/soft badging back to the
      absolute C1-C5 scale, which compound_label alone cannot express since Pirelli picks 3 of 5
      physical compounds per weekend.

      PROVENANCE - USER-SUPPLIED AND SELF-VERIFIED, not machine-sourced. source_url attributes
      each row to a Pirelli per-race preview, but only 47 of the 128 URLs resolve; the live press
      site no longer serves its pre-2025 archive. Accepted on the user's authority to unblock
      08d's consumers, and expected to be re-sourced later. A URL here is an attribution, not
      evidence. See _improvements/work/08-foundations-repair.md section 08d.

      2025 ROWS ARE CARRIED FORWARD, NOT NOMINATIONS. Every 2025 source_url is the literal
      string 'carried_from_2023' or 'carried_from_2024': the C-codes are that circuit's most
      recent earlier allocation, an assumption rather than a Pirelli 2025 preview. Pirelli can change a
      circuit's nomination between seasons, so a carried row can name the wrong rubber (W50 dropped
      the earlier unverified 2025 rows for this reason). Do not quote a 2025 compound_code as sourced until each
      row is checked against source. The per-season row counts are pinned by
      assert_tyre_allocations_rows_per_season.

      KNOWN WRONG (WC-16, 2026-10-31). A fetched source for every race
      (_roadmap/_wake-calibration/_evidence/WC-16-2026-10-31/c_numbers.csv and
      c_numbers_report.md) confirms all 104 rows for 2019-2023 and 23 of 24 for 2024, but 12 rows
      here are wrong (seed hard/medium/soft -> verified): 2024_16 Italy C2/C3/C4 -> C3/C4/C5;
      2025_5 Saudi Arabia C2/C3/C4 -> C3/C4/C5; 2025_7 Emilia Romagna C3/C4/C5 -> C4/C5/C6;
      2025_8 Monaco C3/C4/C5 -> C4/C5/C6; 2025_10 Canada C3/C4/C5 -> C4/C5/C6; 2025_12 Britain
      C1/C2/C3 -> C2/C3/C4; 2025_13 Belgium C2/C3/C4 -> C1/C3/C4; 2025_15 Netherlands C1/C2/C3 ->
      C2/C3/C4; 2025_16 Italy C2/C3/C4 -> C3/C4/C5; 2025_17 Azerbaijan C3/C4/C5 -> C4/C5/C6;
      2025_19 United States C2/C3/C4 -> C1/C3/C4; 2025_20 Mexico City C3/C4/C5 -> C2/C4/C5. The
      missing 2025_6 Miami row is C3/C4/C5. So 11 of the 23 carried 2025 rows are wrong. The
      correction is HELD: this seed feeds fct_power_law_training (via int_stint_geometry and
      int_power_law_lap), an ML input, so it is corrected together with the ML redo (PK1,
      _roadmap/_ai-integration). The C6 rows also need the C1-C5 accepted_values below widened.
      The wake placeholder does not read this seed; it uses the verified copy in
      wake_placeholder_tyre_allocation.
    columns:
      - name: race_year
        description: Season year, 2019-2025.
        tests:
          - not_null
      - name: circuit_key
        description: >
          FK to dim_circuits.circuit_key. Event-level, not venue-level, so double-headers at one
          venue are separate keys (british_grand_prix vs 70th_anniversary_grand_prix).
        tests:
          - not_null
      - name: hard_code
        description: C-code badged as P Zero White hard for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: medium_code
        description: C-code badged as P Zero Yellow medium for this race.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: soft_code
        description: >
          C-code badged as P Zero Red soft for this race. Usually one step softer than
          medium_code, but not always: 2022 Australia is C2/C3/C5, a deliberate C4 skip
          verified at source.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5']
      - name: source_url
        description: Pirelli press URL this row is attributed to. Mostly non-resolving; see description.
        tests:
          - not_null

  - name: compound_hardness_scale
    description: >
      Declared cross-era ordinal hardness rank (1 = hardest, 7 = softest) for every compound
      identity the warehouse can see: the 2018 legacy names (SUPERHARD..HYPERSOFT, a 7-point
      range; SUPERHARD was never nominated for a dry race but is included so the scale has no
      hole below HARD) and the 2019+ C1-C6 scale. Grain is (compound_code, era): a C-code's
      hardness position does not move, but era is carried as a second feature so a model can
      absorb construction-generation shifts (the 2022 18-inch switch) at equal hardness rank.
      Built for WI-17 (functional degradation parametrization); assert_hardness_scale_no_gaps.sql
      requires every (compound, era) pair the warehouse actually uses to resolve here.

      PROVENANCE - the ordinal correspondence (2018 name -> rank, C-code -> rank) is a stated
      modelling assumption, not a physical hardness measurement, matching tyre_allocations'
      non-quotable status. WI-17's T55 tests the 2018 mapping by leave-out; T54 leaves out C6
      (59 laps in the whole warehouse as of 2026-09-28, all 2025) and reports against C5.
    columns:
      - name: compound_code
        description: 2018 legacy name (SUPERHARD, HARD, MEDIUM, SOFT, SUPERSOFT, ULTRASOFT, HYPERSOFT) or C1-C6.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'SUPERHARD', 'HARD', 'MEDIUM', 'SOFT', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: era
        description: Tyre-construction generation the row applies to.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['2018', '2019-21', '2022+']
      - name: hardness_rank
        description: Ordinal position on the declared 1 (hardest) - 7 (softest) scale.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 7
      - name: provenance
        description: How this row's rank was assigned, and its assumption/validation status (see description).
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [compound_code, era]

  - name: race_scheduled_laps
    description: >
      The scheduled race distance in laps, one row per race (WI-05: F6, F32, F52). The fuel
      model's lap count and burn rate both derive from scheduled_laps, a PRE-RACE quantity,
      instead of MAX(lap_number) over the race's own (valid) laps, which read how the race
      ended. Source: the F1 live-timing LapCount stream's TotalLaps ("intended number of
      total laps", fetched through fastf1.api.lap_count) -- the bronze event schedule has no
      lap count. scheduled_laps is the FIRST value, announced before the start;
      total_laps_final is the last, which differs only where race control changed the
      distance (e.g. 2024 São Paulo 71 -> 69 after an aborted start). Generated by
      ingestion/scripts/fetch_scheduled_laps.py; a new season is appended with
      `--write --season YYYY`. assert_fuel_load_matches_scheduled_distance fails the build
      on any race without a row, and checks scheduled_laps x lap length is a 250-320 km
      race distance.
    columns:
      - name: race_id
        description: Primary key, the FastF1 event id 'YYYY_R' (typed VARCHAR in dbt_project.yml).
        tests:
          - not_null
          - unique
      - name: race_year
        description: Season.
        tests:
          - not_null
      - name: scheduled_laps
        description: Laps scheduled before the start (first TotalLaps in the LapCount stream).
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 40
                max_value: 100
      - name: total_laps_final
        description: Last TotalLaps value (the distance after any race-control change).
      - name: max_current_lap
        description: Last CurrentLap the feed reported (laps actually run); audit only.
      - name: source
        description: Where scheduled_laps came from.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['f1_livetiming_lapcount']

  - name: circuit_reference
    description: >
      Per-circuit physical parameters including weight_penalty_factor.
      The weight_penalty_factor is calibrated by fit_weight_penalty.py from
      first-stint regression against actual lap times; the prior was a formula
      based on corner_count and avg_lateral_g.
    columns:
      - name: circuit_key
        description: Primary key   unique circuit identifier matching stg_laps.circuit_key.
        tests:
          - not_null
          - unique
      - name: weight_penalty_factor
        description: >
          Lap-time improvement per kg of fuel burned (s/kg).
          Typical range: 0.020–0.040 s/kg. Low-energy circuits (Monaco, Singapore)
          sit at the lower end; high-energy circuits (Suzuka, Spa) at the higher end.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.010
                max_value: 0.060
      - name: fuel_consumption_rate_kg_per_lap
        description: >
          LEGACY -- a hand-set burn estimate (kg/lap) that neither the fuel model (since WI-05)
          nor fit_weight_penalty.py (since WI-13, F55) reads: both use
          int_lap_fuel_state.fuel_consumption_rate_kg_per_lap, the FIA limit over the scheduled
          laps. Kept for the app's Degradation Simulator, which reads it through dim_circuits.
      - name: fit_date
        description: ISO date when the weight_penalty_factor was last calibrated.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ \"'\" ~ (modules.datetime.date.today()-modules.datetime.timedelta(days=365)).isoformat() ~ \"'\" }}"
                row_condition: "fit_date is not null"
              config:
                severity: warn

  - name: driver_isolation_method_scores
    description: >
      Method score per driver-isolation rating (WI-16), written by WI-16b's
      scripts/validate_driver_isolation.py --write-seed from the V1-V6 validation
      (declared in advance in _roadmap/_fixes/wi/WI-16-cumulative-driver-isolation.md). Committed
      by WI-16a with three unvalidated rows and NULL scores, so every confidence_pct is NULL
      and every trust_label 'unvalidated' until the method is graded.
    columns:
      - name: rating
        description: pure, tactical or relative.
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['pure', 'tactical', 'relative']
      - name: method_score
        description: >
          Weighted mean of the rating's V-test scores (PASS 1, MARGINAL 0.5, FAIL 0), or 0
          on a critical fail; in [0, 1]. NULL until validated.
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1
      - name: grade
        description: A (>= 0.9), B (>= 0.75), C (>= 0.5), F (< 0.5 or a critical fail; suppresses the rating), or unvalidated.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C', 'F', 'unvalidated']
      - name: tests_applicable
        description: V-tests applicable to the rating.
      - name: tests_passed
        description: Of those, how many PASSed.
      - name: critical_failed
        description: The critical tests that FAILed, if any (a critical fail sets the score to 0).
      - name: validated_at
        description: UTC timestamp of the validation run.
      - name: substrate
        description: What was validated (git SHA and warehouse mtime).
      - name: report_path
        description: Path of the validation report the score came from.

  - name: label_stability_baseline
    description: >
      WI-01 (T9, F5) frozen per-season label snapshot, taken the day the label spine
      version bumped (2026-09-27). assert_prior_season_labels_frozen.sql warns if a
      COMPLETE season's next_5_lap_cumulative_jump_s stats drift from this on a later
      build -- a sign a pooled parameter (theta_air, a compound refit, ...) silently
      relabelled already-published history. Refresh deliberately (with a note here and
      in the label-version doc) the next time the label version bumps.
      Re-taken 2026-09-27 after W40 moved theta_air_label_value from 0.5033 (WI-01's
      interim pooled value) to 0.331: the second half of the same bump (WI-01 + WI-12).
      Row counts unchanged; five of seven season means moved by more than 0.001 s.
      Re-taken 2026-10-15 (CO-03) for the v15 label bump, which covers everything since
      the 09-27 snapshot: the WI-02b seed re-estimate (2026-10-03), CO-02 (cliff label:
      wear no longer subtracted twice, regression severity, 2018 fitted in-sample under
      CD2 = C, 2025 refit on 2018-24, 2.5-lap ramp; seed sha256 12fcc131...77f8) and
      CO-04 (missing telemetry is NULL not clear air, restart laps get their own field
      mean, thin field-base cells skipped). One bump, one snapshot. All seven seasons
      moved: row counts -122 to -1,278 (2022 +373), means 2018 -0.1736 -> -0.2810,
      2023 -0.0617 -> -0.3734, 2024 -0.1782 -> -0.3252; theta_air unchanged at 0.331.
      Re-taken 2026-10-24 (CO-17 trusted rebuild) for the v16 label bump: CO-09 (tyre-run
      key, including the 2b penalty joins) and CO-15 (linear wear held past cliff onset +
      5 laps; 23,973 int_compound_cliff_predicted rows). One bump, one snapshot. Row
      counts unchanged except 2020 9,360 -> 9,383 (CO-09 re-key). Means 2018 -0.2810 ->
      +0.0519, 2019 -0.2265 -> -0.1836, 2020 -0.1355 -> -0.0806, 2021 -0.1244 -> -0.0042,
      2022 -0.1608 -> -0.0361, 2023 -0.3734 -> -0.2705, 2024 -0.3252 -> -0.1779; about
      0.01-0.02 s of that is CO-09, the rest CO-15. theta_air unchanged at 0.331.
    columns:
      - name: race_year
        description: Season year. Excludes the latest ingested season (still receiving rows).
        tests:
          - not_null
          - unique
      - name: row_count
        description: Count of fct_cliff_prediction_features rows with a non-null next_5_lap_cumulative_jump_s, for this season, at freeze time.
        tests:
          - not_null
      - name: mean_next_5_lap_jump_s
        description: AVG(next_5_lap_cumulative_jump_s) for this season, at freeze time, rounded to 4 places.
        tests:
          - not_null

  - name: wake_placeholder_values
    description: >
      WC-11 INTERIM PLACEHOLDER wake-cost values (owner decision 2026-10-30: ship arbitrary,
      clearly-labelled per-circuit values while the WC-10 calibration is paused). Every number is
      an ASSUMPTION from general F1 knowledge, not a measurement or a fit: a car within about 1 s
      of the car ahead for a whole lap is assumed to lose a few tenths per lap from the wake
      (fast-corner circuits 0.45 s, medium 0.30 s, slow 0.20 s), tapering linearly to nothing by
      2 s (the taper is in int_lap_wake_placeholder_cost). Row kinds: class_default (the per-class
      value), circuit (the circuit's class; a non-blank loss overrides the class value),
      unlisted_default (class for circuits with no row). No number here comes from the archived
      dirty-air method (DA-03). To swap in calibrated values: replace the loss column (per class or
      per circuit), set value_kind and widen the accepted values below; consumers do not change.
      Rationale per row in `basis`; full note in
      _roadmap/_wake-calibration/wi/WC-11-interim-placeholder-values.md.
    columns:
      - name: row_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [class_default, circuit, unlisted_default]
                quote: true
      - name: key
        description: Corner class for class_default rows, race_to_track.track_id for circuit rows, 'unlisted' for the default row.
        tests: [not_null, unique]
      - name: corner_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fast, medium, slow]
                quote: true
      - name: loss_s_per_lap_within_1s
        description: Assumed seconds per lap for a full lap within 1 s of the car ahead. Required on class_default rows; blank on circuit rows inherits the class value.
        tests:
          - not_null:
              config:
                where: "row_kind = 'class_default'"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.0
                inclusive: true
      - name: value_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [placeholder]
                quote: true
      - name: basis
        description: Why the row has this value (an assumption, stated as one).
        tests: [not_null]

  - name: wake_placeholder_rule
    description: >
      WC-12: the constants of the placeholder wake rule in int_wake_placeholder_race_loss
      (loss = era_factor x loss_at_reference_s x corner_index / reference_index, clamped to
      [min_s, max_s], rounded to 0.01 s). Every value is an ASSUMPTION from general F1 knowledge and
      the published rule changes, stated in `basis`; nothing is fitted and no lap time, segment time
      or speed was read to set them. No number here comes from the archived dirty-air method
      (DA-03). Rows: weight (fast-corner equivalents per corner class), scale, bound, era
      (season_from..season_to inclusive), factor (WC-13: neutral_default, the 1.00 used, and
      flagged, when a lap's compound or constructor factor cannot be resolved).
    columns:
      - name: param_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [weight, scale, bound, era, factor]
                quote: true
      - name: param
        tests: [not_null, unique]
      - name: value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
                inclusive: true
      - name: basis
        tests: [not_null]

  - name: wake_placeholder_race_structure
    description: >
      WC-12: per-race corner STRUCTURE for the placeholder rule, written by
      transform/tasks/wake_calibration/wc12_structure.py from the WC-03 pass table's structure
      columns (corner_class, segment_basis) and layout_checks.csv (FastF1 corner count, telemetry lap
      length). No outcome column is read. n_fast / n_medium / n_slow count braking corners by apex
      class (slow < 120, medium 120-200, fast >= 200 km/h, fixed by the WC-01 builder); n_flat
      counts kinks taken flat. n_* are medians over every season of the same layout (circuit slug and
      FastF1 corner count); race_n_* are that race's own counts, kept for audit.
    columns:
      - name: race_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: layout_seasons
        tests: [not_null]

  - name: wake_placeholder_compound_factor
    description: >
      WC-13: an ASSUMED per-lap tyre multiplier on the race's placeholder wake loss, by the lap's
      RELATIVE dry compound class in that race (SOFT / MEDIUM / HARD = softest / middle / hardest of the
      race's three nominated dry compounds), plus INTERMEDIATE and WET (neutral 1.00, flagged). A small
      bounded thermal and grip sensitivity (softer compounds overheat and slide more when following),
      NOT tyre wear: wear builds over a stint and is not a per-lap aero loss, so it stays out. Bounded
      0.90-1.15 and monotone SOFT >= MEDIUM >= HARD (tested). WC-16 (DD-WC28): a 2019+ race with a
      verified C-number trio (wake_placeholder_tyre_allocation) now uses the C-number rule
      (wake_placeholder_c_number_factor) instead; the SOFT / MEDIUM / HARD rows here are the
      relative-class fallback for 2018 (named compounds, no C-numbers) and any race with no trio
      (compound_factor_basis = relative_class). INTERMEDIATE and WET stay neutral. The user-supplied
      tyre_allocations seed is still not read. Nothing here is fitted and no lap time or speed was
      read. See the WC-13 and WC-16 sections of
      _roadmap/_wake-calibration/wi/WC-11-interim-placeholder-values.md.
    columns:
      - name: compound_class
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: [SOFT, MEDIUM, HARD, INTERMEDIATE, WET]
                quote: true
      - name: factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.9
                max_value: 1.15
                inclusive: true
      - name: source_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [assumed, neutral_by_rule]
                quote: true
      - name: basis
        tests: [not_null]

  - name: wake_placeholder_constructor_factor
    description: >
      WC-13: per-(season, constructor_id) car multiplier on the placeholder wake loss. PLUMBING ONLY:
      every row is a neutral 1.00 with basis "neutral default, no public evidence used". Without
      measured outcomes any per-team number would be a guess, and a guess shown as "team X suffers
      more in the wake" is an unsupported claim about a real company. A non-neutral row is allowed
      only with a public, non-outcome, checkable reason recorded in basis (source_type =
      public_concept), bounded 0.95-1.05. Keyed by stg_laps.constructor_id (the FastF1 team name, the
      same key the ML side uses) per season, so a rename (Racing Point -> Aston Martin, Toro Rosso ->
      AlphaTauri -> RB -> Racing Bulls) is its own row; constructor_lineage_id
      (dim_constructors) groups the names one team has raced under. One row per (season,
      constructor_id) in stg_laps, 2018-2025 (81 rows; assert_wake_placeholder_factors checks coverage).
      WC-16 (DD-WC27, 2026-10-31): a public-concept search over all 81 rows found no explicit,
      citable, non-outcome, team-specific source for which way a car concept moves wake
      sensitivity (sources are era-wide or concept-only;
      _roadmap/_wake-calibration/_evidence/WC-16-2026-10-31/constructor_report.md), so every row stays
      neutral 1.00.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, constructor_id]
    columns:
      - name: season
        tests: [not_null]
      - name: constructor_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_constructors')
                field: constructor_id
      - name: constructor_lineage_id
        tests: [not_null]
      - name: factor
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.95
                max_value: 1.05
                inclusive: true
      - name: source_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [neutral_default, public_concept]
                quote: true
      - name: basis
        tests: [not_null]

  - name: wake_placeholder_tyre_allocation
    description: >
      WC-16: Pirelli's dry-compound nomination for every race 2018-2025 (173 rows, one per race in
      race_to_track), read ONLY by int_lap_wake_placeholder_cost for the placeholder's C-number tyre
      factor. Each row was fetched and quoted from a page (source_url; primary_pirelli = Pirelli's own
      release, secondary = a page restating it, mostly formula1.com) by the 2026-10-31 research pass
      (_roadmap/_wake-calibration/_evidence/WC-16-2026-10-31/c_numbers_report.md and c_numbers.csv,
      which has the evidence quote per row). 2019 on: hard_c / medium_c / soft_c are the C-codes
      badged hard / medium / soft (compound_scale = c_number; C6 occurs in 2025). 2018: Pirelli's
      named compounds (HYPERSOFT..HARD) are in hard_name / medium_name / soft_name and the C columns
      are NULL (compound_scale = named_2018); the model keeps the relative-class factor for 2018.
      A label can skip a C-number (2022_3 C2/C3/C5; 2025_13 and 2025_19 C1/C3/C4; 2025_20 C2/C4/C5).
      This is NOT the user-supplied tyre_allocations seed and does not change it: it differs from
      that file at 2024_16 and 11 carried-forward 2025 rows, and has 2025_6, which that file lacks
      (notes says so per row). assert_wake_placeholder_tyre_allocation checks hardness order.
    columns:
      - name: race_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('race_to_track')
                field: race_id
      - name: season
        tests: [not_null]
      - name: round
        tests: [not_null]
      - name: circuit
        tests: [not_null]
      - name: compound_scale
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [c_number, named_2018]
                quote: true
      - name: hard_c
        description: C-code badged hard (P Zero White). NULL for 2018.
        tests:
          - not_null:
              config:
                where: "compound_scale = 'c_number'"
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6']
      - name: medium_c
        description: C-code badged medium (P Zero Yellow). NULL for 2018.
        tests:
          - not_null:
              config:
                where: "compound_scale = 'c_number'"
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6']
      - name: soft_c
        description: C-code badged soft (P Zero Red). NULL for 2018.
        tests:
          - not_null:
              config:
                where: "compound_scale = 'c_number'"
          - accepted_values:
              arguments:
                values: ['C1', 'C2', 'C3', 'C4', 'C5', 'C6']
      - name: hard_name
        description: 2018 only, the Pirelli name badged hardest of the race's three.
        tests:
          - not_null:
              config:
                where: "compound_scale = 'named_2018'"
          - accepted_values:
              arguments:
                values: ['HARD', 'MEDIUM', 'SOFT', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: medium_name
        tests:
          - not_null:
              config:
                where: "compound_scale = 'named_2018'"
          - accepted_values:
              arguments:
                values: ['HARD', 'MEDIUM', 'SOFT', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: soft_name
        tests:
          - not_null:
              config:
                where: "compound_scale = 'named_2018'"
          - accepted_values:
              arguments:
                values: ['HARD', 'MEDIUM', 'SOFT', 'SUPERSOFT', 'ULTRASOFT', 'HYPERSOFT']
      - name: source_url
        tests: [not_null]
      - name: source_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [primary_pirelli, secondary]
                quote: true

  - name: wake_placeholder_c_number_factor
    description: >
      WC-16: the constants of the placeholder's C-number tyre factor (assumptions, not fits; owner
      accepted the research's option B on 2026-10-31, DD-WC28). Per lap, for a race with a C-number
      trio: tyre factor = ROUND(clamp(step x medium_shift, bound min, bound max), 4), where step is
      keyed by the lap compound's distance in C-numbers from the race's MEDIUM (positive = softer;
      -2 and 2 mean "two or more"), and medium_shift by which C-number is the race's MEDIUM. Owner
      ruling DD-WC29 (2026-10-31): every medium_shift row is 1.00. The proposed 0.97 / 1.00 / 1.03 /
      1.06 put 23 per-lap values on archived-method numbers at 3 dp and no small nudge cleared them,
      so the shift was dropped and rule 6 stays strict; the rows stay so a calibrated shift can slot
      in later. A race
      whose MEDIUM has no medium_shift row (C1 or C6) fails assert_wake_placeholder_tyre_allocation.
      Replace these rows to change the rule; the SQL holds no constant. NOT tyre wear. Source:
      _roadmap/_wake-calibration/_evidence/WC-16-2026-10-31/c_numbers_report.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [param_kind, param]
    columns:
      - name: param_kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [step, medium_shift, bound]
                quote: true
      - name: param
        tests: [not_null]
      - name: value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0.9
                max_value: 1.17
                inclusive: true
      - name: source_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [assumed]
                quote: true
      - name: basis
        tests: [not_null]
