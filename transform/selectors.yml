selectors:
  - name: fast_build
    description: "Staging and reference only  -  runs in ~2 min on CI fixtures"
    definition:
      union:
        # cautious: a test runs here only if every model it refs is selected, so a
        # relationships test on a mart (parent: a staging/reference dim) waits for Gate 1b.
        - method: path
          value: models/staging
          indirect_selection: cautious
        - method: path
          value: models/reference
          indirect_selection: cautious
        - exclude:
            - method: tag
              value: intermediate
            - method: tag
              value: marts


  - name: math_tests
    description: "Singular identity-closure tests only  -  the mathematical crown jewels"
    definition:
      method: test_type
      value: singular

  - name: intermediate_only
    description: "All intermediate models and their tests"
    definition:
      method: path
      value: models/intermediate

  - name: full_build
    description: "All models end-to-end (staging → reference → intermediate → marts)"
    definition:
      union:
        - method: path
          value: models/staging
        - method: path
          value: models/reference
        - method: path
          value: models/intermediate
        - method: path
          value: models/marts
